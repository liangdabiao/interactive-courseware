<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>阿基米德与浮力 · 03 · 称重法</title>
<style>
/* ========== 一、配色：蓝图里选定的那一组，整套课件每一页完全一样 ========== */
:root {
  --bg: #F6F1E7;                      /* 底色 */
  --surface: #FFFDF8;                 /* 卡片、面板 */
  --surface-2: #EBE4D6;               /* 凹槽、轨道、未选中的底 */
  --ink: #1F1B16;                     /* 主文字 */
  --ink-2: #5A544A;                   /* 次要文字 */
  --ink-3: #736D62;                   /* 说明文字 */
  --line: rgba(31, 27, 22, 0.14);     /* 描边、分隔线 */
  --accent: #C4411A;                  /* 唯一的强调色 */
  --accent-ink: #FFFFFF;              /* 强调色上面的文字 */
  --water: #8FA6BC;                   /* 全课唯一的附加色：水的实物色（降饱和） */
}
/* ========== 二、骨架和部件：每一页完全一样，不要改 ========== */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: clamp(16px, calc(min(1vw, 1.78vh) * 1.12), 34px); }   /* 1rem 跟着屏幕等比缩放，1080p 下约 21px。尺寸都用 rem 写 */
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.7; overflow: hidden;
  font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul, ol, figure { margin: 0; }
h1 { font-size: 3rem; line-height: 1.15; font-weight: 800; text-wrap: balance; }
h2 { font-size: 2rem; line-height: 1.2; font-weight: 800; text-wrap: balance; }
h3 { font-size: 1.3rem; line-height: 1.3; font-weight: 700; }
button { font: inherit; color: inherit; }
svg { display: block; max-width: 100%; }
/* 舞台：占满整屏。内容区 main 吃掉标题以下的全部空间 */
.stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 1.2rem;
  padding: clamp(20px, 4.5vh, 64px) clamp(20px, 5vw, 110px) clamp(16px, 3vh, 44px); }
.stage > main { flex: 1; min-height: 0; }
.kicker { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); }
.lead { font-size: 1.25rem; color: var(--ink-2); max-width: 30em; }
.small { font-size: max(0.8rem, 14px); color: var(--ink-3); }
.num { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
.hl { color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; min-height: 52px; padding: 0.5em 1.6em;
  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;
  transition: transform 0.12s, filter 0.15s, opacity 0.15s; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(0.97); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.card { background: var(--surface); border-radius: 1rem; padding: 1.4rem; }
.chip { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.15em 0.8em; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2); font-size: max(0.8rem, 14px); font-weight: 600; white-space: nowrap; }
/* 反馈区：固定放在页面里的一行，不用弹窗。对 = 强调色加对勾；错 = 文字说明加抖动，不用红色 */
.note { min-height: 3.4em; color: var(--ink-2); }
.note.good { color: var(--accent); }
.note.bad { color: var(--ink); }
.shake { animation: shake 0.32s linear; }
.pop { animation: pop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
@keyframes pop { 50% { transform: scale(1.14); } }
/* 入场：给元素加 class="in"，再用 style="--i:1" 排先后 */
.in { animation: in 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }
@keyframes in { from { opacity: 0; transform: translateY(1.2rem); } }
/* 小屏：改成可以上下滚动的单列 */
@media (max-width: 720px) {
  body { overflow: auto; }
  .stage { height: auto; min-height: 100dvh; }
  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
/* ========== 三、本页样式：只有这一段每页不同 ========== */
.duo { display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr); gap: 2.2rem; min-height: 0; }
.fig { min-height: 0; display: flex; align-items: center; justify-content: center; }
.fig svg { max-height: 100%; width: auto; max-width: 100%; }
.right { display: flex; flex-direction: column; gap: 1.1rem; min-height: 0; }
.steps { display: flex; flex-direction: column; }
.step { display: flex; gap: 0.8em; align-items: flex-start; text-align: left; padding: 0.65em 0.3em;
  border: 0; background: none; border-bottom: 1px dashed var(--line); cursor: pointer;
  opacity: 0.32; transform: translateX(-6px); transition: opacity 0.3s, transform 0.3s; }
.step:last-of-type { border-bottom: 0; }
.step.on { opacity: 1; transform: none; }
.step .dot { flex: none; display: grid; place-items: center; width: 1.7em; height: 1.7em; border-radius: 50%;
  background: var(--surface-2); color: var(--ink-2); font-weight: 700; font-size: 0.95rem; }
.step.done .dot { background: var(--accent); color: var(--accent-ink); }
.formula { font-size: 1.7rem; font-weight: 800; text-align: center; letter-spacing: 0.04em;
  border: 1.5px solid var(--line); transition: border-color 0.3s, color 0.3s; }
.formula.lit { border-color: var(--accent); color: var(--accent); }
.formula sub { font-size: 0.55em; font-weight: 700; }
.actions { display: flex; justify-content: flex-end; margin-top: auto; }
/* SVG 内部件的过渡 */
#waterR { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); transition: transform 0.8s ease; }
#fbArrow { opacity: 0; transform: translateY(14px); transition: opacity 0.45s ease 0.25s, transform 0.45s ease 0.25s; }
</style>
</head>
<body>
<div class="stage">
  <header>
    <p class="kicker in">讲解 · 预备证据</p>
    <h1 class="in" style="--i:1">称一称，浮力有多大</h1>
  </header>
  <main class="duo">
    <figure class="fig in" style="--i:2">
      <svg viewBox="0 0 460 540" role="img" aria-label="弹簧测力计称石块">
        <line x1="230" y1="8" x2="230" y2="36" stroke="var(--ink)" stroke-width="3"/>
        <rect x="150" y="36" width="160" height="180" rx="14" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
        <rect x="170" y="56" width="120" height="120" rx="8" fill="var(--surface-2)"/>
        <g stroke="var(--ink-3)" stroke-width="2">
          <line x1="270" y1="66" x2="282" y2="66"/><line x1="270" y1="91" x2="282" y2="91"/>
          <line x1="270" y1="116" x2="282" y2="116"/><line x1="270" y1="141" x2="282" y2="141"/>
          <line x1="270" y1="166" x2="282" y2="166"/>
        </g>
        <g font-size="15" fill="var(--ink-3)" text-anchor="end" font-family="ui-monospace, Menlo, monospace">
          <text x="264" y="71">0</text><text x="264" y="146">3</text><text x="264" y="171">4</text>
        </g>
        <line id="ptr" x1="176" y1="66" x2="266" y2="66" stroke="var(--accent)" stroke-width="3"/>
        <text id="bigRead" x="326" y="70" font-size="34" font-weight="800" fill="var(--ink)" font-family="ui-monospace, Menlo, monospace">0.0</text>
        <text id="whichRead" x="326" y="100" font-size="15" fill="var(--ink-3)">还没开始</text>
        <line x1="230" y1="216" x2="230" y2="240" stroke="var(--ink)" stroke-width="3"/>
        <g stroke="var(--ink)" stroke-width="3" stroke-linecap="round">
          <line x1="222" y1="244" x2="238" y2="252"/><line x1="222" y1="256" x2="238" y2="264"/><line x1="222" y1="268" x2="238" y2="276"/>
        </g>
        <line x1="230" y1="280" x2="230" y2="316" stroke="var(--ink)" stroke-width="3"/>
        <g id="stoneG">
          <polygon points="230,318 268,330 282,362 262,392 216,396 188,368 196,334" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
        </g>
        <rect x="90" y="300" width="280" height="210" rx="10" fill="none" stroke="var(--ink)" stroke-width="3"/>
        <rect id="waterR" x="94" y="330" width="272" height="176" fill="var(--water)" opacity="0.5"/>
        <g id="fbArrow">
          <line x1="304" y1="384" x2="304" y2="312" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
          <polygon points="304,296 291,316 317,316" fill="var(--accent)"/>
          <text x="318" y="336" font-size="24" font-weight="800" fill="var(--accent)">F浮</text>
        </g>
        <text x="104" y="330" font-size="16" fill="var(--ink-3)" opacity="0.9">水</text>
      </svg>
    </figure>
    <div class="right">
      <div class="steps">
        <button class="step" data-stage="1"><span class="dot num">1</span><span>先在空气里称：读出物重 <b class="num">G = 4.0 N</b>。</span></button>
        <button class="step" data-stage="2"><span class="dot num">2</span><span>再浸入水中称：读数掉到 <b class="num">F示 = 2.4 N</b>——少掉的读数，就是水向上托它的力。</span></button>
        <button class="step" data-stage="3"><span class="dot num">3</span><span>相减：<b class="num">F浮 = 4.0 − 2.4 = 1.6 N</b>。</span></button>
      </div>
      <div class="formula card num" id="formula">F<sub>浮</sub> ＝ G − F<sub>示</sub></div>
      <p class="note in" style="--i:3" id="note"></p>
      <div class="actions">
        <button class="btn in" style="--i:4" id="mainBtn">开始 · 先在空气里称一次</button>
      </div>
    </div>
  </main>
</div>
<script>
/* ========== 公共脚本：每一页完全一样，不要改 ========== */
/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */
function deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }
addEventListener('keydown', function (e) {
  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');
});
/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */
var deckMuted = false, deckAudio = null;
try { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}
addEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });
function sfx(name) {
  if (deckMuted) return;
  try {
    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();
    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];
    notes.forEach(function (n) {
      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];
      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);
      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);
    });
  } catch (e) {}
}
/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */
var stars = {
  key: 'deck:stars:' + document.title.split('·')[0].trim(),
  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },
  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },
  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }
};
/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */
function fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }
</script>
<script>
/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */
/* 石块三次读数（g 取 10 N/kg；这块石头在第 4、5 页还会再用） */
var STONE = { G: 4.0, FS: 2.4, FB: 1.6 };
/* 每一步的反馈文案 */
var NOTE_TEXT = [
  '开始：先看它在空气里的读数。',
  '石头一沾水，读数就掉了。少掉的那截读数，就是水向上托它的力。',
  '这就是称重法。记住这组数：4.0、2.4、1.6——下一页你要亲手做一遍。'
];
var stage = 0;
var steps = document.querySelectorAll('.step');
var note = document.getElementById('note');
var mainBtn = document.getElementById('mainBtn');
var ptr = document.getElementById('ptr');
var bigRead = document.getElementById('bigRead');
var whichRead = document.getElementById('whichRead');
function setStage(n) {
  if (n <= stage) return;
  stage = n;
  if (n < 3) sfx('tap');
  for (var i = 0; i < steps.length; i++) {
    steps[i].classList.toggle('on', i < n);
    steps[i].classList.toggle('done', i < n);
  }
  if (n === 1) {
    ptr.setAttribute('y1', 166); ptr.setAttribute('y2', 166);
    bigRead.textContent = STONE.G.toFixed(1);
    whichRead.textContent = '空气里 · 物重 G';
    note.textContent = NOTE_TEXT[0];
    mainBtn.textContent = '浸入水中';
  } else if (n === 2) {
    ptr.setAttribute('y1', 126); ptr.setAttribute('y2', 126);
    bigRead.textContent = STONE.FS.toFixed(1);
    whichRead.textContent = '浸入水中 · 读数 F示';
    note.textContent = NOTE_TEXT[1];
    mainBtn.textContent = '算出差值';
  } else if (n === 3) {
    ptr.setAttribute('y1', 126); ptr.setAttribute('y2', 126);
    bigRead.textContent = STONE.FB.toFixed(1);
    whichRead.textContent = '差值 · 这就是浮力';
    document.getElementById('waterR').style.transform = 'scaleY(1)';
    document.getElementById('fbArrow').style.opacity = 1;
    document.getElementById('fbArrow').style.transform = 'translateY(0)';
    document.getElementById('formula').classList.add('lit');
    note.textContent = NOTE_TEXT[2];
    note.classList.add('good');
    fx(bigRead, 'pop');
    sfx('ok');
    mainBtn.textContent = '去实验台，亲手做一遍 →';
  }
}
mainBtn.addEventListener('click', function () {
  if (stage === 0) { setStage(1); }
  else if (stage === 1) { setStage(2); }
  else if (stage === 2) { setStage(3); }
  else { sfx('tap'); deck('next'); }
});
steps.forEach(function (btn) {
  btn.addEventListener('click', function () { setStage(Number(btn.dataset.stage)); });
});
note.textContent = '石头挂好了。开始第一步？';
</script>
</body>
</html>
