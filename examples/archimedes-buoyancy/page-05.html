<title>阿基米德与浮力 · 05 · 阿基米德原理</title>
<style>
/* ========== 一、配色：蓝图里选定的那一组，整套课件每一页完全一样 ========== */
:root {
  --bg: #F6F1E7;                      /* 底色 */
  --surface: #FFFDF8;                 /* 卡片、面板 */
  --surface-2: #EBE4D6;               /* 凹槽、轨道、未选中的底 */
  --ink: #1F1B16;                     /* 主文字 */
  --ink-2: #5A544A;                   /* 次要文字 */
  --ink-3: #736D62;                   /* 说明文字 */
  --line: rgba(31, 27, 22, 0.14);     /* 描边、分隔线 */
  --accent: #C4411A;                  /* 唯一的强调色 */
  --accent-ink: #FFFFFF;              /* 强调色上面的文字 */
  --water: #8FA6BC;                   /* 全课唯一的附加色：水的实物色（降饱和） */
}
/* ========== 二、骨架和部件：每一页完全一样，不要改 ========== */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: clamp(16px, calc(min(1vw, 1.78vh) * 1.12), 34px); }   /* 1rem 跟着屏幕等比缩放，1080p 下约 21px。尺寸都用 rem 写 */
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.7; overflow: hidden;
  font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul, ol, figure { margin: 0; }
h1 { font-size: 3rem; line-height: 1.15; font-weight: 800; text-wrap: balance; }
h2 { font-size: 2rem; line-height: 1.2; font-weight: 800; text-wrap: balance; }
h3 { font-size: 1.3rem; line-height: 1.3; font-weight: 700; }
button { font: inherit; color: inherit; }
svg { display: block; max-width: 100%; }
/* 舞台：占满整屏。内容区 main 吃掉标题以下的全部空间 */
.stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 1.2rem;
  padding: clamp(20px, 4.5vh, 64px) clamp(20px, 5vw, 110px) clamp(16px, 3vh, 44px); }
.stage > main { flex: 1; min-height: 0; }
.kicker { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); }
.lead { font-size: 1.25rem; color: var(--ink-2); max-width: 30em; }
.small { font-size: max(0.8rem, 14px); color: var(--ink-3); }
.num { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
.hl { color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; min-height: 52px; padding: 0.5em 1.6em;
  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;
  transition: transform 0.12s, filter 0.15s, opacity 0.15s; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(0.97); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.card { background: var(--surface); border-radius: 1rem; padding: 1.4rem; }
.chip { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.15em 0.8em; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2); font-size: max(0.8rem, 14px); font-weight: 600; white-space: nowrap; }
/* 反馈区：固定放在页面里的一行，不用弹窗。对 = 强调色加对勾；错 = 文字说明加抖动，不用红色 */
.note { min-height: 3.4em; color: var(--ink-2); }
.note.good { color: var(--accent); }
.note.bad { color: var(--ink); }
.shake { animation: shake 0.32s linear; }
.pop { animation: pop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
@keyframes pop { 50% { transform: scale(1.14); } }
/* 入场：给元素加 class="in"，再用 style="--i:1" 排先后 */
.in { animation: in 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }
@keyframes in { from { opacity: 0; transform: translateY(1.2rem); } }
/* 小屏：改成可以上下滚动的单列 */
@media (max-width: 720px) {
  body { overflow: auto; }
  .stage { height: auto; min-height: 100dvh; }
  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
/* ========== 三、本页样式：只有这一段每页不同 ========== */
[hidden] { display: none !important; }
.duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 2.2rem; min-height: 0; }
.story { display: flex; flex-direction: column; gap: 1.1rem; min-height: 0; }
.quote .q { font-size: 1.5rem; font-weight: 800; line-height: 1.4; }
.lab { display: flex; flex-direction: column; gap: 0.9rem; min-height: 0; }
.lab .fig { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.lab .fig svg { max-height: 100%; width: auto; max-width: 100%; }
.formula { display: flex; gap: 0.55em; align-items: baseline; justify-content: center; font-size: 1.6rem; font-weight: 800;
  border: 1.5px solid var(--line); padding: 1rem 1.2rem; transition: border-color 0.3s, color 0.3s; }
.formula.lit { border-color: var(--accent); color: var(--accent); }
.formula sub { font-size: 0.55em; font-weight: 700; }
.chips2 { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.actions { display: flex; justify-content: flex-end; }
</style>
</head>
<body>
<div class="stage">
  <header>
    <p class="kicker in">讲解 · 证据二</p>
    <h1 class="in" style="--i:1">浴缸里冒出的原理</h1>
  </header>
  <main class="duo">
    <div class="story">
      <p class="lead in" style="--i:2">国王把同样的难题交给了全城最聪明的人。传说他想了三天三夜，没有结果——直到有一天，他跨进浴缸，水哗地漫了出来。</p>
      <div class="quote card in" style="--i:3">
        <p class="q">「浸进去多少，就排出来多少。」</p>
        <p class="small">他喊了一句希腊语 εὔρηκα（尤里卡 · 「找到了」），一路跑向王宫。</p>
      </div>
      <div class="in" style="--i:4">
        <span class="chip">上一页的石块：F浮 = 1.6 N</span>
        <span class="chip">排开的水：G排 = 1.6 N</span>
      </div>
    </div>
    <div class="lab">
      <figure class="fig in" style="--i:2">
        <svg viewBox="0 0 560 400" role="img" aria-label="天平：左边浮力，右边排开的水重">
          <rect x="210" y="356" width="140" height="18" rx="9" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="3"/>
          <rect x="272" y="140" width="16" height="220" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
          <g id="beam">
            <line x1="90" y1="140" x2="470" y2="140" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
            <g id="panL">
              <line x1="90" y1="140" x2="90" y2="186" stroke="var(--ink)" stroke-width="3"/>
              <path d="M40 186 Q90 226 140 186" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
              <rect x="60" y="152" width="60" height="34" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
              <rect x="65" y="164" width="50" height="18" fill="var(--water)" opacity="0.6"/>
              <text id="labelL" x="90" y="256" text-anchor="middle" font-size="21" font-weight="800" fill="var(--ink)" font-family="ui-monospace, Menlo, monospace">G排 = 1.6 N</text>
            </g>
            <g id="panR">
              <line x1="470" y1="140" x2="470" y2="186" stroke="var(--ink)" stroke-width="3"/>
              <path d="M420 186 Q470 226 520 186" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
              <polygon points="470,146 492,156 502,174 488,194 462,196 448,176 456,154" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="2.5"/>
              <line x1="445" y1="188" x2="445" y2="158" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
              <text id="labelR" x="470" y="256" text-anchor="middle" font-size="21" font-weight="800" fill="var(--ink)" font-family="ui-monospace, Menlo, monospace">F浮 = 1.6 N</text>
            </g>
          </g>
          <circle cx="280" cy="140" r="11" fill="var(--accent)"/>
          <polygon id="needle" points="280,118 272,136 288,136" fill="var(--ink-3)"/>
          <text x="280" y="392" text-anchor="middle" font-size="15" fill="var(--ink-3)">两边同时放手</text>
        </svg>
      </figure>
      <div class="formula num" id="formula">
        <span>F<sub>浮</sub> ＝ G<sub>排</sub></span>
        <span id="fExt" hidden>＝ ρ<sub>液</sub> · g · V<sub>排</sub></span>
      </div>
      <div class="chips2" id="symbolChips" hidden>
        <span class="chip">ρ液 · 液体的密度</span>
        <span class="chip">g ≈ 10 N/kg</span>
        <span class="chip">V排 · 排开的液体体积</span>
      </div>
      <p class="note" id="note">老师把上一页的两个数摆上了天平——两边会平吗？</p>
      <div class="actions">
        <button class="btn in" style="--i:5" id="mainBtn">松手，看天平</button>
      </div>
    </div>
  </main>
</div>
<script>
/* ========== 公共脚本：每一页完全一样，不要改 ========== */
/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */
function deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }
addEventListener('keydown', function (e) {
  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');
});
/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */
var deckMuted = false, deckAudio = null;
try { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}
addEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });
function sfx(name) {
  if (deckMuted) return;
  try {
    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();
    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];
    notes.forEach(function (n) {
      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];
      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);
      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);
    });
  } catch (e) {}
}
/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */
var stars = {
  key: 'deck:stars:' + document.title.split('·')[0].trim(),
  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },
  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },
  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }
};
/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */
function fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }
</script>
<script>
/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */
/* 演示数据：全部来自第 3、4 页的那块石头 */
var DATA = { FB: 1.6, GP: 1.6 };
var NOTE_TEXT = [
  '平了！F浮 和 G排 一分不差。这不是巧合，是阿基米德原理。',
  '浸在液体里的物体受到的浮力，等于它排开的液体所受的重力。一条等式，说完整个原理。'
];
var stage = 0;
var beam = document.getElementById('beam');
var panL = document.getElementById('panL');
var panR = document.getElementById('panR');
var needle = document.getElementById('needle');
var formula = document.getElementById('formula');
var fExt = document.getElementById('fExt');
var symbolChips = document.getElementById('symbolChips');
var note = document.getElementById('note');
var mainBtn = document.getElementById('mainBtn');
var angle = -7;
function paint() {
  beam.setAttribute('transform', 'rotate(' + angle + ' 280 140)');
  panL.setAttribute('transform', 'rotate(' + (-angle) + ' 90 140)');
  panR.setAttribute('transform', 'rotate(' + (-angle) + ' 470 140)');
}
paint();
function tween(to, done) {
  var from = angle, start = null;
  function step(ts) {
    if (start === null) start = ts;
    var k = Math.min(1, (ts - start) / 900);
    var e = 1 - Math.pow(1 - k, 3);
    angle = from + (to - from) * e;
    paint();
    if (k < 1) requestAnimationFrame(step);
    else if (done) done();
  }
  requestAnimationFrame(step);
}
mainBtn.addEventListener('click', function () {
  if (stage === 0) {
    sfx('tap');
    mainBtn.disabled = true;
    tween(0, function () {
      needle.setAttribute('fill', 'var(--accent)');
      fx(document.getElementById('labelL'), 'pop');
      fx(document.getElementById('labelR'), 'pop');
      formula.classList.add('lit');
      note.textContent = NOTE_TEXT[0];
      note.classList.add('good');
      sfx('ok');
      mainBtn.disabled = false;
      mainBtn.textContent = '公式展开';
      stage = 1;
    });
  } else if (stage === 1) {
    sfx('tap');
    fExt.hidden = false;
    symbolChips.hidden = false;
    fx(formula, 'pop');
    note.textContent = NOTE_TEXT[1];
    mainBtn.textContent = '记住它，去练一遍 →';
    stage = 2;
  } else {
    sfx('tap');
    deck('next');
  }
});
</script>
</body>
