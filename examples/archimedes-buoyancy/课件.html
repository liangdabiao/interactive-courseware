<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>课件</title>
<style>
  /* ============================================================
     课件播放器外壳
     页面占满整屏，只在底部留一条细栏负责翻页。
     这份文件是固定的：只改下面脚本里的 DECK，其余不要动。
     ============================================================ */
  :root { --bg: #000; --ink: #fff; --accent: #FFD23F; --bar: clamp(44px, 5vh, 60px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .player { position: fixed; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) var(--bar); }
  /* ---------- 画面 ---------- */
  .screen { position: relative; min-height: 0; }
  .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .28s ease; }
  .screen iframe.on { opacity: 1; }
  /* ---------- 底栏：‹  进度  05/12  目录  声音  全屏  › ---------- */
  .bar { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto auto auto; align-items: center;
    gap: 2px; padding: 0 max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px, env(safe-area-inset-left)); }
  .ico { width: var(--bar); height: var(--bar); display: grid; place-items: center; border-radius: 50%;
    color: color-mix(in srgb, var(--ink) 55%, transparent); transition: color .15s, transform .12s, opacity .2s; }
  .ico svg { width: 42%; height: 42%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ico:hover { color: var(--accent); }
  .ico:active { transform: scale(.88); }
  .ico[disabled] { opacity: .18; pointer-events: none; }
  .ico.turn svg { width: 50%; height: 50%; stroke-width: 2.2; }
  .ico.turn.next { color: var(--accent); }
  .ico .off { display: none; }
  .ico.muted .on { display: none; }
  .ico.muted .off { display: inline; }
  /* 进度：一页一段，当前页是强调色 */
  .track { position: relative; display: flex; gap: 4px; height: 100%; align-items: center; padding: 0 10px; min-width: 0; }
  .seg { flex: 1 1 0; min-width: 4px; height: 100%; display: grid; align-items: center; }
  .seg i { display: block; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 16%, transparent); transition: background .25s, height .2s, box-shadow .25s; }
  .seg.done i { background: color-mix(in srgb, var(--ink) 46%, transparent); }
  .seg.on i { height: 5px; background: var(--accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 55%, transparent); }
  .seg:hover i { height: 7px; background: color-mix(in srgb, var(--ink) 80%, transparent); }
  .seg.on:hover i { background: var(--accent); }
  .tip { position: absolute; bottom: calc(100% - 4px); transform: translateX(-50%); pointer-events: none; white-space: nowrap;
    padding: 6px 12px; border-radius: 8px; font-size: 13px; line-height: 1.2; font-weight: 600;
    background: var(--ink); color: var(--bg); opacity: 0; transition: opacity .12s; }
  .tip b { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; margin-right: .6em; opacity: .55; }
  .tip.show { opacity: 1; }
  .count { height: var(--bar); padding: 0 12px; border-radius: 10px; white-space: nowrap;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: clamp(13px, 1.5vh, 17px); font-variant-numeric: tabular-nums;
    color: color-mix(in srgb, var(--ink) 45%, transparent); transition: color .15s; }
  .count b { color: var(--ink); font-weight: 700; }
  .count:hover { color: var(--accent); }
  /* 页面加载中：底栏顶边一条流动的细线 */
  .loading { position: absolute; left: 0; right: 0; top: 0; height: 2px; overflow: hidden; opacity: 0; transition: opacity .2s; }
  .loading.show { opacity: 1; }
  .loading::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent); animation: slide 1s ease-in-out infinite; }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }
  /* ---------- 目录：从底栏上方升起 ---------- */
  .toc { position: absolute; left: 0; right: 0; bottom: var(--bar); max-height: min(78%, 640px); overflow-y: auto; z-index: 5;
    padding: clamp(18px, 3vh, 36px) clamp(16px, 5vw, 80px) clamp(14px, 2vh, 24px);
    background: color-mix(in srgb, var(--bg) 90%, var(--ink)); border-top: 1px solid color-mix(in srgb, var(--ink) 14%, transparent);
    transform: translateY(12px); opacity: 0; pointer-events: none; transition: transform .22s ease, opacity .22s ease; }
  .toc.open { transform: none; opacity: 1; pointer-events: auto; }
  .toc h2 { margin: 0 0 clamp(12px, 2vh, 22px); font-size: clamp(16px, 2.2vh, 24px); font-weight: 700; letter-spacing: .02em; }
  .toc ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .toc li button { width: 100%; min-height: 52px; display: grid; grid-template-columns: 2.6em 1fr; align-items: center; gap: 4px; text-align: left;
    padding: 8px 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); transition: border-color .15s, background .15s; }
  .toc li button:hover { border-color: color-mix(in srgb, var(--ink) 45%, transparent); }
  .toc li button b { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 400; color: color-mix(in srgb, var(--ink) 40%, transparent); }
  .toc li button span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toc li.on button { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .toc li.on button b { color: var(--accent); }
  .veil { position: absolute; inset: 0 0 var(--bar) 0; z-index: 4; background: color-mix(in srgb, var(--bg) 55%, transparent); opacity: 0; pointer-events: none; transition: opacity .22s; }
  .veil.open { opacity: 1; pointer-events: auto; }
  @media (max-width: 640px) { #full, #menu { display: none; } .track { gap: 3px; padding: 0 4px; } }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 1ms !important; animation-duration: 1ms !important; } }
</style>
</head>
<body>
<div class="player">
  <main class="screen" id="screen"></main>
  <div class="veil" id="veil"></div>
  <aside class="toc" id="toc" aria-label="目录"><h2 id="tocTitle"></h2><ol id="tocList"></ol></aside>
  <footer class="bar">
    <div class="loading" id="loading"></div>
    <button class="ico turn" id="prev" aria-label="上一页"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="track" id="track"><div class="tip" id="tip"></div></div>
    <button class="count" id="count" aria-label="打开目录"></button>
    <button class="ico" id="menu" aria-label="目录"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <button class="ico" id="mute" aria-label="声音开关"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path class="on" d="M15.5 8.5a5 5 0 010 7M19 5a10 10 0 010 14"/><path class="off" d="M22 9l-6 6M16 9l6 6"/></svg></button>
    <button class="ico" id="full" aria-label="全屏"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg></button>
    <button class="ico turn next" id="next" aria-label="下一页"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M9 5l7 7-7 7"/></svg></button>
  </footer>
</div>
<script>
/* ============================================================
   只改这里：课程标题、三个颜色、页面清单。
   打包成单个文件后，src 会被替换成各页的完整 HTML。
   ============================================================ */
const DECK = {
  title: "阿基米德与浮力",
  bg: "#F6F1E7",        // 页面底色（和各页的底色保持一致）
  ink: "#1F1B16",       // 文字色
  accent: "#C4411A",    // 强调色
  pages: [
    { title: "王冠悬案", src: "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>阿基米德与浮力 · 01 · 王冠悬案\u003c/title>\n\u003cstyle>\n/* ========== 一、配色：蓝图里选定的那一组，整套课件每一页完全一样 ========== */\n:root {\n  --bg: #F6F1E7;                      /* 底色 */\n  --surface: #FFFDF8;                 /* 卡片、面板 */\n  --surface-2: #EBE4D6;               /* 凹槽、轨道、未选中的底 */\n  --ink: #1F1B16;                     /* 主文字 */\n  --ink-2: #5A544A;                   /* 次要文字 */\n  --ink-3: #736D62;                   /* 说明文字 */\n  --line: rgba(31, 27, 22, 0.14);     /* 描边、分隔线 */\n  --accent: #C4411A;                  /* 唯一的强调色 */\n  --accent-ink: #FFFFFF;              /* 强调色上面的文字 */\n  --water: #8FA6BC;                   /* 全课唯一的附加色：水的实物色（降饱和） */\n}\n/* ========== 二、骨架和部件：每一页完全一样，不要改 ========== */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { font-size: clamp(16px, calc(min(1vw, 1.78vh) * 1.12), 34px); }   /* 1rem 跟着屏幕等比缩放，1080p 下约 21px。尺寸都用 rem 写 */\nhtml, body { height: 100%; margin: 0; }\nbody { background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.7; overflow: hidden;\n  font-family: \"PingFang SC\", \"HarmonyOS Sans SC\", \"Microsoft YaHei\", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\nh1, h2, h3, p, ul, ol, figure { margin: 0; }\nh1 { font-size: 3rem; line-height: 1.15; font-weight: 800; text-wrap: balance; }\nh2 { font-size: 2rem; line-height: 1.2; font-weight: 800; text-wrap: balance; }\nh3 { font-size: 1.3rem; line-height: 1.3; font-weight: 700; }\nbutton { font: inherit; color: inherit; }\nsvg { display: block; max-width: 100%; }\n/* 舞台：占满整屏。内容区 main 吃掉标题以下的全部空间 */\n.stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 1.2rem;\n  padding: clamp(20px, 4.5vh, 64px) clamp(20px, 5vw, 110px) clamp(16px, 3vh, 44px); }\n.stage > main { flex: 1; min-height: 0; }\n.kicker { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); }\n.lead { font-size: 1.25rem; color: var(--ink-2); max-width: 30em; }\n.small { font-size: max(0.8rem, 14px); color: var(--ink-3); }\n.num { font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }\n.hl { color: var(--accent); }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; min-height: 52px; padding: 0.5em 1.6em;\n  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;\n  transition: transform 0.12s, filter 0.15s, opacity 0.15s; }\n.btn:hover { filter: brightness(1.06); }\n.btn:active { transform: scale(0.97); }\n.btn[disabled] { opacity: 0.4; cursor: not-allowed; }\n.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }\n.card { background: var(--surface); border-radius: 1rem; padding: 1.4rem; }\n.chip { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.15em 0.8em; border-radius: 999px;\n  background: var(--surface-2); color: var(--ink-2); font-size: max(0.8rem, 14px); font-weight: 600; white-space: nowrap; }\n/* 反馈区：固定放在页面里的一行，不用弹窗。对 = 强调色加对勾；错 = 文字说明加抖动，不用红色 */\n.note { min-height: 3.4em; color: var(--ink-2); }\n.note.good { color: var(--accent); }\n.note.bad { color: var(--ink); }\n.shake { animation: shake 0.32s linear; }\n.pop { animation: pop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }\n@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }\n@keyframes pop { 50% { transform: scale(1.14); } }\n/* 入场：给元素加 class=\"in\"，再用 style=\"--i:1\" 排先后 */\n.in { animation: in 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }\n@keyframes in { from { opacity: 0; transform: translateY(1.2rem); } }\n/* 小屏：改成可以上下滚动的单列 */\n@media (max-width: 720px) {\n  body { overflow: auto; }\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n.stage > header { text-align: center; }\n.cover { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.3rem; text-align: center; }\n.cover .lead { margin: 0 auto; }\n.hero { width: min(44rem, 82%); }\n.hero svg { width: 100%; height: auto; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">叙拉古 · 公元前三世纪\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">王冠悬案\u003c/h1>\n  \u003c/header>\n  \u003cmain class=\"cover\">\n    \u003cfigure class=\"hero in\" style=\"--i:2\">\n      \u003csvg viewBox=\"0 0 520 320\" role=\"img\" aria-label=\"国王的金冠\">\n        \u003cdefs>\n          \u003cradialGradient id=\"glow\" cx=\"50%\" cy=\"45%\" r=\"60%\">\n            \u003cstop offset=\"0%\" stop-color=\"var(--accent)\" stop-opacity=\"0.13\"/>\n            \u003cstop offset=\"100%\" stop-color=\"var(--accent)\" stop-opacity=\"0\"/>\n          \u003c/radialGradient>\n        \u003c/defs>\n        \u003ccircle cx=\"260\" cy=\"150\" r=\"152\" fill=\"url(#glow)\"/>\n        \u003cg stroke=\"var(--ink)\" stroke-width=\"5\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n          \u003cpath d=\"M150 216 L168 120 L232 176 L260 104 L288 176 L352 120 L370 216 Z\" fill=\"var(--surface)\"/>\n          \u003crect x=\"140\" y=\"216\" width=\"240\" height=\"34\" rx=\"10\" fill=\"var(--surface)\"/>\n          \u003ccircle cx=\"168\" cy=\"110\" r=\"9\" fill=\"var(--accent)\" stroke=\"none\"/>\n          \u003ccircle id=\"gemTop\" cx=\"260\" cy=\"92\" r=\"11\" fill=\"var(--accent)\" stroke=\"none\"/>\n          \u003ccircle cx=\"352\" cy=\"110\" r=\"9\" fill=\"var(--accent)\" stroke=\"none\"/>\n        \u003c/g>\n        \u003cg transform=\"rotate(-9 430 262)\">\n          \u003ccircle cx=\"430\" cy=\"262\" r=\"30\" fill=\"var(--accent)\"/>\n          \u003ccircle cx=\"430\" cy=\"262\" r=\"21\" fill=\"none\" stroke=\"var(--accent-ink)\" stroke-width=\"2\" stroke-dasharray=\"3 4\"/>\n          \u003ctext x=\"430\" y=\"272\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"800\" fill=\"var(--accent-ink)\">验\u003c/text>\n          \u003cpath d=\"M414 288 q -8 26 4 38 M446 288 q 8 26 -4 38\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"7\" stroke-linecap=\"round\"/>\n        \u003c/g>\n      \u003c/svg>\n    \u003c/figure>\n    \u003cp class=\"lead in\" style=\"--i:3\">国王的金冠，可能被掺了银子。不许碰坏它——你要用一缸水，查出真相。\u003c/p>\n    \u003cbutton class=\"btn in\" style=\"--i:4\" id=\"start\">开始查案\u003c/button>\n    \u003cp class=\"small in\" style=\"--i:5 num\">共 8 页 · 约 40 分钟 · ← → 翻页\u003c/p>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 封面：只负责把门打开 */\ndocument.getElementById('start').addEventListener('click', function () {\n  sfx('ok');\n  deck('next');\n});\nsetTimeout(function () { fx(document.getElementById('gemTop'), 'pop'); }, 1000);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },

{ font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); }\n.lead { font-size: 1.25rem; color: var(--ink-2); max-width: 30em; }\n.small { font-size: max(0.8rem, 14px); color: var(--ink-3); }\n.num { font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }\n.hl { color: var(--accent); }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; min-height: 52px; padding: 0.5em 1.6em;\n  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;\n  transition: transform 0.12s, filter 0.15s, opacity 0.15s; }\n.btn:hover { filter: brightness(1.06); }\n.btn:active { transform: scale(0.97); }\n.btn[disabled] { opacity: 0.4; cursor: not-allowed; }\n.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }\n.card { background: var(--surface); border-radius: 1rem; padding: 1.4rem; }\n.chip { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.15em 0.8em; border-radius: 999px;\n  background: var(--surface-2); color: var(--ink-2); font-size: max(0.8rem, 14px); font-weight: 600; white-space: nowrap; }\n/* 反馈区：固定放在页面里的一行，不用弹窗。对 = 强调色加对勾；错 = 文字说明加抖动，不用红色 */\n.note { min-height: 3.4em; color: var(--ink-2); }\n.note.good { color: var(--accent); }\n.note.bad { color: var(--ink); }\n.shake { animation: shake 0.32s linear; }\n.pop { animation: pop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }\n@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }\n@keyframes pop { 50% { transform: scale(1.14); } }\n/* 入场：给元素加 class=\"in\"，再用 style=\"--i:1\" 排先后 */\n.in { animation: in 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }\n@keyframes in { from { opacity: 0; transform: translateY(1.2rem); } }\n/* 小屏：改成可以上下滚动的单列 */\n@media (max-width: 720px) {\n  body { overflow: auto; }\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n.duo { display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr); gap: 2.2rem; min-height: 0; }\n.fig { min-height: 0; display: flex; align-items: center; justify-content: center; }\n.fig svg { max-height: 100%; width: auto; max-width: 100%; }\n.right { display: flex; flex-direction: column; gap: 1.1rem; min-height: 0; }\n.steps { display: flex; flex-direction: column; }\n.step { display: flex; gap: 0.8em; align-items: flex-start; text-align: left; padding: 0.65em 0.3em;\n  border: 0; background: none; border-bottom: 1px dashed var(--line); cursor: pointer;\n  opacity: 0.32; transform: translateX(-6px); transition: opacity 0.3s, transform 0.3s; }\n.step:last-of-type { border-bottom: 0; }\n.step.on { opacity: 1; transform: none; }\n.step .dot { flex: none; display: grid; place-items: center; width: 1.7em; height: 1.7em; border-radius: 50%;\n  background: var(--surface-2); color: var(--ink-2); font-weight: 700; font-size: 0.95rem; }\n.step.done .dot { background: var(--accent); color: var(--accent-ink); }\n.formula { font-size: 1.7rem; font-weight: 800; text-align: center; letter-spacing: 0.04em;\n  border: 1.5px solid var(--line); transition: border-color 0.3s, color 0.3s; }\n.formula.lit { border-color: var(--accent); color: var(--accent); }\n.formula sub { font-size: 0.55em; font-weight: 700; }\n.actions { display: flex; justify-content: flex-end; margin-top: auto; }\n/* SVG 内部件的过渡 */\n#waterR { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); transition: transform 0.8s ease; }\n#fbArrow { opacity: 0; transform: translateY(14px); transition: opacity 0.45s ease 0.25s, transform 0.45s ease 0.25s; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">讲解 · 预备证据\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">称一称，浮力有多大\u003c/h1>\n  \u003c/header>\n  \u003cmain class=\"duo\">\n    \u003cfigure class=\"fig in\" style=\"--i:2\">\n      \u003csvg viewBox=\"0 0 460 540\" role=\"img\" aria-label=\"弹簧测力计称石块\">\n        \u003cline x1=\"230\" y1=\"8\" x2=\"230\" y2=\"36\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n        \u003crect x=\"150\" y=\"36\" width=\"160\" height=\"180\" rx=\"14\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n        \u003crect x=\"170\" y=\"56\" width=\"120\" height=\"120\" rx=\"8\" fill=\"var(--surface-2)\"/>\n        \u003cg stroke=\"var(--ink-3)\" stroke-width=\"2\">\n          \u003cline x1=\"270\" y1=\"66\" x2=\"282\" y2=\"66\"/>\u003cline x1=\"270\" y1=\"91\" x2=\"282\" y2=\"91\"/>\n          \u003cline x1=\"270\" y1=\"116\" x2=\"282\" y2=\"116\"/>\u003cline x1=\"270\" y1=\"141\" x2=\"282\" y2=\"141\"/>\n          \u003cline x1=\"270\" y1=\"166\" x2=\"282\" y2=\"166\"/>\n        \u003c/g>\n        \u003cg font-size=\"15\" fill=\"var(--ink-3)\" text-anchor=\"end\" font-family=\"ui-monospace, Menlo, monospace\">\n          \u003ctext x=\"264\" y=\"71\">0\u003c/text>\u003ctext x=\"264\" y=\"146\">3\u003c/text>\u003ctext x=\"264\" y=\"171\">4\u003c/text>\n        \u003c/g>\n        \u003cline id=\"ptr\" x1=\"176\" y1=\"66\" x2=\"266\" y2=\"66\" stroke=\"var(--accent)\" stroke-width=\"3\"/>\n        \u003ctext id=\"bigRead\" x=\"326\" y=\"70\" font-size=\"34\" font-weight=\"800\" fill=\"var(--ink)\" font-family=\"ui-monospace, Menlo, monospace\">0.0\u003c/text>\n        \u003ctext id=\"whichRead\" x=\"326\" y=\"100\" font-size=\"15\" fill=\"var(--ink-3)\">还没开始\u003c/text>\n        \u003cline x1=\"230\" y1=\"216\" x2=\"230\" y2=\"240\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n        \u003cg stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linecap=\"round\">\n          \u003cline x1=\"222\" y1=\"244\" x2=\"238\" y2=\"252\"/>\u003cline x1=\"222\" y1=\"256\" x2=\"238\" y2=\"264\"/>\u003cline x1=\"222\" y1=\"268\" x2=\"238\" y2=\"276\"/>\n        \u003c/g>\n        \u003cline x1=\"230\" y1=\"280\" x2=\"230\" y2=\"316\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n        \u003cg id=\"stoneG\">\n          \u003cpolygon points=\"230,318 268,330 282,362 262,392 216,396 188,368 196,334\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n        \u003c/g>\n        \u003crect x=\"90\" y=\"300\" width=\"280\" height=\"210\" rx=\"10\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n        \u003crect id=\"waterR\" x=\"94\" y=\"330\" width=\"272\" height=\"176\" fill=\"var(--water)\" opacity=\"0.5\"/>\n        \u003cg id=\"fbArrow\">\n          \u003cline x1=\"304\" y1=\"384\" x2=\"304\" y2=\"312\" stroke=\"var(--accent)\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n          \u003cpolygon points=\"304,296 291,316 317,316\" fill=\"var(--accent)\"/>\n          \u003ctext x=\"318\" y=\"336\" font-size=\"24\" font-weight=\"800\" fill=\"var(--accent)\">F浮\u003c/text>\n        \u003c/g>\n        \u003ctext x=\"104\" y=\"330\" font-size=\"16\" fill=\"var(--ink-3)\" opacity=\"0.9\">水\u003c/text>\n      \u003c/svg>\n    \u003c/figure>\n    \u003cdiv class=\"right\">\n      \u003cdiv class=\"steps\">\n        \u003cbutton class=\"step\" data-stage=\"1\">\u003cspan class=\"dot num\">1\u003c/span>\u003cspan>先在空气里称：读出物重 \u003cb class=\"num\">G = 4.0 N\u003c/b>。\u003c/span>\u003c/button>\n        \u003cbutton class=\"step\" data-stage=\"2\">\u003cspan class=\"dot num\">2\u003c/span>\u003cspan>再浸入水中称：读数掉到 \u003cb class=\"num\">F示 = 2.4 N\u003c/b>——少掉的读数，就是水向上托它的力。\u003c/span>\u003c/button>\n        \u003cbutton class=\"step\" data-stage=\"3\">\u003cspan class=\"dot num\">3\u003c/span>\u003cspan>相减：\u003cb class=\"num\">F浮 = 4.0 − 2.4 = 1.6 N\u003c/b>。\u003c/span>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"formula card num\" id=\"formula\">F\u003csub>浮\u003c/sub> ＝ G − F\u003csub>示\u003c/sub>\u003c/div>\n      \u003cp class=\"note in\" style=\"--i:3\" id=\"note\">\u003c/p>\n      \u003cdiv class=\"actions\">\n        \u003cbutton class=\"btn in\" style=\"--i:4\" id=\"mainBtn\">开始 · 先在空气里称一次\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 石块三次读数（g 取 10 N/kg；这块石头在第 4、5 页还会再用） */\nvar STONE = { G: 4.0, FS: 2.4, FB: 1.6 };\n/* 每一步的反馈文案 */\nvar NOTE_TEXT = [\n  '开始：先看它在空气里的读数。',\n  '石头一沾水，读数就掉了。少掉的那截读数，就是水向上托它的力。',\n  '这就是称重法。记住这组数：4.0、2.4、1.6——下一页你要亲手做一遍。'\n];\nvar stage = 0;\nvar steps = document.querySelectorAll('.step');\nvar note = document.getElementById('note');\nvar mainBtn = document.getElementById('mainBtn');\nvar ptr = document.getElementById('ptr');\nvar bigRead = document.getElementById('bigRead');\nvar whichRead = document.getElementById('whichRead');\nfunction setStage(n) {\n  if (n \u003c= stage) return;\n  stage = n;\n  if (n \u003c 3) sfx('tap');\n  for (var i = 0; i \u003c steps.length; i++) {\n    steps[i].classList.toggle('on', i \u003c n);\n    steps[i].classList.toggle('done', i \u003c n);\n  }\n  if (n === 1) {\n    ptr.setAttribute('y1', 166); ptr.setAttribute('y2', 166);\n    bigRead.textContent = STONE.G.toFixed(1);\n    whichRead.textContent = '空气里 · 物重 G';\n    note.textContent = NOTE_TEXT[0];\n    mainBtn.textContent = '浸入水中';\n  } else if (n === 2) {\n    ptr.setAttribute('y1', 126); ptr.setAttribute('y2', 126);\n    bigRead.textContent = STONE.FS.toFixed(1);\n    whichRead.textContent = '浸入水中 · 读数 F示';\n    note.textContent = NOTE_TEXT[1];\n    mainBtn.textContent = '算出差值';\n  } else if (n === 3) {\n    ptr.setAttribute('y1', 126); ptr.setAttribute('y2', 126);\n    bigRead.textContent = STONE.FB.toFixed(1);\n    whichRead.textContent = '差值 · 这就是浮力';\n    document.getElementById('waterR').style.transform = 'scaleY(1)';\n    document.getElementById('fbArrow').style.opacity = 1;\n    document.getElementById('fbArrow').style.transform = 'translateY(0)';\n    document.getElementById('formula').classList.add('lit');\n    note.textContent = NOTE_TEXT[2];\n    note.classList.add('good');\n    fx(bigRead, 'pop');\n    sfx('ok');\n    mainBtn.textContent = '去实验台，亲手做一遍 →';\n  }\n}\nmainBtn.addEventListener('click', function () {\n  if (stage === 0) { setStage(1); }\n  else if (stage === 1) { setStage(2); }\n  else if (stage === 2) { setStage(3); }\n  else { sfx('tap'); deck('next'); }\n});\nsteps.forEach(function (btn) {\n  btn.addEventListener('click', function () { setStage(Number(btn.dataset.stage)); });\n});\nnote.textContent = '石头挂好了。开始第一步？';\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },

pan>\u003cb class=\"num\" id=\"rGp\">0.0 N\u003c/b>\u003c/div>\n      \u003c/div>\n      \u003ch3 class=\"in\" style=\"--i:4\">这一趟，要发现三件事\u003c/h3>\n      \u003cul class=\"disc\">\n        \u003cli id=\"d1\">\u003ci class=\"box\">\u003c/i>\u003cspan>浸入后，示数变小了\u003c/span>\u003c/li>\n        \u003cli id=\"d2\">\u003ci class=\"box\">\u003c/i>\u003cspan>浸没后再往下，示数不再变\u003c/span>\u003c/li>\n        \u003cli id=\"d3\">\u003ci class=\"box\">\u003c/i>\u003cspan>F浮 和 G排 竟然相等\u003c/span>\u003c/li>\n      \u003c/ul>\n      \u003cp class=\"note\" id=\"note\">按住石块，往下拖——盯着右边这几个数。\u003c/p>\n      \u003cdiv class=\"actions\">\n        \u003cbutton class=\"btn ghost\" id=\"hint\">提示\u003c/button>\n        \u003cbutton class=\"btn\" id=\"goNext\" hidden>带证据去见老师 →\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 石块参数：与第 3 页同一块——G = 4.0 N，浸没浮力 1.6 N（g 取 10 N/kg） */\nvar PHYS = { G: 4.0, FB_MAX: 1.6, DY_MAX: 112, RANGE: 300 };\n/* 发现清单：三条逐一点亮 */\nvar FINDS = {\n  d1: '石头一沾水，读数就往下掉——有个力在向上托它。',\n  d2: '浸没之后 V排 到了顶，再往下浮力也不再变大。',\n  d3: '三条证据集齐：F浮 和 G排 画上了等号！'\n};\nvar t = 0, dragging = false, startT = 0, startY = 0;\nvar seen = { d1: false, d2: false, d3: false };\nvar reachedBottom = false, leftBottom = false, doneAll = false;\nvar svg = document.getElementById('bench');\nvar grab = document.getElementById('grab');\nvar stoneG = document.getElementById('stoneG');\nvar cable = document.getElementById('cable');\nvar ptr = document.getElementById('ptr');\nvar fsText = document.getElementById('fsText');\nvar fsLabel = document.getElementById('fsLabel');\nvar gpText = document.getElementById('gpText');\nvar rFs = document.getElementById('rFs');\nvar rFf = document.getElementById('rFf');\nvar rGp = document.getElementById('rGp');\nvar rowEq = document.getElementById('rowEq');\nvar cupWater = document.getElementById('cupWater');\nvar stream = document.getElementById('stream');\nvar note = document.getElementById('note');\nvar goNext = document.getElementById('goNext');\nfunction svgY(evt) {\n  var pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;\n  return pt.matrixTransform(svg.getScreenCTM().inverse()).y;\n}\nfunction check(name) {\n  if (seen[name]) return;\n  seen[name] = true;\n  var li = document.getElementById(name);\n  li.classList.add('done');\n  sfx('ok');\n  fx(li, 'pop');\n  if (doneAll) return;\n  note.textContent = FINDS[name];\n  if (seen.d1 && seen.d2 && seen.d3) {\n    doneAll = true;\n    note.classList.add('good');\n    goNext.hidden = false;\n    sfx('win');\n  }\n}\nfunction render() {\n  var dy = t * PHYS.DY_MAX;\n  stoneG.setAttribute('transform', 'translate(0 ' + dy + ')');\n  grab.setAttribute('transform', 'translate(0 ' + dy + ')');\n  cable.setAttribute('y2', 168 + dy);\n  var Fs = PHYS.G - PHYS.FB_MAX * t, Ff = PHYS.FB_MAX * t;\n  var ptrY = 42 + (Fs / 4) * 44;\n  ptr.setAttribute('y1', ptrY); ptr.setAttribute('y2', ptrY);\n  fsText.textContent = Fs.toFixed(1);\n  fsLabel.textContent = t > 0.02 ? '浸入中 · 读数 F示' : '空气中 · F示 = G';\n  rFs.textContent = Fs.toFixed(1) + ' N';\n  rFf.textContent = Ff.toFixed(1) + ' N';\n  rGp.textContent = Ff.toFixed(1) + ' N';\n  gpText.textContent = Ff.toFixed(1) + ' N';\n  var cupH = t * 58;\n  cupWater.setAttribute('y', 451 - cupH);\n  cupWater.setAttribute('height', cupH);\n  stream.style.opacity = t > 0.02 ? 0.9 : 0;\n  if (t > 0.12) check('d1');\n  if (t >= 0.98) {\n    if (reachedBottom && leftBottom) check('d2');\n    reachedBottom = true;\n    rowEq.classList.add('on');\n    check('d3');\n  }\n  if (t \u003c 0.9 && reachedBottom) leftBottom = true;\n}\ngrab.addEventListener('pointerdown', function (e) {\n  e.preventDefault();\n  dragging = true;\n  startT = t;\n  startY = svgY(e);\n  grab.setPointerCapture(e.pointerId);\n  sfx('tap');\n});\ngrab.addEventListener('pointermove', function (e) {\n  if (!dragging) return;\n  t = Math.min(1, Math.max(0, startT + (svgY(e) - startY) / PHYS.RANGE));\n  render();\n});\nfunction endDrag() { dragging = false; }\ngrab.addEventListener('pointerup', endDrag);\ngrab.addEventListener('pointercancel', endDrag);\nvar HINTS = [\n  '方法：按住石块往下拖，右边四个数都会跟着动。',\n  '线索：示数减小多少，浮力就是多少；小杯里的水也跟着变重。',\n  '答案：浸没那一刻，F浮 = 1.6 N，G排 也正好是 1.6 N。把石块拉起来再按到底，就能看到“浸没后不变”。'\n];\nvar hintIdx = 0;\ndocument.getElementById('hint').addEventListener('click', function () {\n  note.textContent = HINTS[Math.min(hintIdx, HINTS.length - 1)];\n  hintIdx++;\n  sfx('tap');\n});\ngoNext.addEventListener('click', function () { sfx('tap'); deck('next'); });\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },
    { title: "阿基米德原理", src: "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>阿基米德与浮力 · 05 · 阿基米德原理\u003c/title>\n\u003cstyle>\n/* ========== 一、配色：蓝图里选定的那一组，整套课件每一页完全一样 ========== */\n:root {\n  --bg: #F6F1E7;                      /* 底色 */\n  --surface: #FFFDF8;                 /* 卡片、面板 */\n  --surface-2: #EBE4D6;               /* 凹槽、轨道、未选中的底 */\n  --ink: #1F1B16;                     /* 主文字 */\n  --ink-2: #5A544A;                   /* 次要文字 */\n  --ink-3: #736D62;                   /* 说明文字 */\n  --line: rgba(31, 27, 22, 0.14);     /* 描边、分隔线 */\n  --accent: #C4411A;                  /* 唯一的强调色 */\n  --accent-ink: #FFFFFF;              /* 强调色上面的文字 */\n  --water: #8FA6BC;                   /* 全课唯一的附加色：水的实物色（降饱和） */\n}\n/* ========== 二、骨架和部件：每一页完全一样，不要改 ========== */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { font-size: clamp(16px, calc(min(1vw, 1.78vh) * 1.12), 34px); }   /* 1rem 跟着屏幕等比缩放，1080p 下约 21px。尺寸都用 rem 写 */\nhtml, body { height: 100%; margin: 0; }\nbody { background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.7; overflow: hidden;\n  font-family: \"PingFang SC\", \"HarmonyOS Sans SC\", \"Microsoft YaHei\", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\nh1, h2, h3, p, ul, ol, figure { margin: 0; }\nh1 { font-size: 3rem; line-height: 1.15; font-weight: 800; text-wrap: balance; }\nh2 { font-size: 2rem; line-height: 1.2; font-weight: 800; text-wrap: balance; }\nh3 { font-size: 1.3rem; line-height: 1.3; font-weight: 700; }\nbutton { font: inherit; color: inherit; }\nsvg { display: block; max-width: 100%; }\n/* 舞台：占满整屏。内容区 main 吃掉标题以下的全部空间 */\n.stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 1.2rem;\n  padding: clamp(20px, 4.5vh, 64px) clamp(20px, 5vw, 110px) clamp(16px, 3vh, 44px); }\n.stage > main { flex: 1; min-height: 0; }\n.k ">\n        \u003cspan class=\"chip\">上一页的石块：F浮 = 1.6 N\u003c/span>\n        \u003cspan class=\"chip\">排开的水：G排 = 1.6 N\u003c/span>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"lab\">\n      \u003cfigure class=\"fig in\" style=\"--i:2\">\n        \u003csvg viewBox=\"0 0 560 400\" role=\"img\" aria-label=\"天平：左边浮力，右边排开的水重\">\n          \u003crect x=\"210\" y=\"356\" width=\"140\" height=\"18\" rx=\"9\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003crect x=\"272\" y=\"140\" width=\"16\" height=\"220\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003cg id=\"beam\">\n            \u003cline x1=\"90\" y1=\"140\" x2=\"470\" y2=\"140\" stroke=\"var(--ink)\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n            \u003cg id=\"panL\">\n              \u003cline x1=\"90\" y1=\"140\" x2=\"90\" y2=\"186\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n              \u003cpath d=\"M40 186 Q90 226 140 186\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n              \u003crect x=\"60\" y=\"152\" width=\"60\" height=\"34\" rx=\"4\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n              \u003crect x=\"65\" y=\"164\" width=\"50\" height=\"18\" fill=\"var(--water)\" opacity=\"0.6\"/>\n              \u003ctext id=\"labelL\" x=\"90\" y=\"256\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"800\" fill=\"var(--ink)\" font-family=\"ui-monospace, Menlo, monospace\">G排 = 1.6 N\u003c/text>\n            \u003c/g>\n            \u003cg id=\"panR\">\n              \u003cline x1=\"470\" y1=\"140\" x2=\"470\" y2=\"186\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n              \u003cpath d=\"M420 186 Q470 226 520 186\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n              \u003cpolygon points=\"470,146 492,156 502,174 488,194 462,196 448,176 456,154\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n              \u003cline x1=\"445\" y1=\"188\" x2=\"445\" y2=\"158\" stroke=\"var(--accent)\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n              \u003ctext id=\"labelR\" x=\"470\" y=\"256\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"800\" fill=\"var(--ink)\" font-family=\"ui-monospace, Menlo, monospace\">F浮 = 1.6 N\u003c/text>\n            \u003c/g>\n          \u003c/g>\n          \u003ccircle cx=\"280\" cy=\"140\" r=\"11\" fill=\"var(--accent)\"/>\n          \u003cpolygon id=\"needle\" points=\"280,118 272,136 288,136\" fill=\"var(--ink-3)\"/>\n          \u003ctext x=\"280\" y=\"392\" text-anchor=\"middle\" font-size=\"15\" fill=\"var(--ink-3)\">两边同时放手\u003c/text>\n        \u003c/svg>\n      \u003c/figure>\n      \u003cdiv class=\"formula num\" id=\"formula\">\n        \u003cspan>F\u003csub>浮\u003c/sub> ＝ G\u003csub>排\u003c/sub>\u003c/span>\n        \u003cspan id=\"fExt\" hidden>＝ ρ\u003csub>液\u003c/sub> · g · V\u003csub>排\u003c/sub>\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"chips2\" id=\"symbolChips\" hidden>\n        \u003cspan class=\"chip\">ρ液 · 液体的密度\u003c/span>\n        \u003cspan class=\"chip\">g ≈ 10 N/kg\u003c/span>\n        \u003cspan class=\"chip\">V排 · 排开的液体体积\u003c/span>\n      \u003c/div>\n      \u003cp class=\"note\" id=\"note\">老师把上一页的两个数摆上了天平——两边会平吗？\u003c/p>\n      \u003cdiv class=\"actions\">\n        \u003cbutton class=\"btn in\" style=\"--i:5\" id=\"mainBtn\">松手，看天平\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 演示数据：全部来自第 3、4 页的那块石头 */\nvar DATA = { FB: 1.6, GP: 1.6 };\nvar NOTE_TEXT = [\n  '平了！F浮 和 G排 一分不差。这不是巧合，是阿基米德原理。',\n  '浸在液体里的物体受到的浮力，等于它排开的液体所受的重力。一条等式，说完整个原理。'\n];\nvar stage = 0;\nvar beam = document.getElementById('beam');\nvar panL = document.getElementById('panL');\nvar panR = document.getElementById('panR');\nvar needle = document.getElementById('needle');\nvar formula = document.getElementById('formula');\nvar fExt = document.getElementById('fExt');\nvar symbolChips = document.getElementById('symbolChips');\nvar note = document.getElementById('note');\nvar mainBtn = document.getElementById('mainBtn');\nvar angle = -7;\nfunction paint() {\n  beam.setAttribute('transform', 'rotate(' + angle + ' 280 140)');\n  panL.setAttribute('transform', 'rotate(' + (-angle) + ' 90 140)');\n  panR.setAttribute('transform', 'rotate(' + (-angle) + ' 470 140)');\n}\npaint();\nfunction tween(to, done) {\n  var from = angle, start = null;\n  function step(ts) {\n    if (start === null) start = ts;\n    var k = Math.min(1, (ts - start) / 900);\n    var e = 1 - Math.pow(1 - k, 3);\n    angle = from + (to - from) * e;\n    paint();\n    if (k \u003c 1) requestAnimationFrame(step);\n    else if (done) done();\n  }\n  requestAnimationFrame(step);\n}\nmainBtn.addEventListener('click', function () {\n  if (stage === 0) {\n    sfx('tap');\n    mainBtn.disabled = true;\n    tween(0, function () {\n      needle.setAttribute('fill', 'var(--accent)');\n      fx(document.getElementById('labelL'), 'pop');\n      fx(document.getElementById('labelR'), 'pop');\n      formula.classList.add('lit');\n      note.textContent = NOTE_TEXT[0];\n      note.classList.add('good');\n      sfx('ok');\n      mainBtn.disabled = false;\n      mainBtn.textContent = '公式展开';\n      stage = 1;\n    });\n  } else if (stage === 1) {\n    sfx('tap');\n    fExt.hidden = false;\n    symbolChips.hidden = false;\n    fx(formula, 'pop');\n    note.textContent = NOTE_TEXT[1];\n    mainBtn.textContent = '记住它，去练一遍 →';\n    stage = 2;\n  } else {\n    sfx('tap');\n    deck('next');\n  }\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },
    { title: "浮力预测家", src: "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>阿基米德与浮力 · 06 · 浮力预测家\u003c/title>\n\u003cstyle>\n/* ========== 一、配色：蓝图里选定的那一组，整套课件每一页完全一样 ========== */\n:root {\n  --bg: #F6F1E7;                      /* 底色 */\n  --surface: #FFFDF8;                 /* 卡片、面板 */\n  --surface-2: #EBE4D6;               /* 凹槽、轨道、未选中的底 */\n  --ink: #1F1B16;                     /* 主文字 */\n  --ink-2: #5A544A;                   /* 次要文字 */\n  --ink-3: #736D62;                   /* 说明文字 */\n  --line: rgba(31, 27, 22, 0.14);     /* 描边、分隔线 */\n  --accent: #C4411A;                  /* 唯一的强调色 */\n  --accent-ink: #FFFFFF;              /* 强调色上面的文字 */\n  --water: #8FA6BC;                   /* 全课唯一的附加色：水的实物色（降饱和） */\n}\n/* ========== 二、骨架和部件：每一页完全一样，不要改 ========== */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { font-size: clamp(16px, calc(min(1vw, 1.78vh) * 1.12), 34px); }   /* 1rem 跟着屏幕等比缩放，1080p 下约 21px。尺寸都用 rem 写 */\nhtml, body { height: 100%; margin: 0; }\nbody { background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.7; overflow: hidden;\n  font-family: \"PingFang SC\", \"HarmonyOS Sans SC\", \"Microsoft YaHei\", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\nh1, h2, h3, p, ul, ol, figure { margin: 0; }\nh1 { font-size: 3rem; line-height: 1.15; font-weight: 800; text-wrap: balance; }\nh2 { font-size: 2rem; line-height: 1.2; font-weight: 800; text-wrap: balance; }\nh3 { font-size: 1.3rem; line-height: 1.3; font-weight: 700; }\nbutton { font: inherit; color: inherit; }\nsvg { display: block; max-width: 100%; }\n/* 舞台：占满整屏。内容区 main 吃掉标题以下的全部空间 */\n.stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 1.2rem;\n  padding: clamp(20px, 4.5vh, 64px) clamp(20px, 5vw, 110px) clamp(16px, 3vh, 44px); }\n.stage > main { flex: 1; min-height: 0; }\n.kicker { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); }\n.lead { font-size: 1.25rem; color: var(--ink-2); max-width: 30em; }\n.small { font-size: max(0.8rem, 14px); color: var(--ink-3); }\n.num { font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }\n.hl { color: var(--accent); }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; min-height: 52px; padding: 0.5em 1.6em;\n  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;\n  transition: transform 0.12s, filter 0.15s, opacity 0.15s; }\n.btn:hover { filter: brightness(1.06); }\n.btn:active { transform: scale(0.97); }\n.btn[disabled] { opacity: 0.4; cursor: not-allowed; }\n.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }\n.card { background: var(--surface); border-radius: 1rem; padding: 1.4rem; }\n.chip { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.15em 0.8em; border-radius: 999px;\n  background: var(--surface-2); color: var(--ink-2); font-size: max(0.8rem, 14px); font-weight: 600; white-space: nowrap; }\n/* 反馈区：固定放在页面里的一行，不用弹窗。对 = 强调色加对勾；错 = 文字说明加抖动，不用红色 */\n.note { min-height: 3.4em; color: var(--ink-2); }\n.note.good { color: var(--accent); }\n.note.bad { color: var(--ink); }\n.shake { animation: shake 0.32s linear; }\n.pop { animation: pop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }\n@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }\n@keyframes pop { 50% { transform: scale(1.14); } }\n/* 入场：给元素加 class=\"in\"，再用 style=\"--i:1\" 排先后 */\n.in { animation: in 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }\n@keyframes in { from { opacity: 0; transform: translateY(1.2rem); } }\n/* 小屏：改成可以上下
