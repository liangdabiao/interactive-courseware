<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>课件</title>
<style>
  /* ============================================================
     课件播放器外壳
     页面占满整屏，只在底部留一条细栏负责翻页。
     这份文件是固定的：只改下面脚本里的 DECK，其余不要动。
     ============================================================ */
  :root { --bg: #000; --ink: #fff; --accent: #FFD23F; --bar: clamp(44px, 5vh, 60px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .player { position: fixed; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) var(--bar); }
  /* ---------- 画面 ---------- */
  .screen { position: relative; min-height: 0; }
  .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .28s ease; }
  .screen iframe.on { opacity: 1; }
  /* ---------- 底栏：‹  进度  05/12  目录  声音  全屏  › ---------- */
  .bar { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto auto auto; align-items: center;
    gap: 2px; padding: 0 max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px, env(safe-area-inset-left)); }
  .ico { width: var(--bar); height: var(--bar); display: grid; place-items: center; border-radius: 50%;
    color: color-mix(in srgb, var(--ink) 55%, transparent); transition: color .15s, transform .12s, opacity .2s; }
  .ico svg { width: 42%; height: 42%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ico:hover { color: var(--accent); }
  .ico:active { transform: scale(.88); }
  .ico[disabled] { opacity: .18; pointer-events: none; }
  .ico.turn svg { width: 50%; height: 50%; stroke-width: 2.2; }
  .ico.turn.next { color: var(--accent); }
  .ico .off { display: none; }
  .ico.muted .on { display: none; }
  .ico.muted .off { display: inline; }
  /* 进度：一页一段，当前页是强调色 */
  .track { position: relative; display: flex; gap: 4px; height: 100%; align-items: center; padding: 0 10px; min-width: 0; }
  .seg { flex: 1 1 0; min-width: 4px; height: 100%; display: grid; align-items: center; }
  .seg i { display: block; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 16%, transparent); transition: background .25s, height .2s, box-shadow .25s; }
  .seg.done i { background: color-mix(in srgb, var(--ink) 46%, transparent); }
  .seg.on i { height: 5px; background: var(--accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 55%, transparent); }
  .seg:hover i { height: 7px; background: color-mix(in srgb, var(--ink) 80%, transparent); }
  .seg.on:hover i { background: var(--accent); }
  .tip { position: absolute; bottom: calc(100% - 4px); transform: translateX(-50%); pointer-events: none; white-space: nowrap;
    padding: 6px 12px; border-radius: 8px; font-size: 13px; line-height: 1.2; font-weight: 600;
    background: var(--ink); color: var(--bg); opacity: 0; transition: opacity .12s; }
  .tip b { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; margin-right: .6em; opacity: .55; }
  .tip.show { opacity: 1; }
  .count { height: var(--bar); padding: 0 12px; border-radius: 10px; white-space: nowrap;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: clamp(13px, 1.5vh, 17px); font-variant-numeric: tabular-nums;
    color: color-mix(in srgb, var(--ink) 45%, transparent); transition: color .15s; }
  .count b { color: var(--ink); font-weight: 700; }
  .count:hover { color: var(--accent); }
  /* 页面加载中：底栏顶边一条流动的细线 */
  .loading { position: absolute; left: 0; right: 0; top: 0; height: 2px; overflow: hidden; opacity: 0; transition: opacity .2s; }
  .loading.show { opacity: 1; }
  .loading::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent); animation: slide 1s ease-in-out infinite; }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }
  /* ---------- 目录：从底栏上方升起 ---------- */
  .toc { position: absolute; left: 0; right: 0; bottom: var(--bar); max-height: min(78%, 640px); overflow-y: auto; z-index: 5;
    padding: clamp(18px, 3vh, 36px) clamp(16px, 5vw, 80px) clamp(14px, 2vh, 24px);
    background: color-mix(in srgb, var(--bg) 90%, var(--ink)); border-top: 1px solid color-mix(in srgb, var(--ink) 14%, transparent);
    transform: translateY(12px); opacity: 0; pointer-events: none; transition: transform .22s ease, opacity .22s ease; }
  .toc.open { transform: none; opacity: 1; pointer-events: auto; }
  .toc h2 { margin: 0 0 clamp(12px, 2vh, 22px); font-size: clamp(16px, 2.2vh, 24px); font-weight: 700; letter-spacing: .02em; }
  .toc ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .toc li button { width: 100%; min-height: 52px; display: grid; grid-template-columns: 2.6em 1fr; align-items: center; gap: 4px; text-align: left;
    padding: 8px 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); transition: border-color .15s, background .15s; }
  .toc li button:hover { border-color: color-mix(in srgb, var(--ink) 45%, transparent); }
  .toc li button b { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 400; color: color-mix(in srgb, var(--ink) 40%, transparent); }
  .toc li button span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toc li.on button { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .toc li.on button b { color: var(--accent); }
  .veil { position: absolute; inset: 0 0 var(--bar) 0; z-index: 4; background: color-mix(in srgb, var(--bg) 55%, transparent); opacity: 0; pointer-events: none; transition: opacity .22s; }
  .veil.open { opacity: 1; pointer-events: auto; }
  @media (max-width: 640px) { #full, #menu { display: none; } .track { gap: 3px; padding: 0 4px; } }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 1ms !important; animation-duration: 1ms !important; } }
</style>
</head>
<body>
<div class="player">
  <main class="screen" id="screen"></main>
  <div class="veil" id="veil"></div>
  <aside class="toc" id="toc" aria-label="目录"><h2 id="tocTitle"></h2><ol id="tocList"></ol></aside>
  <footer class="bar">
    <div class="loading" id="loading"></div>
    <button class="ico turn" id="prev" aria-label="上一页"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="track" id="track"><div class="tip" id="tip"></div></div>
    <button class="count" id="count" aria-label="打开目录"></button>
    <button class="ico" id="menu" aria-label="目录"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <button class="ico" id="mute" aria-label="声音开关"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path class="on" d="M15.5 8.5a5 5 0 010 7M19 5a10 10 0 010 14"/><path class="off" d="M22 9l-6 6M16 9l6 6"/></svg></button>
    <button class="ico" id="full" aria-label="全屏"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg></button>
    <button class="ico turn next" id="next" aria-label="下一页"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M9 5l7 7-7 7"/></svg></button>
  </footer>
</div>
<script>
/* ============================================================
   只改这里：课程标题、三个颜色、页面清单。
   打包成单个文件后，src 会被替换成各页的完整 HTML。
   ============================================================ */
const DECK = {
  title: "阿基米德的机械房",
  bg: "#000000",        // 页面底色（和各页的底色保持一致）
  ink: "#FFFFFF",       // 文字色
  accent: "#FFD23F",    // 强调色
  pages: [
    { title: "机械房", src: "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>阿基米德的机械房 · 01 · 机械房\u003c/title>\n\u003cstyle>\n/* ========== 一、配色：蓝图里选定的那一组，整套课件每一页完全一样 ========== */\n:root {\n  --bg: #000000;                      /* 底色 */\n  --surface: #131313;                 /* 卡片、面板 */\n  --surface-2: #222222;               /* 凹槽、轨道、未选中的底 */\n  --ink: #FFFFFF;                     /* 主文字 */\n  --ink-2: #B9B9B9;                   /* 次要文字 */\n  --ink-3: #7C7C7C;                   /* 说明文字 */\n  --line: rgba(255, 255, 255, 0.14);  /* 描边、分隔线 */\n  --accent: #FFD23F;                  /* 唯一的强调色 */\n  --accent-ink: #1A1400;              /* 强调色上面的文字 */\n}\n/* ========== 二、骨架和部件：每一页完全一样，不要改 ========== */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { font-size: clamp(16px, calc(min(1vw, 1.78vh) * 1.12), 34px); }   /* 1rem 跟着屏幕等比缩放，1080p 下约 21px。尺寸都用 rem 写 */\nhtml, body { height: 100%; margin: 0; }\nbody { background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.7; overflow: hidden;\n  font-family: \"PingFang SC\", \"HarmonyOS Sans SC\", \"Microsoft YaHei\", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\nh1, h2, h3, p, ul, ol, figure { margin: 0; }\nh1 { font-size: 3rem; line-height: 1.15; font-weight: 800; text-wrap: balance; }\nh2 { font-size: 2rem; line-height: 1.2; font-weight: 800; text-wrap: balance; }\nh3 { font-size: 1.3rem; line-height: 1.3; font-weight: 700; }\nbutton { font: inherit; color: inherit; }\nsvg { display: block; max-width: 100%; }\n/* 舞台：占满整屏。内容区 main 吃掉标题以下的全部空间 */\n.stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 1.2rem;\n  padding: clamp(20px, 4.5vh, 64px) clamp(20px, 5vw, 110px) clamp(16px, 3vh, 44px); }\n.stage > main { flex: 1; min-height: 0; }\n.kicker { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); }\n.lead { font-size: 1.25rem; color: var(--ink-2); max-width: 30em; }\n.small { font-size: max(0.8rem, 14px); color: var(--ink-3); }\n.num { font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }\n.hl { color: var(--accent); }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; min-height: 52px; padding: 0.5em 1.6em;\n  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;\n  transition: transform 0.12s, filter 0.15s, opacity 0.15s; }\n.btn:hover { filter: brightness(1.06); }\n.btn:active { transform: scale(0.97); }\n.btn[disabled] { opacity: 0.4; cursor: not-allowed; }\n.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }\n.card { background: var(--surface); border-radius: 1rem; padding: 1.4rem; }\n.chip { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.15em 0.8em; border-radius: 999px;\n  background: var(--surface-2); color: var(--ink-2); font-size: max(0.8rem, 14px); font-weight: 600; white-space: nowrap; }\n/* 反馈区：固定放在页面里的一行，不用弹窗。对 = 强调色加对勾；错 = 文字说明加抖动，不用红色 */\n.note { min-height: 3.4em; color: var(--ink-2); }\n.note.good { color: var(--accent); }\n.note.bad { color: var(--ink); }\n.shake { animation: shake 0.32s linear; }\n.pop { animation: pop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }\n@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }\n@keyframes pop { 50% { transform: scale(1.14); } }\n/* 入场：给元素加 class=\"in\"，再用 style=\"--i:1\" 排先后 */\n.in { animation: in 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }\n@keyframes in { from { opacity: 0; transform: translateY(1.2rem); } }\n/* 小屏：改成可以上下滚动的单列 */\n@media (max-width: 720px) {\n  body { overflow: auto; }\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n[hidden] { display: none !important; }\n.stage > header { text-align: center; }\n.cover { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; text-align: center; }\n.cover .lead { margin: 0 auto; }\n.hero { width: min(44rem, 78%); }\n.hero svg { width: 100%; height: auto; }\n.quote { font-size: 1.4rem; font-weight: 800; color: var(--accent); letter-spacing: 0.04em; }\n.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawline 0.9s ease forwards; animation-delay: calc(var(--d, 0) * 1s); }\n@keyframes drawline { to { stroke-dashoffset: 0; } }\n.badges { display: flex; gap: 0.9rem; flex-wrap: wrap; justify-content: center; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">阿基米德系列 · 第二间房\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">机械房\u003c/h1>\n  \u003c/header>\n  \u003cmain class=\"cover\">\n    \u003cfigure class=\"hero in\" style=\"--i:2\">\n      \u003csvg viewBox=\"0 0 560 300\" role=\"img\" aria-label=\"一根撬棍支起地球\">\n        \u003ccircle cx=\"440\" cy=\"196\" r=\"62\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"5\"/>\n        \u003cpath d=\"M395 172 q 24 -14 52 -8 M420 250 q 20 6 42 -4 M486 172 q 10 22 2 44\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n        \u003cpath d=\"M60 236 L468 208\" stroke=\"var(--accent)\" stroke-width=\"9\" stroke-linecap=\"round\" pathLength=\"1\" class=\"draw\" style=\"--d:0\"/>\n        \u003cpath d=\"M398 240 L438 240 L418 214 Z\" fill=\"var(--accent)\" pathLength=\"1\" class=\"draw\" style=\"--d:1\"/>\n        \u003cline x1=\"30\" y1=\"240\" x2=\"530\" y2=\"240\" stroke=\"var(--ink)\" stroke-width=\"3\" pathLength=\"1\" class=\"draw\" style=\"--d:1\"/>\n        \u003cpath d=\"M92 208 q -18 12 -8 28\" fill=\"none\" stroke=\"var(--ink-2)\" stroke-width=\"4\" stroke-linecap=\"round\" pathLength=\"1\" class=\"draw\" style=\"--d:2\"/>\n        \u003ctext x=\"70\" y=\"196\" font-size=\"20\" font-weight=\"800\" fill=\"var(--ink-2)\">手按这里\u003c/text>\n        \u003ctext x=\"470\" y=\"286\" text-anchor=\"end\" font-size=\"18\" fill=\"var(--ink-3)\">地球？先从一艘船开始\u003c/text>\n      \u003c/svg>\n    \u003c/figure>\n    \u003cp class=\"quote in\" style=\"--i:3\">「给我一个支点，我能撬动地球。」\u003c/p>\n    \u003cp class=\"lead in\" style=\"--i:4\">上次，我们开了他为王冠设的悬案。这次进第二间房——\u003cb class=\"hl\">机械房\u003c/b>：撬棍、轮子、绳子，和一句狂言的账本。\u003c/p>\n    \u003cdiv class=\"badges in\" style=\"--i:5\">\n      \u003cspan class=\"chip num\">手稿一 · 杠杆\u003c/span>\n      \u003cspan class=\"chip num\">手稿二 · 滑轮与滑轮组\u003c/span>\n      \u003cspan class=\"chip num\">终局 · 拖动战船\u003c/span>\n    \u003c/div>\n    \u003cbutton class=\"btn in\" style=\"--i:6\" id=\"start\">推门进房\u003c/button>\n    \u003cp class=\"small num in\" style=\"--i:7\">共 10 页 · 约 40 分钟 · ← → 翻页\u003c/p>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 封面：只负责开门 */\ndocument.getElementById('start').addEventListener('click', function () {\n  sfx('ok');\n  deck('next');\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },

o; }\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n[hidden] { display: none !important; }\n.duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr); gap: 2.2rem; min-height: 0; }\n.left { display: flex; flex-direction: column; gap: 1rem; min-height: 0; }\n.fig { min-height: 0; display: flex; align-items: center; justify-content: center; }\n.fig svg { max-height: 100%; width: auto; max-width: 100%; }\n.sname { opacity: 0; transform: translateY(6px); transition: opacity 0.5s ease, transform 0.5s ease; }\n.sname.show { opacity: 1; transform: none; }\n.stepchip { opacity: 0.25; transition: opacity 0.3s; }\n.stepchip.on { opacity: 1; background: var(--accent); color: var(--accent-ink); }\n.steps-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }\n.formula { font-size: 1.5rem; font-weight: 800; text-align: center; border: 1.5px solid var(--line);\n  border-radius: 1rem; padding: 0.8rem 1.2rem; transition: border-color 0.3s, color 0.3s; }\n.formula.lit { border-color: var(--accent); color: var(--accent); }\n.foot { display: flex; justify-content: flex-end; margin-top: auto; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">手稿一 · 杠杆\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">撬棍上的五个名字\u003c/h1>\n  \u003c/header>\n  \u003cmain class=\"duo\">\n    \u003cdiv class=\"left in\" style=\"--i:2\">\n      \u003cp class=\"lead\">阿基米德的狂言，靠的是一根再普通不过的撬棍。先认全它身上的\u003cb class=\"hl\">五个名字\u003c/b>，狂言就有了账本。\u003c/p>\n      \u003cdiv class=\"steps-row\">\n        \u003cspan class=\"chip stepchip num\" id=\"sc1\">1 支点\u003c/span>\n        \u003cspan class=\"chip stepchip num\" id=\"sc2\">2 动力\u003c/span>\n        \u003cspan class=\"chip stepchip num\" id=\"sc3\">3 阻力\u003c/span>\n        \u003cspan class=\"chip stepchip num\" id=\"sc4\">4 动力臂\u003c/span>\n        \u003cspan class=\"chip stepchip num\" id=\"sc5\">5 阻力臂\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"formula num\" id=\"formula\">F₁ · L₁ ＝ F₂ · L₂\u003c/div>\n      \u003cp class=\"note\" id=\"note\">铁三角已就位。从支点开始，把五个名字钉上去。\u003c/p>\n      \u003cdiv class=\"foot\">\n        \u003cbutton class=\"btn in\" style=\"--i:3\" id=\"mainBtn\">钉上第一个名字\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cfigure class=\"fig in\" style=\"--i:3\">\n      \u003csvg viewBox=\"0 0 520 420\" role=\"img\" aria-label=\"撬棍示意：支点、动力、阻力与两臂\">\n        \u003cline x1=\"20\" y1=\"340\" x2=\"500\" y2=\"340\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n        \u003cline id=\"bar\" x1=\"110\" y1=\"190\" x2=\"350\" y2=\"310\" stroke=\"var(--ink)\" stroke-width=\"8\" stroke-linecap=\"round\"/>\n        \u003cpolygon points=\"230,340 290,340 260,275\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n        \u003ccircle id=\"oDot\" cx=\"260\" cy=\"277\" r=\"7\" fill=\"var(--accent)\" opacity=\"0\"/>\n        \u003cg id=\"f1Arrow\" opacity=\"0\">\n          \u003cline x1=\"100\" y1=\"128\" x2=\"112\" y2=\"184\" stroke=\"var(--accent)\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n          \u003cpolygon points=\"115,196 98,180 116,170\" fill=\"var(--accent)\"/>\n        \u003c/g>\n        \u003cg id=\"f2Arrow\" opacity=\"0\">\n          \u003cline x1=\"310\" y1=\"228\" x2=\"310\" y2=\"282\" stroke=\"var(--ink)\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n          \u003cpolygon points=\"310,296 298,278 322,278\" fill=\"var(--ink)\"/>\n        \u003c/g>\n        \u003cg id=\"armL\" opacity=\"0\">\n          \u003cline x1=\"110\" y1=\"275\" x2=\"260\" y2=\"275\" stroke=\"var(--accent)\" stroke-width=\"3\" stroke-dasharray=\"7 6\"/>\n          \u003cline x1=\"110\" y1=\"196\" x2=\"110\" y2=\"282\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"4 5\"/>\n        \u003c/g>\n        \u003cg id=\"armR\" opacity=\"0\">\n          \u003cline x1=\"260\" y1=\"275\" x2=\"310\" y2=\"275\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-dasharray=\"7 6\"/>\n          \u003cline x1=\"310\" y1=\"286\" x2=\"310\" y2=\"228\" stroke=\"var(--ink)\" stroke-width=\"2\" stroke-dasharray=\"4 5\"/>\n        \u003c/g>\n        \u003cg id=\"names\">\n          \u003ctext class=\"sname\" id=\"n1\" x=\"260\" y=\"372\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"800\" fill=\"var(--accent)\">① 支点 O\u003c/text>\n          \u003ctext class=\"sname\" id=\"n2\" x=\"58\" y=\"112\" font-size=\"18\" font-weight=\"800\" fill=\"var(--accent)\">② 动力 F₁＝200N\u003c/text>\n          \u003ctext class=\"sname\" id=\"n3\" x=\"322\" y=\"214\" font-size=\"18\" font-weight=\"800\" fill=\"var(--ink)\">③ 阻力 F₂＝600N\u003c/text>\n          \u003ctext class=\"sname\" id=\"n4\" x=\"185\" y=\"300\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"800\" fill=\"var(--accent)\">④ 动力臂 L₁＝1.5m\u003c/text>\n          \u003ctext class=\"sname\" id=\"n5\" x=\"286\" y=\"246\" font-size=\"17\" font-weight=\"800\" fill=\"var(--ink)\">⑤ 阻力臂 L₂＝0.5m\u003c/text>\n        \u003c/g>\n        \u003crect x=\"288\" y=\"252\" width=\"78\" height=\"88\" rx=\"10\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n        \u003ctext x=\"327\" y=\"306\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"var(--ink-2)\">石块\u003c/text>\n        \u003ctext x=\"60\" y=\"376\" font-size=\"14\" fill=\"var(--ink-3)\">地面\u003c/text>\n      \u003c/svg>\n    \u003c/figure>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 五要素逐步钉上：数值取自这张图的账（200×1.5 ＝ 600×0.5 ＝ 300） */\nvar NOTE_TEXT = [\n  '支点 O：撬棍绕着它转的那个点。铁三角替你顶着全部.',\n  '动力 F₁＝200 N：你的手往下压的这一下——这就是你全部的投入。',\n  '阻力 F₂＝600 N：石块压杠杆的力，是你想战胜的对手。',\n  '动力臂 L₁：从支点到动力作用线的距离，竖着量——1.5 m。',\n  '阻力臂 L₂＝0.5 m。五个名字集齐，开始对账：200×1.5 ＝ 300，600×0.5 ＝ 300——相等！'\n];\nvar STEPS = ['sc1', 'sc2', 'sc3', 'sc4', 'sc5'];\nvar BTNS = ['钉上第一个名字', '② 动力 F₁', '③ 阻力 F₂', '④ 动力臂 L₁', '⑤ 阻力臂 L₂'];\nvar stage = 0;\nvar note = document.getElementById('note');\nvar mainBtn = document.getElementById('mainBtn');\nfunction setStage(n) {\n  if (n \u003c= stage) return;\n  stage = n;\n  document.getElementById(STEPS[n - 1]).classList.add('on');\n  var map = { 1: 'oDot', 2: 'f1Arrow', 3: 'f2Arrow', 4: 'armL', 5: 'armR' };\n  var el = document.getElementById(map[n]);\n  el.style.opacity = 1;\n  document.getElementById('n' + n).classList.add('show');\n  if (n \u003c 5) {\n    note.textContent = NOTE_TEXT[n - 1];\n    mainBtn.textContent = BTNS[n];\n    sfx('tap');\n  } else {\n    note.textContent = NOTE_TEXT[4];\n    note.className = 'note good';\n    document.getElementById('formula').classList.add('lit');\n    fx(document.getElementById('formula'), 'pop');\n    sfx('win');\n    mainBtn.textContent = '狂言成立。去平衡台亲手试 →';\n  }\n}\nmainBtn.addEventListener('click', function () {\n  if (stage \u003c 5) { setStage(stage + 1); }\n  else { sfx('tap'); deck('next'); }\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },

}\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n[hidden] { display: none !important; }\n.board { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }\n.board svg { max-height: 100%; width: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }\n.wt { cursor: grab; }\n.wt.dragging { cursor: grabbing; }\n.wt.locked { cursor: default; opacity: 0.85; }\n#pivotG { cursor: ew-resize; }\n.duo { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr); gap: 1.8rem; min-height: 0; flex: 1; }\n.panel { display: flex; flex-direction: column; gap: 0.9rem; min-height: 0; }\n.reads { padding: 0.9rem 1.2rem; display: flex; flex-direction: column; }\n.rrow { display: flex; justify-content: space-between; align-items: baseline; gap: 1em; padding: 0.42rem 0; border-bottom: 1px dashed var(--line); }\n.rrow:last-child { border-bottom: 0; }\n.rrow span { font-size: 0.95rem; color: var(--ink-2); }\n.rrow b { font-size: 1.35rem; font-weight: 700; }\n.rrow.eqok span, .rrow.eqok b { color: var(--accent); }\n.foot { display: flex; gap: 0.8rem; justify-content: flex-end; align-items: center; margin-top: auto; flex-wrap: wrap; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">探索 · 平衡台\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">找到那个平衡点\u003c/h1>\n  \u003c/header>\n  \u003cmain class=\"duo\">\n    \u003cfigure class=\"board in\" style=\"--i:2\">\n      \u003csvg id=\"bz\" viewBox=\"0 0 860 560\" role=\"img\" aria-label=\"平衡台：拖动砝码或支点，让杠杆平衡\">\n        \u003cline x1=\"60\" y1=\"470\" x2=\"800\" y2=\"470\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n        \u003cg id=\"beamG\">\n          \u003crect x=\"80\" y=\"404\" width=\"700\" height=\"12\" rx=\"6\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n          \u003cg id=\"ticks\" stroke=\"var(--ink-3)\" stroke-width=\"2\">\u003c/g>\n          \u003cg id=\"tickLabels\" font-size=\"13\" fill=\"var(--ink-3)\" text-anchor=\"middle\" font-family=\"ui-monospace, Menlo, monospace\">\u003c/g>\n          \u003cg class=\"wt\" id=\"w1\" data-f=\"3\">\n            \u003crect x=\"-22\" y=\"-34\" width=\"44\" height=\"34\" rx=\"6\" fill=\"var(--accent)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n            \u003ctext x=\"0\" y=\"-12\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"800\" fill=\"var(--accent-ink)\" font-family=\"ui-monospace, Menlo, monospace\">3N\u003c/text>\n          \u003c/g>\n          \u003cg class=\"wt\" id=\"w2\" data-f=\"2\">\n            \u003crect x=\"-22\" y=\"-34\" width=\"44\" height=\"34\" rx=\"6\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n            \u003ctext x=\"0\" y=\"-12\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"800\" fill=\"var(--ink)\" font-family=\"ui-monospace, Menlo, monospace\">2N\u003c/text>\n          \u003c/g>\n        \u003c/g>\n        \u003cg id=\"pivotG\">\n          \u003cpolygon points=\"-30,470 30,470 0,414\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003ctext x=\"0\" y=\"396\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"var(--accent)\">支点 O\u003c/text>\n        \u003c/g>\n        \u003ctext id=\"modeTag\" x=\"80\" y=\"80\" font-size=\"17\" font-weight=\"700\" fill=\"var(--accent)\">可拖动：右边 2N 砝码\u003c/text>\n      \u003c/svg>\n    \u003c/figure>\n    \u003cdiv class=\"panel in\" style=\"--i:3\">\n      \u003cspan class=\"chip num\" id=\"stageChip\">第一关 · 学操作\u003c/span>\n      \u003cdiv class=\"reads card\">\n        \u003cdiv class=\"rrow\">\u003cspan>左边力矩 ΣF·L\u003c/span>\u003cb class=\"num\" id=\"tL\">0\u003c/b>\u003c/div>\n        \u003cdiv class=\"rrow\">\u003cspan>右边力矩 ΣF·L\u003c/span>\u003cb class=\"num\" id=\"tR\">0\u003c/b>\u003c/div>\n        \u003cdiv class=\"rrow eqok\" id=\"eqRow\">\u003cspan>F₁L₁ ＝ F₂L₂ ？\u003c/span>\u003cb class=\"num\" id=\"eqTxt\">否\u003c/b>\u003c/div>\n      \u003c/div>\n      \u003cp class=\"note\" id=\"note\">左边 3N 已放在第 4 格（力矩 3×4＝12）。把右边 2N 拖到力矩也是 12 的格——松手即检验。\u003c/p>\n      \u003cdiv class=\"foot\">\n        \u003cbutton class=\"btn ghost\" id=\"hintBtn\">提示\u003c/button>\n        \u003cbutton class=\"btn\" id=\"nextBtn\" hidden>下一关 →\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 格位：0 在中点，每格 55px；砝码不能放在 0 位（支点占着） */\nvar CX = 430, STEP = 55, BEAM_Y = 410;\nvar STAGES = [\n  {\n    chip: '第一关 · 学操作', mode: 'w2',\n    fixed: [{ el: 'w1', f: 3, g: -4 }], drag: { el: 'w2', f: 2, g: 2 },\n    tag: '可拖动：右边 2N 砝码',\n    notes: ['左边 3N 已放在第 4 格（力矩 3×4＝12）。把右边 2N 拖到力矩也是 12 的格——松手即检验。',\n            '左边沉一点——想想 2×?＝12？那格就在更右边。',\n            '答案：第 6 格，2×6＝12。']\n  },\n  {\n    chip: '第二关 · 倒着想', mode: 'w2',\n    fixed: [{ el: 'w1', f: 2, g: -3 }], drag: { el: 'w2', f: 3, g: 5 },\n    tag: '可拖动：右边 3N 砝码',\n    notes: ['倒着想：左边 2×3＝6。右边的 3N 要放在第几格，才能也凑出 6？',\n            '右边沉了——3×?＝6？格数应该更小。',\n            '答案：第 2 格，3×2＝6。会倒着想，才是真会算。']\n  },\n  {\n    chip: '第三关 · 挪支点', mode: 'pivot',\n    fixed: [{ el: 'w1', f: 4, g: -6 }, { el: 'w2', f: 2, g: 6 }], drag: null,\n    tag: '可拖动：支点 O（左右滑动）',\n    notes: ['终局练习：两端 4N 和 2N 已挂死。拖动支点，让力臂替你找平衡：4×?左 ＝ 2×?右。',\n            '支点太靠右——左边沉。支点要向重的那边挪，力臂才会变。',\n            '答案：支点挪到中点左侧第 2 格：4×4＝16，2×8＝16。']\n  }\n];\nvar svg = document.getElementById('bz');\nvar ticksG = document.getElementById('ticks');\nvar labelsG = document.getElementById('tickLabels');\nvar pivotG = document.getElementById('pivotG');\nvar beamG = document.getElementById('beamG');\nvar tLel = document.getElementById('tL');\nvar tRel = document.getElementById('tR');\nvar eqRow = document.getElementById('eqRow');\nvar eqTxt = document.getElementById('eqTxt');\nvar note = document.getElementById('note');\nvar nextBtn = document.getElementById('nextBtn');\nvar hintBtn = document.getElementById('hintBtn');\nvar modeTag = document.getElementById('modeTag');\nvar stageIdx = 0, pivotX = CX, wrongTries = 0, hintIdx = 0;\nvar W = {};\nfor (var i = -6; i \u003c= 6; i++) {\n  var x = CX + i * STEP;\n  var t = document.createElementNS('http://www.w3.org/2000/svg', 'line');\n  t.setAttribute('x1', x); t.setAttribute('y1', 416); t.setAttribute('x2', x); t.setAttribute('y2', 428);\n  ticksG.appendChild(t);\n  var l = document.createElementNS('http://www.w3.org/2000/svg', 'text');\n  l.setAttribute('x', x); l.setAttribute('y', 448); l.textContent = i;\n  labelsG.appendChild(l);\n}\nfunction xy(evt) {\n  var pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;\n  return pt.matrixTransform(svg.getScreenCTM().inverse());\n}\nfunction snapG(x) {\n  var g = Math.round((x - CX) / STEP);\n  if (g === 0) g = g \u003c 0 ? -1 : 1;\n  return Math.max(-6, Math.min(6, g));\n}\nfunction torques() {\n  var st = STAGES[stageIdx];\n  var pt = Math.round((pivotX - CX) / STEP);\n  var TL = 0, TR = 0;\n  function add(f, g) {\n    var eff = g - pt;\n    if (eff \u003c 0) TL += f * (-eff); else TR += f * eff;\n  }\n  st.fixed.forEach(function (w) { add(w.f, w.g); });\n  if (st.drag) add(st.drag.f, st.drag.g);\n  return { TL: TL, TR: TR };\n}\nfunction render() {\n  var st = STAGES[stageIdx];\n  st.fixed.forEach(function (w) {\n    var el = document.getElementById(w.el);\n    el.setAttribute('transform', 'translate(' + (CX + w.g * STEP) + ',' + 404 + ')');\n    el.classList.add('locked');\n  });\n  if (st.drag) {\n    var el = document.getElementById(st.drag.el);\n    el.setAttribute('transform', 'translate(' + (CX + st.drag.g * STEP) + ',' + 404 + ')');\n    el.classList.remove('locked');\n  }\n  pivotG.setAttribute('transform', 'translate(' + pivotX + ',0)');\n  var q = torques();\n  tLel.textContent = q.TL; tRel.textContent = q.TR;\n  var bal = q.TL === q.TR && (q.TL + q.TR > 0);\n  eqRow.classList.toggle('eqok', bal);\n  eqTxt.textContent = bal ? '是！' : '否';\n  beamG.setAttribute('transform', 'rotate(' + (bal ? 0 : (q.TL > q.TR ? 7 : -7)) + ',' + pivotX + ',' + BEAM_Y + ')');\n  return bal;\n}\nfunction stageSetup(i) {\n  stageIdx = i;\n  var st = STAGES[i];\n  document.getElementById('stageChip').textContent = st.chip;\n  modeTag.textContent = st.tag;\n  st.fixed.forEach(function (w) {\n    var el = document.getElementById(w.el);\n    el.querySelector('text').textContent = w.f + 'N';\n  });\n  if (st.drag) document.getElementById(st.drag.el).querySelector('text').textContent = st.drag.f + 'N';\n  hintIdx = 0;\n  note.className = 'note';\n  note.textContent = st.notes[0];\n  nextBtn.hidden = true;\n  render();\n}\nfunction succeed(msg) {\n  sfx('ok');\n  render();\n  note.textContent = msg;\n  note.className = 'note good';\n  nextBtn.hidden = false;\n}\nfunction releaseCheck() {\n  var st = STAGES[stageIdx];\n  if (render()) {\n    if (stageIdx === 0) succeed('咔——平了！2×6＝12，两头账目相等。');\n    else if (stageIdx === 1) succeed('3×2＝6。会倒着想读平衡条件，才是真会算。');\n    else {\n      stars.save('04', wrongTries === 0 ? 3 : (wrongTries \u003c= 2 ? 2 : 1));\n      sfx('win');\n      note.textContent = '支点挪到中点左侧第 2 格：4×4＝16，2×8＝16——支点一动，力臂就替你干活。这就是「给我一个支点」的全部秘密。';\n      note.className = 'note good';\n      nextBtn.hidden = false;\n      nextBtn.textContent = '带着支点去分拣场 →';\n    }\n  } else {\n    wrongTries++;\n    sfx('no');\n    var q = torques();\n    note.className = 'note bad';\n    note.textContent = st.notes[1 + Math.min(wrongTries - 1, 1)] + '（松手读数：左 ' + q.TL + ' · 右 ' + q.TR + '）';\n  }\n}\nvar drag = null;\nfunction setupDrag() {\n  ['w1', 'w2'].forEach(function (id) {\n    var el = document.getElementById(id);\n    el.addEventListener('pointerdown', function (e) {\n      var st = STAGES[stageIdx];\n      if (st.mode !== 'w2' || !st.drag || st.drag.el !== id || done()) return;\n      e.preventDefault();\n      var pt = xy(e);\n      drag = { el: el, kind: 'w', st: st, sx: pt.x, g0: st.drag.g, nx: CX + st.drag.g * STEP };\n      el.classList.add('dragging');\n      try { el.setPointerCapture(e.pointerId); } catch (err) {}\n      beamG.setAttribute('transform', '');\n      sfx('tap');\n    });\n  });\n  pivotG.addEventListener('pointerdown', function (e) {\n    var st = STAGES[stageIdx];\n    if (st.mode !== 'pivot' || done()) return;\n    e.preventDefault();\n    var pt = xy(e);\n    drag = { el: pivotG, kind: 'pivot', sx: pt.x, px0: pivotX };\n    try { pivotG.setPointerCapture(e.pointerId); } catch (err) {}\n    beamG.setAttribute('transform', '');\n    sfx('tap');\n  });\n  svg.addEventListener('pointermove', function (e) {\n    if (!drag) return;\n    var pt = xy(e);\n    if (drag.kind === 'w') {\n      drag.nx = pt.x - drag.sx + CX + drag.g0 * STEP;\n      drag.st.drag.g = (drag.nx - CX) / STEP;\n      drag.el.setAttribute('transform', 'translate(' + drag.nx + ',404)');\n    } else {\n      pivotX = Math.max(CX - 5 * STEP, Math.min(CX + 5 * STEP, drag.px0 + (pt.x - drag.sx)));\n      pivotG.setAttribute('transform', 'translate(' + pivotX + ',0)');\n    }\n    var q = torques();\n    tLel.textContent = q.TL; tRel.textContent = q.TR;\n  });\n  svg.addEventListener('pointerup', function () {\n    if (!drag) return;\n    var d = drag; drag = null;\n    d.el.classList.remove('dragging');\n    if (d.kind === 'w') {\n      d.st.drag.g = snapG(d.nx);\n      d.el.setAttribute('transform', 'translate(' + (CX + d.st.drag.g * STEP) + ',404)');\n    } else {\n      var t = Math.round((pivotX - CX) / STEP);\n      pivotX = CX + t * STEP;\n      pivotG.setAttribute('transform', 'translate(' + pivotX + ',0)');\n    }\n    releaseCheck();\n  });\n  svg.addEventListener('pointercancel', function () { drag = null; });\n}\nsetupDrag();\nfunction done() { return stageIdx === 2 && !nextBtn.hidden; }\nvar HINTS = [\n  '方法：松手就会检验。左边力矩＝F×格数，右边也一样，两边要相等。',\n  '线索：第一关 2×?＝12；第二关 3×?＝6；第三关 4×?左 ＝ 2×?右。',\n  '别忘了一格都不能少：砝码要卡在整数格上，支点也一样。'\n];\nhintBtn.addEventListener('click', function () {\n  note.className = 'note';\n  note.textContent = HINTS[Math.min(hintIdx, HINTS.length - 1)];\n  hintIdx++;\n  sfx('tap');\n});\nnextBtn.addEventListener('click', function () {\n  sfx('tap');\n  if (stageIdx \u003c 2) stageSetup(stageIdx + 1);\n  else deck('next');\n});\nstageSetup(0);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },
    { title: "三类杠杆", src: "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>阿基米德的机械房 · 05 · 省力，费力，还是打平\u003c/title>\n\u003cstyle>\n/* ========== 一、配色：蓝图里选定的那一组，整套课件每一页完全一样 ========== */\n:root {\n  --bg: #000000;                      /* 底色 */\n  --surface: #131313;                 /* 卡片、面板 */\n  --surface-2: #222222;               /* 凹槽、轨道、未选中的底 */\n  --ink: #FFFFFF;                     /* 主文字 */\n  --ink-2: #B9B9B9;                   /* 次要文字 */\n  --ink-3: #7C7C7C;                   /* 说明文字 */\n  --line: rgba(255, 255, 255, 0.14);  /* 描边、分隔线 */\n  --accent: #FFD23F;                  /* 唯一的强调色 */\n  --accent-ink: #1A1400;              /* 强调色上面的文字 */\n}\n/* ========== 二、骨架和部件：每一页完全一样，不要改 ========== */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { font-size: clamp(16px, calc(min(1vw, 1.78vh) * 1.12), 34px); }   /* 1rem 跟着屏幕等比缩放，1080p 下约 21px。尺寸都用 rem 写 */\nhtml, body { height: 100%; margin: 0; }\nbody { background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.7; overflow: hidden;\n  font-family: \"PingFang SC\", \"HarmonyOS Sans SC\", \"Microsoft YaHei\", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\nh1, h2, h3, p, ul, ol, figure { margin: 0; }\nh1 { font-size: 3rem; line-height: 1.15; font-weight: 800; text-wrap: balance; }\nh2 { font-size: 2rem; line-height: 1.2; font-weight: 800; text-wrap: balance; }\nh3 { font-size: 1.3rem; line-height: 1.3; font-weight: 700; }\nbutton { font: inherit; color: inherit; }\nsvg { display: block; max-width: 100%; }\n/* 舞台：占满整屏。内容区 main 吃掉标题以下的全部空间 */\n.stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 1.2rem;\n  padding: clamp(20px, 4.5vh, 64px) clamp(20px, 5vw, 110px) clamp(16px, 3vh, 44px); }\n.stage > main { flex: 1; min-height: 0; }\n.kicker { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); }\n.lead { font-size: 1.25rem; color: var(--ink-2); max-width: 30em; }\n.small { font-size: max(0.8rem, 14px); color: var(--ink-3); }\n.num { font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }\n.hl { color: var(--accent); }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; min-height: 52px; padding: 0.5em 1.6em;\n  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;\n  transition: transform 0.12s, filter 0.15s, opacity 0.15s; }\n.btn:hover { filter: brightness(1.06); }\n.btn:active { transform: scale(0.97); }\n.btn[disabled] { opacity: 0.4; cursor: not-allowed; }\n.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }\n.card { background: var(--surface); border-radius: 1rem; padding: 1.4rem; }\n.chip { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.15em 0.8em; border-radius: 999px;\n  background: var(--surface-2); color: var(--ink-2); font-size: max(0.8rem, 14px); font-weight: 600; white-space: nowrap; }\n/* 反馈区：固定放在页面里的一行，不用弹窗。对 = 强调色加对勾；错 = 文字说明加抖动，不用红色 */\n.note { min-height: 3.4em; color: var(--ink-2); }\n.note.good { color: var(--accent); }\n.note.bad { color: var(--ink); }\n.shake { animation: shake 0.32s linear; }\n.pop { animation: pop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }\n@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }\n@keyframes pop { 50% { transform: scale(1.14); } }\n/* 入场：给元素加 class=\"in\"，再用 style=\"--i:1\" 排先后 */\n.in { animation: in 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }\n@keyframes in { from { opacity: 0; transform: translateY(1.2rem); } }\n/* 小屏：改成可以上下滚动的单列 */\n@media (max-width: 720px) {\n  body { overflow: auto; }\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n[hidden] { display: none !important; }\n.duo { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 2.2rem; min-height: 0; }\n.fig { min-height: 0; display: flex; align-items: center; justify-content: center; }\n.fig svg { max-height: 100%; width: auto; max-width: 100%; }\n.right { display: flex; flex-direction: column; gap: 0.8rem; min-height: 0; }\n.typecard { border: 1.5px solid var(--line); border-radius: 1rem; padding: 0.85rem 1.15rem; background: var(--surface);\n  opacity: 0.26; transform: translateX(-6px); transition: opacity 0.35s, transform 0.35s, border-color 0.35s; }\n.typecard.on { opacity: 1; transform: none; border-color: var(--accent); }\n.typecard h3 { display: flex; align-items: baseline; gap: 0.6em; }\n.typecard h3 .num { font-size: 0.95em; color: var(--accent); }\n.typecard p { margin: 0; color: var(--ink-2); font-size: 0.98rem; }\n.bigline { font-size: 1.6rem; font-weight: 800; text-align: center; color: var(--accent); letter-spacing: 0.06em;\n  opacity: 0; transform: scale(0.94); transition: opacity 0.5s, transform 0.5s; }\n.bigline.on { opacity: 1; transform: none; }\n.foot { display: flex; justify-content: flex-end; margin-top: auto; }\n.typecard .eg { margin-top: 0.3em; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">手稿一 · 加分类\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">省力，费力，还是打平\u003c/h1>\n  \u003c/header>\n  \u003cmain class=\"duo\">\n    \u003cfigure class=\"fig in\" style=\"--i:2\">\n      \u003csvg viewBox=\"0 0 520 430\" role=\"img\" aria-label=\"三类杠杆示意\">\n        \u003cg id=\"row1\" opacity=\"0.3\">\n          \u003cline x1=\"60\" y1=\"80\" x2=\"440\" y2=\"80\" stroke=\"var(--ink)\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n          \u003cpolygon points=\"330,130 390,130 360,86\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n          \u003cline x1=\"90\" y1=\"36\" x2=\"98\" y2=\"72\" stroke=\"var(--accent)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n          \u003crect x=\"392\" y=\"44\" width=\"52\" height=\"36\" rx=\"6\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n          \u003ctext x=\"52\" y=\"82\" font-size=\"15\" font-weight=\"700\" fill=\"var(--accent)\">F₁\u003c/text>\n          \u003ctext x=\"424\" y=\"30\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink-2)\">F₂\u003c/text>\n          \u003ctext x=\"225\" y=\"158\" text-anchor=\"middle\" font-size=\"15\" fill=\"var(--ink-2)\">L₁ ＞ L₂\u003c/text>\n          \u003ctext x=\"225\" y=\"188\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"800\" fill=\"var(--accent)\">省力杠杆\u003c/text>\n        \u003c/g>\n        \u003cg id=\"row2\" opacity=\"0.3\">\n          \u003cline x1=\"80\" y1=\"210\" x2=\"460\" y2=\"210\" stroke=\"var(--ink)\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n          \u003cpolygon points=\"95,260 155,260 125,216\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n          \u003cline x1=\"440\" y1=\"166\" x2=\"448\" y2=\"202\" stroke=\"var(--accent)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n          \u003crect x=\"34\" y=\"176\" width=\"52\" height=\"34\" rx=\"6\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n          \u003ctext x=\"472\" y=\"212\" font-size=\"15\" font-weight=\"700\" fill=\"var(--accent)\">F₁\u003c/text>\n          \u003ctext x=\"64\" y=\"164\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink-2)\">F₂\u003c/text>\n          \u003ctext x=\"245\" y=\"288\" text-anchor=\"middle\" font-size=\"15\" fill=\"var(--ink-2)\">L₁ ＜ L₂\u003c/text>\n          \u003ctext x=\"245\" y=\"318\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"800\" fill=\"var(--ink)\">费力杠杆\u003c/text>\n        \u003c/g>\n        \u003cg id=\"row3\" opacity=\"0.3\">\n          \u003cline x1=\"80\" y1=\"350\" x2=\"440\" y2=\"350\" stroke=\"var(--ink)\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n          \u003cpolygon points=\"230,400 290,400 260,356\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n          \u003cline x1=\"410\" y1=\"306\" x2=\"418\" y2=\"342\" stroke=\"var(--accent)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n          \u003crect x=\"110\" y=\"316\" width=\"52\" height=\"34\" rx=\"6\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n          \u003ctext x=\"422\" y=\"288\" font-size=\"15\" font-weight=\"700\" fill=\"var(--accent)\">F₁\u003c/text>\n          \u003ctext x=\"66\" y=\"306\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink-2)\">F₂＝F₁\u003c/text>\n          \u003ctext x=\"245\" y=\"428\" text-anchor=\"middle\" font-size=\"15\" fill=\"var(--ink-2)\">L₁ ＝ L₂\u003c/text>\n        \u003c/g>\n        \u003ctext x=\"470\" y=\"430\" text-anchor=\"end\" font-size=\"15\" fill=\"var(--ink-3)\">等臂杠杆：天平\u003c/text>\n      \u003c/svg>\n    \u003c/figure>\n    \u003cdiv class=\"right\">\n      \u003cp class=\"lead in\" style=\"--i:2\">撬棍学会了，阿基米德递来第二页：\u003cb class=\"hl\">天下的杠杆，只分三类\u003c/b>。判据只有一条——比两条力臂的长短。\u003c/p>\n      \u003cdiv class=\"typecard\" id=\"c1\">\n        \u003ch3>省力杠杆 \u003cspan class=\"num\">L₁ ＞ L₂\u003c/span>\u003c/h3>\n        \u003cp class=\"eg\">老虎钳、开瓶器、独轮车、老虎剪\u003c/p>\n        \u003cp>小力撼大物。代价：手要压过\u003cb class=\"hl\">一大段距离\u003c/b>。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"typecard\" id=\"c2\">\n        \u003ch3>费力杠杆 \u003cspan class=\"num\">L₁ ＜ L₂\u003c/span>\u003c/h3>\n        \u003cp class=\"eg\">镊子、钓鱼竿、筷子、理发剪\u003c/p>\n        \u003cp>费力气，买回来的是\u003cb class=\"hl\">距离与精准\u003c/b>——手指动 1 厘米，镊尖恰好合拢。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"typecard\" id=\"c3\">\n        \u003ch3>等臂杠杆 \u003cspan class=\"num\">L₁ ＝ L₂\u003c/span>\u003c/h3>\n        \u003cp class=\"eg\">天平、跷跷板（两边一样重时）\u003c/p>\n        \u003cp>不省不费，专门用来\u003cb class=\"hl\">比较\u003c/b>两边的分量。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"bigline num\" id=\"bigline\">省力，必费距离\u003c/div>\n      \u003cp class=\"note\" id=\"note\">三类怎么分？不用背例子，只比力臂。逐类过一遍。\u003c/p>\n      \u003cdiv class=\"foot\">\n        \u003cbutton class=\"btn in\" style=\"--i:3\" id=\"mainBtn\">先看省力杠杆\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\nvar NOTE_TEXT = [\n  '动力臂更长——省的是力，费的是距离：撬一块石头，手要压下半米，石头才抬起一指宽。',\n  '费力不白费：镊尖合拢 1 毫米，手指只需挪 1 厘米的一半——精准的活都交给它。',\n  '天平两臂等长，谁重谁轻，一比便知。',\n  '天下机械一条铁账：省什么，就费什么。阿基米德省的是力，费的是「手要移动一大段路」——他的滑轮组也一样。'\n];\nvar stage = 0;\nvar note = document.getElementById('note');\nvar mainBtn = document.getElementById('mainBtn');\nvar ROWS = ['row1', 'row2', 'row3'];\nvar CARDS = ['c1', 'c2', 'c3'];\nvar LABELS = ['再看费力杠杆', '然后是等臂', '记住那条铁账 →'];\nfunction setStage(n) {\n  if (n \u003c= stage) return;\n  stage = n;\n  if (n \u003c= 3) {\n    document.getElementById(ROWS[n - 1]).style.opacity = 1;\n    document.getElementById(CARDS[n - 1]).classList.add('on');\n    note.textContent = NOTE_TEXT[n - 1];\n    mainBtn.textContent = LABELS[n - 1];\n    sfx('tap');\n  } else {\n    document.getElementById('bigline').classList.add('on');\n    fx(document.getElementById('bigline'), 'pop');\n    note.textContent = NOTE_TEXT[3];\n    note.className = 'note good';\n    sfx('win');\n    mainBtn.textContent = '铁账在心，去分拣场检验 →';\n  }\n}\nmainBtn.addEventListener('click', function () {\n  if (stage \u003c 4) { setStage(stage + 1); }\n  else { sfx('tap'); deck('next'); }\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },
    { title: "杠杆分拣", src: "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>阿基米德的机械房 · 06 · 八件兵器，两口箱子\u003c/title>\n\u003cstyle>\n/* ========== 一、配色：蓝图里选定的那一组，整套课件每一页完全一样 ========== */\n:root {\n  --bg: #000000;                      /* 底色 */\n  --surface: #131313;                 /* 卡片、面板 */\n  --surface-2: #222222;               /* 凹槽、轨道、未选中的底 */\n  --ink: #FFFFFF;                     /* 主文字 */\n  --ink-2: #B9B9B9;                   /* 次要文字 */\n  --ink-3: #7C7C7C;                   /* 说明文字 */\n  --line: rgba(255, 255, 255, 0.14);  /* 描边、分隔线 */\n  --accent: #FFD23F;                  /* 唯一的强调色 */\n  --accent-ink: #1A1400;              /* 强调色上面的文字 */\n}\n/* ========== 二、骨架和部件：每一页完全一样，不要改 ========== */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { font-size: clamp(16px, calc(min(1vw, 1.78vh) * 1.12), 34px); }   /* 1rem 跟着屏幕等比缩放，1080p 下约 21px。尺寸都用 rem 写 */\nhtml, body { height: 100%; margin: 0; }\nbody { background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.7; overflow: hidden;\n  font-family: \"PingFang SC\", \"HarmonyOS Sans SC\", \"Microsoft YaHei\", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\nh1, h2, h3, p, ul, ol, figure { margin: 0; }\nh1 { font-size: 3rem; line-height: 1.15; font-weight: 800; text-wrap: balance; }\nh2 { font-size: 2rem; line-height: 1.2; font-weight: 800; text-wrap: balance; }\nh3 { font-size: 1.3rem; line-height: 1.3; font-weight: 700; }\nbutton { font: inherit; color: inherit; }\nsvg { display: block; max-width: 100%; }\n/* 舞台：占满整屏。内容区 main 吃掉标题以下的全部空间 */\n.stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 1.2rem;\n  padding: clamp(20px, 4.5vh, 64px) clamp(20px, 5vw, 110px) clamp(16px, 3vh, 44px); }\n.stage > main { flex: 1; min-height: 0; }\n.kicker { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); }\n.lead { font-size: 1.25rem; color: var(--ink-2); max-width: 30em; }\n.small { font-size: max(0.8rem, 14px); color: var(--ink-3); }\n.num { font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }\n.hl { color: var(--accent); }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; min-height: 52px; padding: 0.5em 1.6em;\n  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;\n  transition: transform 0.12s, filter 0.15s, opacity 0.15s; }\n.btn:hover { filter: brightness(1.06); }\n.btn:active { transform: scale(0.97); }\n.btn[disabled] { opacity: 0.4; cursor: not-allowed; }\n.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }\n.card { background: var(--surface); border-radius: 1rem; padding: 1.4rem; }\n.chip { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.15em 0.8em; border-radius: 999px;\n  background: var(--surface-2); color: var(--ink-2); font-size: max(0.8rem, 14px); font-weight: 600; white-space: nowrap; }\n/* 反馈区：固定放在页面里的一行，不用弹窗。对 = 强调色加对勾；错 = 文字说明加抖动，不用红色 */\n.note { min-height: 3.4em; color: var(--ink-2); }\n.note.good { color: var(--accent); }\n.note.bad { color: var(--ink); }\n.shake { animation: shake 0.32s linear; }\n.pop { animation: pop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }\n@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }\n@keyframes pop { 50% { transform: scale(1.14); } }\n/* 入场：给元素加 class=\"in\"，再用 style=\"--i:1\" 排先后 */\n.in { animation: in 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }\n@keyframes in { from { opacity: 0; transform: translateY(1.2rem); } }\n/* 小屏：改成可以上下滚动的单列 */\n@media (max-width: 720px) {\n  body { overflow: auto; }\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n[hidden] { display: none !important; }\n.col { display: flex; flex-direction: column; gap: 0.6rem; min-height: 0; flex: 1; }\n.items { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.6rem; }\n.item { border: 1.5px solid var(--line); border-radius: 0.9rem; background: var(--surface); padding: 0.4rem 0.3rem 0.3rem;\n  display: flex; flex-direction: column; align-items: center; gap: 0.1rem; cursor: pointer; text-align: center;\n  transition: border-color 0.2s, transform 0.12s; }\n.item:hover { border-color: color-mix(in srgb, var(--ink) 32%, transparent); }\n.item:active { transform: scale(0.98); }\n.item.sel { border-color: var(--accent); }\n.item svg { height: 78px; width: auto; max-width: 100%; }\n.item .nm { font-size: max(0.8rem, 14px); font-weight: 700; }\n.item .tip { font-size: 12px; color: var(--ink-3); }\n.bins { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }\n.bin { border: 1.5px dashed var(--line); border-radius: 1.2rem; padding: 0.6rem 1rem; min-height: 5.2em; cursor: pointer;\n  transition: border-color 0.2s, background 0.2s; }\n.bin.hot { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }\n.bin.filled { border-style: solid; }\n.bin h3 { display: flex; align-items: baseline; gap: 0.6em; }\n.bin h3 .num { font-size: 0.9rem; color: var(--accent); }\n.bin .sub { font-size: max(0.8rem, 14px); color: var(--ink-3); }\n.bin .stack { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.4rem; }\n.bin .sub { margin: 0; }\n.foot { display: flex; gap: 0.8rem; justify-content: flex-end; align-items: center; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">练习 · 分拣场\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">八件兵器，两口箱子\u003c/h1>\n  \u003c/header>\n  \u003cmain class=\"col\">\n    \u003cp class=\"lead in\" style=\"--i:2\">每件兵器都标了\u003cb class=\"hl\">黄点＝支点\u003c/b>。看支点两边谁的力臂长，点选它，投进对应的箱子。\u003c/p>\n    \u003cdiv class=\"items in\" style=\"--i:3\">\n      \u003cdiv class=\"item\" data-i=\"0\">\n        \u003csvg viewBox=\"0 0 110 66\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linecap=\"round\">\u003cline x1=\"30\" y1=\"12\" x2=\"80\" y2=\"52\"/>\u003cline x1=\"80\" y1=\"12\" x2=\"30\" y2=\"52\"/>\u003ccircle cx=\"26\" cy=\"54\" r=\"7\"/>\u003ccircle cx=\"84\" cy=\"54\" r=\"7\"/>\u003c/g>\u003ccircle cx=\"55\" cy=\"33\" r=\"5\" fill=\"var(--accent)\"/>\u003c/svg>\n        \u003cspan class=\"nm\">剪刀\u003c/span>\u003cspan class=\"tip\">支点在中间\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"item\" data-i=\"1\">\n        \u003csvg viewBox=\"0 0 110 66\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linecap=\"round\">\u003cline x1=\"42\" y1=\"10\" x2=\"20\" y2=\"56\"/>\u003cline x1=\"52\" y1=\"10\" x2=\"30\" y2=\"56\"/>\u003cline x1=\"20\" y1=\"56\" x2=\"30\" y2=\"56\"/>\u003c/g>\u003ccircle cx=\"46\" cy=\"14\" r=\"5\" fill=\"var(--accent)\"/>\u003c/svg>\n        \u003cspan class=\"nm\">镊子\u003c/span>\u003cspan class=\"tip\">支点在尾端\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"item\" data-i=\"2\">\n        \u003csvg viewBox=\"0 0 110 66\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linecap=\"round\">\u003cline x1=\"16\" y1=\"30\" x2=\"70\" y2=\"24\"/>\u003cline x1=\"16\" y1=\"42\" x2=\"70\" y2=\"34\"/>\u003cpath d=\"M70 24 q 22 2 24 8 M70 34 q 20 6 24 2\"/>\u003c/g>\u003ccircle cx=\"24\" cy=\"36\" r=\"5\" fill=\"var(--accent)\"/>\u003c/svg>\n        \u003cspan class=\"nm\">老虎钳\u003c/span>\u003cspan class=\"tip\">支点在钳转轴\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"item\" data-i=\"3\">\n        \u003csvg viewBox=\"0 0 110 66\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linecap=\"round\">\u003cpath d=\"M14 16 q 40 -6 80 10\"/>\u003cpath d=\"M26 18 q 30 0 52 16\"/>\u003cpath d=\"M52 8 l 10 -4\"/>\u003c/g>\u003ccircle cx=\"76\" cy=\"26\" r=\"5\" fill=\"var(--accent)\"/>\u003ccircle cx=\"20\" cy=\"15\" r=\"4\" fill=\"var(--accent-ink)\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\u003c/svg>\n        \u003cspan class=\"nm\">理发剪\u003c/span>\u003cspan class=\"tip\">支点偏向刀尖\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"item\" data-i=\"4\">\n        \u003csvg viewBox=\"0 0 110 66\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linecap=\"round\">\u003cpath d=\"M70 10 L82 44 q 2 8 -8 10 L48 60\"/>\u003cpath d=\"M62 14 L50 30 M78 16 L66 34\"/>\u003c/g>\u003ccircle cx=\"72\" cy=\"12\" r=\"5\" fill=\"var(--accent)\"/>\u003c/svg>\n        \u003cspan class=\"nm\">开瓶器\u003c/span>\u003cspan class=\"tip\">支点在钩头\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"item\" data-i=\"5\">\n        \u003csvg viewBox=\"0 0 110 66\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linecap=\"round\">\u003cpath d=\"M10 14 Q 70 30 100 52\"/>\u003ccircle cx=\"26\" cy=\"21\" r=\"8\"/>\u003cpath d=\"M100 52 l 4 8\"/>\u003c/g>\u003ccircle cx=\"16\" cy=\"14\" r=\"5\" fill=\"var(--accent)\"/>\u003c/svg>\n        \u003cspan class=\"nm\">钓鱼竿\u003c/span>\u003cspan class=\"tip\">支点在竿尾\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"item\" data-i=\"6\">\n        \u003csvg viewBox=\"0 0 110 66\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linecap=\"round\">\u003cpath d=\"M30 40 L14 24\"/>\u003cpath d=\"M30 40 L54 42 L92 26\"/>\u003cpath d=\"M54 42 q 4 10 -2 16\"/>\u003ccircle cx=\"30\" cy=\"44\" r=\"10\"/>\u003c/g>\u003ccircle cx=\"30\" cy=\"44\" r=\"4.5\" fill=\"var(--accent)\"/>\u003c/svg>\n        \u003cspan class=\"nm\">独轮车\u003c/span>\u003cspan class=\"tip\">支点在轮轴\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"item\" data-i=\"7\">\n        \u003csvg viewBox=\"0 0 110 66\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linecap=\"round\">\u003cline x1=\"52\" y1=\"8\" x2=\"60\" y2=\"60\"/>\u003cline x1=\"60\" y1=\"8\" x2=\"54\" y2=\"60\"/>\u003c/g>\u003ccircle cx=\"56\" cy=\"10\" r=\"5\" fill=\"var(--accent)\"/>\u003c/svg>\n        \u003cspan class=\"nm\">筷子\u003c/span>\u003cspan class=\"tip\">支点在上端\u003c/span>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"bins in\" style=\"--i:4\">\n      \u003cdiv class=\"bin\" id=\"binSave\">\n        \u003ch3>省力杠杆箱 \u003cspan class=\"num\">L₁ ＞ L₂\u003c/span>\u003c/h3>\n        \u003cp class=\"sub\">小力办大事，代价是压过更长的路\u003c/p>\n        \u003cdiv class=\"stack\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"bin\" id=\"binCost\">\n        \u003ch3>费力杠杆箱 \u003cspan class=\"num\">L₁ ＜ L₂\u003c/span>\u003c/h3>\n        \u003cp class=\"sub\">费点力气，换距离与精准\u003c/p>\n        \u003cdiv class=\"stack\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cp class=\"note in\" style=\"--i:5\" id=\"note\">点一件兵器选中它，再点箱子投进去。全归位即出师。\u003c/p>\n    \u003cdiv class=\"foot in\" style=\"--i:6\">\n      \u003cspan class=\"chip num\" id=\"progress\">已归档 0 ／ 8\u003c/span>\n      \u003cbutton class=\"btn ghost\" id=\"hintBtn\">提示\u003c/button>\n      \u003cbutton class=\"btn\" id=\"goNext\" hidden>机械房大堂集合 →\u003c/button>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 八件兵器：type 0 = 省力，1 = 费力。wrong = 投错箱时的纠偏讲解 */\nvar ITEMS = [\n  { name: '剪刀', type: 0, wrong: '剪刀的支点在中间转轴：手指那段（动力臂）比裁布那段（阻力臂）长——它是省力的，别委屈它。' },\n  { name: '镊子', type: 1, wrong: '镊子支点在尾端，手指用力处离支点近、镊尖离得远——动力臂短，它是费力杠杆。' },\n  { name: '老虎钳', type: 0, wrong: '老虎钳的钳口离转轴近、手柄离转轴远——动力臂长，典型的省力杠杆。' },\n  { name: '理发剪', type: 1, wrong: '理发剪的支点偏向刀尖，手指捏的长柄是动力臂——臂短力大？不，它是特意做成费力的：省距离，剪得快。' },\n  { name: '开瓶器', type: 0, wrong: '开瓶器支点在钩头，瓶盖的阻力离它近、你的手离它远——动力臂长，省力。' },\n  { name: '钓鱼竿', type: 1, wrong: '鱼竿支点在竿尾，鱼在远端——动力臂短、阻力臂长，费力，但鱼一挣，竿尖移动一大段，正好卸力。' },\n  { name: '独轮车', type: 0, wrong: '独轮车的支点是轮轴：货物到轮轴近、手把到轮轴远——动力臂长，省力。' },\n  { name: '筷子', type: 1, wrong: '筷子支点在虎口上端，手指用力的位置到支点近、夹菜端到支点远——费力，但夹得稳准。' }\n];\nvar note = document.getElementById('note');\nvar progress = document.getElementById('progress');\nvar goNext = document.getElementById('goNext');\nvar placed = 0, mistakes = 0, hintIdx = 0, selected = null;\nvar binSave = document.getElementById('binSave');\nvar binCost = document.getElementById('binCost');\nvar items = document.querySelectorAll('.item');\nfunction hot(w) {\n  binSave.classList.toggle('hot', selected !== null && w !== 1);\n  binCost.classList.toggle('hot', selected !== null && w !== 0);\n}\nitems.forEach(function (el) {\n  el.addEventListener('click', function () {\n    var i = Number(el.dataset.i);\n    if (selected === el) { el.classList.remove('sel'); selected = null; hot(null); return; }\n    if (selected) selected.classList.remove('sel');\n    selected = el;\n    el.classList.add('sel');\n    sfx('tap');\n    hot(ITEMS[i].type);\n  });\n});\n[binSave, binCost].forEach(function (bin) {\n  bin.addEventListener('click', function () {\n    if (!selected) return;\n    var i = Number(selected.dataset.i);\n    var item = ITEMS[i];\n    var w = bin === binSave ? 0 : 1;\n    if (item.type === w) {\n      var chip = document.createElement('span');\n      chip.className = 'chip';\n      chip.textContent = item.name;\n      bin.querySelector('.stack').appendChild(chip);\n      selected.classList.remove('sel');\n      selected.style.visibility = 'hidden';\n      selected = null;\n      hot(null);\n      placed++;\n      sfx('ok');\n      fx(bin, 'pop');\n      progress.textContent = '已归档 ' + placed + ' ／ 8';\n      note.className = 'note';\n      if (placed \u003c 8) note.textContent = '归档 ' + placed + ' ／ 8。看支点两边谁长，不背例子。';\n      else {\n        stars.save('06', mistakes === 0 ? 3 : (mistakes \u003c= 2 ? 2 : 1));\n        note.textContent = '八件兵器各归其位——读支点、比力臂，比背例子管用。';\n        note.className = 'note good';\n        goNext.hidden = false;\n        sfx('win');\n      }\n    } else {\n      mistakes++;\n      sfx('no');\n      fx(selected, 'shake');\n      note.textContent = item.wrong;\n      note.className = 'note bad';\n    }\n  });\n});\ndocument.getElementById('hintBtn').addEventListener('click', function () {\n  note.className = 'note';\n  var tips = [\n    '方法：黄点是支点。支点到手/动力近、到重物远＝省力；反之＝费力。',\n    '线索：拿不准就想想用它时的动作——手指挪得多，还是物品动得多？',\n    '答案：省力箱收剪刀、老虎钳、开瓶器、独轮车；其余归费力箱。'\n  ];\n  note.textContent = tips[Math.min(hintIdx, tips.length - 1)];\n  hintIdx++;\n  sfx('tap');\n});\ngoNext.addEventListener('click', function () { sfx('tap'); deck('next'); });\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },
    { title: "定滑动滑", src: "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>阿基米德的机械房 · 07 · 一只轮子的两种脾气\u003c/title>\n\u003cstyle>\n/* ========== 一、配色：蓝图里选定的那一组，整套课件每一页完全一样 ========== */\n:root {\n  --bg: #000000;                      /* 底色 */\n  --surface: #131313;                 /* 卡片、面板 */\n  --surface-2: #222222;               /* 凹槽、轨道、未选中的底 */\n  --ink: #FFFFFF;                     /* 主文字 */\n  --ink-2: #B9B9B9;                   /* 次要文字 */\n  --ink-3: #7C7C7C;                   /* 说明文字 */\n  --line: rgba(255, 255, 255, 0.14);  /* 描边、分隔线 */\n  --accent: #FFD23F;                  /* 唯一的强调色 */\n  --accent-ink: #1A1400;              /* 强调色上面的文字 */\n}\n/* ========== 二、骨架和部件：每一页完全一样，不要改 ========== */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { font-size: clamp(16px, calc(min(1vw, 1.78vh) * 1.12), 34px); }   /* 1rem 跟着屏幕等比缩放，1080p 下约 21px。尺寸都用 rem 写 */\nhtml, body { height: 100%; margin: 0; }\nbody { background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.7; overflow: hidden;\n  font-family: \"PingFang SC\", \"HarmonyOS Sans SC\", \"Microsoft YaHei\", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\nh1, h2, h3, p, ul, ol, figure { margin: 0; }\nh1 { font-size: 3rem; line-height: 1.15; font-weight: 800; text-wrap: balance; }\nh2 { font-size: 2rem; line-height: 1.2; font-weight: 800; text-wrap: balance; }\nh3 { font-size: 1.3rem; line-height: 1.3; font-weight: 700; }\nbutton { font: inherit; color: inherit; }\nsvg { display: block; max-width: 100%; }\n/* 舞台：占满整屏。内容区 main 吃掉标题以下的全部空间 */\n.stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 1.2rem;\n  padding: clamp(20px, 4.5vh, 64px) clamp(20px, 5vw, 110px) clamp(16px, 3vh, 44px); }\n.stage > main { flex: 1; min-height: 0; }\n.kicker { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); }\n.lead { font-size: 1.25rem; color: var(--ink-2); max-width: 30em; }\n.small { font-size: max(0.8rem, 14px); color: var(--ink-3); }\n.num { font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }\n.hl { color: var(--accent); }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; min-height: 52px; padding: 0.5em 1.6em;\n  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;\n  transition: transform 0.12s, filter 0.15s, opacity 0.15s; }\n.btn:hover { filter: brightness(1.06); }\n.btn:active { transform: scale(0.97); }\n.btn[disabled] { opacity: 0.4; cursor: not-allowed; }\n.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }\n.card { background: var(--surface); border-radius: 1rem; padding: 1.4rem; }\n.chip { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.15em 0.8em; border-radius: 999px;\n  background: var(--surface-2); color: var(--ink-2); font-size: max(0.8rem, 14px); font-weight: 600; white-space: nowrap; }\n/* 反馈区：固定放在页面里的一行，不用弹窗。对 = 强调色加对勾；错 = 文字说明加抖动，不用红色 */\n.note { min-height: 3.4em; color: var(--ink-2); }\n.note.good { color: var(--accent); }\n.note.bad { color: var(--ink); }\n.shake { animation: shake 0.32s linear; }\n.pop { animation: pop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }\n@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }\n@keyframes pop { 50% { transform: scale(1.14); } }\n/* 入场：给元素加 class=\"in\"，再用 style=\"--i:1\" 排先后 */\n.in { animation: in 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }\n@keyframes in { from { opacity: 0; transform: translateY(1.2rem); } }\n/* 小屏：改成可以上下滚动的单列 */\n@media (max-width: 720px) {\n  body { overflow: aut
