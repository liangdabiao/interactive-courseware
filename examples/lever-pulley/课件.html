o; }\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n[hidden] { display: none !important; }\n.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; flex: 1; min-height: 0; }\n.panel { background: var(--surface); border-radius: 1.2rem; padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.5rem;\n  opacity: 0.3; transition: opacity 0.4s; }\n.panel.on { opacity: 1; }\n.panel svg { flex: 1; min-height: 0; max-height: 100%; width: auto; max-width: 100%; margin: 0 auto; }\n.panel h3 { display: flex; align-items: baseline; gap: 0.6em; }\n.panel h3 .num { font-size: 0.9rem; color: var(--accent); }\n.panel .say { font-size: max(0.8rem, 14px); color: var(--ink-3); }\n.bill { display: flex; flex-direction: column; gap: 0.5rem; }\n.brow { display: flex; gap: 0.7em; align-items: baseline; padding: 0.42em 0.7em; border-radius: 0.8rem;\n  background: var(--surface); border: 1.5px solid var(--line); opacity: 0.25;\n  transition: opacity 0.35s, transform 0.35s, border-color 0.35s; }\n.brow.on { opacity: 1; transform: none; }\n.brow.ok { border-color: var(--accent); }\n.brow .chip { flex: none; }\n.foot { display: flex; justify-content: flex-end; margin-top: auto; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">手稿二 · 滑轮\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">一只轮子的两种脾气\u003c/h1>\n  \u003c/header>\n  \u003cmain style=\"display:flex; flex-direction:column; gap:1rem; min-height:0;\">\n    \u003cp class=\"lead in\" style=\"--i:2\">滑轮就是穿了绳子的轮子。但\u003cb class=\"hl\">轴装在哪\u003c/b>，脾气完全不同——定滑轮老实，动滑轮讨巧。秘诀还是那句话：看它的\u003cb class=\"hl\">杠杆臂\u003c/b>。\u003c/p>\n    \u003cdiv class=\"panels\">\n      \u003cdiv class=\"panel in\" style=\"--i:3\" id=\"pFixed\">\n        \u003ch3>定滑轮 \u003cspan class=\"num\">轴固定不动 · 等臂杠杆\u003c/span>\u003c/h3>\n        \u003csvg viewBox=\"0 0 320 250\" role=\"img\" aria-label=\"定滑轮：两臂都是半径\">\n          \u003cline x1=\"60\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--ink)\" stroke-width=\"4\"/>\n          \u003cline x1=\"116\" y1=\"34\" x2=\"116\" y2=\"92\" stroke=\"var(--ink-3)\" stroke-width=\"2\"/>\n          \u003cline x1=\"204\" y1=\"34\" x2=\"204\" y2=\"92\" stroke=\"var(--ink-3)\" stroke-width=\"2\"/>\n          \u003ccircle cx=\"160\" cy=\"92\" r=\"44\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"4\"/>\n          \u003ccircle cx=\"160\" cy=\"92\" r=\"6\" fill=\"var(--accent)\"/>\n          \u003cline x1=\"116\" y1=\"90\" x2=\"116\" y2=\"216\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003cline x1=\"204\" y1=\"90\" x2=\"204\" y2=\"216\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003crect x=\"94\" y=\"216\" width=\"44\" height=\"30\" rx=\"6\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n          \u003ctext x=\"116\" y=\"264\" text-anchor=\"middle\" font-size=\"14\" fill=\"var(--ink-2)\">G＝400N\u003c/text>\n          \u003cpolygon points=\"204,150 195,168 213,168\" fill=\"var(--accent)\"/>\n          \u003ctext x=\"216\" y=\"166\" font-size=\"15\" font-weight=\"800\" fill=\"var(--accent)\">F＝400N\u003c/text>\n          \u003cg id=\"fxR1\" opacity=\"0\">\n            \u003cline x1=\"116\" y1=\"92\" x2=\"204\" y2=\"92\" stroke=\"var(--accent)\" stroke-width=\"3\" stroke-dasharray=\"7 6\"/>\n            \u003ctext x=\"160\" y=\"76\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"var(--accent)\">L₁＝R　L₂＝R\u003c/text>\n          \u003c/g>\n        \u003c/svg>\n        \u003cp class=\"say\" id=\"say1\">脾气：只帮你改变用力的方向，一点不省力。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"panel in\" style=\"--i:4\" id=\"pMove\">\n        \u003ch3>动滑轮 \u003cspan class=\"num\">轴跟着货走 · 动力臂＝2R\u003c/span>\u003c/h3>\n        \u003csvg viewBox=\"0 0 320 250\" role=\"img\" aria-label=\"动滑轮：动力臂是直径\">\n          \u003cline x1=\"60\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--ink)\" stroke-width=\"4\"/>\n          \u003cline x1=\"116\" y1=\"34\" x2=\"116\" y2=\"122\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003cline x1=\"204\" y1=\"34\" x2=\"204\" y2=\"122\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003ccircle cx=\"160\" cy=\"122\" r=\"44\" fill=\"var(--accent)\" fill-opacity=\"0.22\" stroke=\"var(--accent)\" stroke-width=\"4\"/>\n          \u003ccircle cx=\"160\" cy=\"122\" r=\"6\" fill=\"var(--accent)\"/>\n          \u003cline x1=\"160\" y1=\"128\" x2=\"160\" y2=\"196\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003crect x=\"138\" y=\"196\" width=\"44\" height=\"30\" rx=\"6\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n          \u003ctext x=\"160\" y=\"244\" text-anchor=\"middle\" font-size=\"14\" fill=\"var(--ink-2)\">G＝400N\u003c/text>\n          \u003cline x1=\"204\" y1=\"108\" x2=\"204\" y2=\"58\" stroke=\"var(--accent)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n          \u003cpolygon points=\"204,44 194,62 214,62\" fill=\"var(--accent)\"/>\n          \u003ctext x=\"218\" y=\"66\" font-size=\"15\" font-weight=\"800\" fill=\"var(--accent)\">F＝200N\u003c/text>\n          \u003cg id=\"fxR2\" opacity=\"0\">\n            \u003cline x1=\"116\" y1=\"122\" x2=\"204\" y2=\"122\" stroke=\"var(--accent)\" stroke-width=\"3\" stroke-dasharray=\"7 6\"/>\n            \u003ctext x=\"160\" y=\"106\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"var(--accent)\">动力臂＝2R　阻力臂＝R\u003c/text>\n          \u003c/g>\n        \u003c/svg>\n        \u003cp class=\"say\" id=\"say2\">脾气：省一半力，代价是绳子要多拉一倍的路。\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"bill\">\n      \u003cdiv class=\"brow\" id=\"b1\">\u003cspan class=\"chip\">定滑轮\u003c/span>\u003cspan>不省力（F＝G）· 改变方向 · s＝h —— 本质是等臂杠杆\u003c/span>\u003c/div>\n      \u003cdiv class=\"brow\" id=\"b2\">\u003cspan class=\"chip\">动滑轮\u003c/span>\u003cspan>省一半（F＝G/2）· 不转向 · s＝2h —— 动力臂是阻力臂的两倍\u003c/span>\u003c/div>\n      \u003cdiv class=\"brow\" id=\"b3\">\u003cspan class=\"chip\">下一页\u003c/span>\u003cspan>定滑轮管转向，动滑轮管省力——把它们捆在一起，就是滑轮组\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cp class=\"note in\" style=\"--i:5\" id=\"note\">先把左边这位老实人看明白。\u003c/p>\n    \u003cdiv class=\"foot in\" style=\"--i:6\">\n      \u003cbutton class=\"btn in\" style=\"--i:7\" id=\"mainBtn\">转动定滑轮的杠杆\u003c/button>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\nvar NOTE_TEXT = [\n  '定滑轮的轴是支点，两段绳都是半径——两臂相等。所以它不省力：F＝G＝400 N。它只做一件事：让你站着往下拉，比踮脚往上拽舒服。',\n  '动滑轮的轴挂在货上：阻力压在轴上，阻力臂是半径 R；你的绳子在轮沿，动力臂是直径 2R。臂长一比二——省一半，F＝G/2＝200 N。',\n  '代价在绳子上：货升 1 米，你要拉 2 米绳（s＝2h）。两页账并排一摆——该合体了。'\n];\nvar stage = 0;\nvar note = document.getElementById('note');\nvar mainBtn = document.getElementById('mainBtn');\nvar LABELS = ['再看讨巧的动滑轮', '摆出对比账单', '账单读完了，去滑轮组机房 →'];\nfunction setStage(n) {\n  if (n \u003c= stage) return;\n  stage = n;\n  if (n === 1) {\n    document.getElementById('pFixed').classList.add('on');\n    document.getElementById('fxR1').style.opacity = 1;\n    document.getElementById('b1').classList.add('on', 'ok');\n    note.textContent = NOTE_TEXT[0];\n    mainBtn.textContent = LABELS[0];\n    sfx('tap');\n  } else if (n === 2) {\n    document.getElementById('pMove').classList.add('on');\n    document.getElementById('fxR2').style.opacity = 1;\n    document.getElementById('b2').classList.add('on', 'ok');\n    note.textContent = NOTE_TEXT[1];\n    mainBtn.textContent = LABELS[1];\n    sfx('ok');\n  } else {\n    document.getElementById('b3').classList.add('on');\n    note.textContent = NOTE_TEXT[2];\n    note.className = 'note good';\n    sfx('win');\n    mainBtn.textContent = LABELS[2];\n  }\n}\nmainBtn.addEventListener('click', function () {\n  if (stage \u003c 3) { setStage(stage + 1); }\n  else { sfx('tap'); deck('next'); }\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },
    { title: "滑轮组机房", src: "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>阿基米德的机械房 · 08 · 数绳子的人\u003c/title>\n\u003cstyle>\n/* ========== 一、配色：蓝图里选定的那一组，整套课件每一页完全一样 ========== */\n:root {\n  --bg: #000000;                      /* 底色 */\n  --surface: #131313;                 /* 卡片、面板 */\n  --surface-2: #222222;               /* 凹槽、轨道、未选中的底 */\n  --ink: #FFFFFF;                     /* 主文字 */\n  --ink-2: #B9B9B9;                   /* 次要文字 */\n  --ink-3: #7C7C7C;                   /* 说明文字 */\n  --line: rgba(255, 255, 255, 0.14);  /* 描边、分隔线 */\n  --accent: #FFD23F;                  /* 唯一的强调色 */\n  --accent-ink: #1A1400;              /* 强调色上面的文字 */\n}\n/* ========== 二、骨架和部件：每一页完全一样，不要改 ========== */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { font-size: clamp(16px, calc(min(1vw, 1.78vh) * 1.12), 34px); }   /* 1rem 跟着屏幕等比缩放，1080p 下约 21px。尺寸都用 rem 写 */\nhtml, body { height: 100%; margin: 0; }\nbody { background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.7; overflow: hidden;\n  font-family: \"PingFang SC\", \"HarmonyOS Sans SC\", \"Microsoft YaHei\", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\nh1, h2, h3, p, ul, ol, figure { margin: 0; }\nh1 { font-size: 3rem; line-height: 1.15; font-weight: 800; text-wrap: balance; }\nh2 { font-size: 2rem; line-height: 1.2; font-weight: 800; text-wrap: balance; }\nh3 { font-size: 1.3rem; line-height: 1.3; font-weight: 700; }\nbutton { font: inherit; color: inherit; }\nsvg { display: block; max-width: 100%; }\n/* 舞台：占满整屏。内容区 main 吃掉标题以下的全部空间 */\n.stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 1.2rem;\n  padding: clamp(20px, 4.5vh, 64px) clamp(20px, 5vw, 110px) clamp(16px, 3vh, 44px); }\n.stage > main { flex: 1; min-height: 0; }\n.kicker { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); }\n.lead { font-size: 1.25rem; color: var(--ink-2); max-width: 30em; }\n.small { font-size: max(0.8rem, 14px); color: var(--ink-3); }\n.num { font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }\n.hl { color: var(--accent); }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; min-height: 52px; padding: 0.5em 1.6em;\n  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;\n  transition: transform 0.12s, filter 0.15s, opacity 0.15s; }\n.btn:hover { filter: brightness(1.06); }\n.btn:active { transform: scale(0.97); }\n.btn[disabled] { opacity: 0.4; cursor: not-allowed; }\n.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }\n.card { background: var(--surface); border-radius: 1rem; padding: 1.4rem; }\n.chip { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.15em 0.8em; border-radius: 999px;\n  background: var(--surface-2); color: var(--ink-2); font-size: max(0.8rem, 14px); font-weight: 600; white-space: nowrap; }\n/* 反馈区：固定放在页面里的一行，不用弹窗。对 = 强调色加对勾；错 = 文字说明加抖动，不用红色 */\n.note { min-height: 3.4em; color: var(--ink-2); }\n.note.good { color: var(--accent); }\n.note.bad { color: var(--ink); }\n.shake { animation: shake 0.32s linear; }\n.pop { animation: pop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }\n@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }\n@keyframes pop { 50% { transform: scale(1.14); } }\n/* 入场：给元素加 class=\"in\"，再用 style=\"--i:1\" 排先后 */\n.in { animation: in 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }\n@keyframes in { from { opacity: 0; transform: translateY(1.2rem); } }\n/* 小屏：改成可以上下滚动的单列 */\n@media (max-width: 720px) {\n  body { overflow: auto; }\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n[hidden] { display: none !important; }\n.duo { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 1.8rem; min-height: 0; }\n.figbox { min-height: 0; display: flex; align-items: center; justify-content: center; }\n.figbox svg { max-height: 100%; width: auto; max-width: 100%; }\n.seg { stroke: var(--accent); stroke-width: 7; stroke-linecap: round; opacity: 0.16; transition: opacity 0.25s; }\n.seg.lit { opacity: 1; }\n.panel { display: flex; flex-direction: column; gap: 0.8rem; min-height: 0; }\n.ncard { display: flex; align-items: center; justify-content: center; gap: 1rem; padding: 0.9rem 1.2rem; }\n.ncard .big { font-size: 2.6rem; font-weight: 800; color: var(--accent); }\n.ncard .lbl { color: var(--ink-2); font-size: 0.95rem; }\n.optrow { display: flex; gap: 0.7rem; flex-wrap: wrap; }\n.optrow .btn { flex: 1; min-width: 0; }\n.optrow .btn.right { background: var(--accent); color: var(--accent-ink); box-shadow: none; }\n.foot { display: flex; gap: 0.8rem; justify-content: flex-end; align-items: center; margin-top: auto; flex-wrap: wrap; }\n.lift { transition: transform 1.1s cubic-bezier(0.3, 1, 0.4, 1); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">探索 · 滑轮组机房\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">数绳子的人\u003c/h1>\n  \u003c/header>\n  \u003cmain class=\"duo\">\n    \u003cfigure class=\"figbox in\" style=\"--i:2\">\n      \u003csvg id=\"room\" viewBox=\"0 0 860 520\" role=\"img\" aria-label=\"滑轮组：数承重绳段并验证拉力\">\n        \u003crect x=\"150\" y=\"40\" width=\"560\" height=\"14\" rx=\"7\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n        \u003ctext x=\"150\" y=\"30\" font-size=\"15\" fill=\"var(--ink-3)\">横梁（定滑轮挂在这里）\u003c/text>\n        \u003cg id=\"d1\">\n          \u003ccircle cx=\"430\" cy=\"120\" r=\"42\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"3.5\"/>\n          \u003cline class=\"seg\" x1=\"430\" y1=\"380\" x2=\"430\" y2=\"162\" />\n          \u003cpath d=\"M430 380 L430 120 L474 120 L474 268\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3.5\"/>\n          \u003crect class=\"lift\" x=\"398\" y=\"380\" width=\"64\" height=\"66\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003ctext class=\"lift\" x=\"430\" y=\"420\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink-2)\">G物＝400N\u003c/text>\n          \u003ctext x=\"500\" y=\"290\" font-size=\"15\" font-weight=\"700\" fill=\"var(--accent)\">F\u003c/text>\n          \u003ctext x=\"392\" y=\"470\" font-size=\"14\" fill=\"var(--ink-3)\">方案一 · 一个定滑轮\u003c/text>\n        \u003c/g>\n        \u003cg id=\"d2\" visibility=\"hidden\">\n          \u003ccircle cx=\"600\" cy=\"120\" r=\"34\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"3.5\"/>\n          \u003ccircle cx=\"430\" cy=\"266\" r=\"38\" fill=\"var(--accent)\" fill-opacity=\"0.22\" stroke=\"var(--accent)\" stroke-width=\"3.5\"/>\n          \u003cline class=\"seg\" x1=\"394\" y1=\"54\" x2=\"394\" y2=\"234\"/>\n          \u003cline class=\"seg\" x1=\"466\" y1=\"234\" x2=\"466\" y2=\"120\"/>\n          \u003cpath d=\"M394 54 L394 234 L600 234 L600 120 L600 120\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3.5\" opacity=\"0.55\"/>\n          \u003cpath d=\"M634 120 L634 268\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3.5\"/>\n          \u003ccircle cx=\"600\" cy=\"120\" r=\"5\" fill=\"var(--accent)\"/>\n          \u003crect class=\"lift\" x=\"398\" y=\"304\" width=\"64\" height=\"66\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003ctext class=\"lift\" x=\"430\" y=\"344\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink-2)\">G物＝400N\u003c/text>\n          \u003ctext x=\"640\" y=\"286\" font-size=\"15\" font-weight=\"700\" fill=\"var(--accent)\">F\u003c/text>\n          \u003ctext x=\"392\" y=\"470\" font-size=\"14\" fill=\"var(--ink-3)\">方案二 · 1 定 1 动\u003c/text>\n        \u003c/g>\n        \u003cg id=\"d3\" visibility=\"hidden\">\n          \u003ccircle cx=\"360\" cy=\"120\" r=\"34\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"3.5\"/>\n          \u003ccircle cx=\"560\" cy=\"120\" r=\"34\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"3.5\"/>\n          \u003ccircle cx=\"460\" cy=\"266\" r=\"38\" fill=\"var(--accent)\" fill-opacity=\"0.22\" stroke=\"var(--accent)\" stroke-width=\"3.5\"/>\n          \u003cline class=\"seg\" x1=\"460\" y1=\"228\" x2=\"460\" y2=\"158\"/>\n          \u003cline class=\"seg\" x1=\"424\" y1=\"238\" x2=\"424\" y2=\"120\"/>\n          \u003cline class=\"seg\" x1=\"496\" y1=\"238\" x2=\"496\" y2=\"120\"/>\n          \u003cpath d=\"M460 228 L460 158 L360 158 L360 120 M424 238 L424 120 M496 238 L496 120 L560 120 L560 168\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3.5\" opacity=\"0.55\"/>\n          \u003cpath d=\"M560 168 L560 268\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3.5\"/>\n          \u003ccircle cx=\"460\" cy=\"228\" r=\"5\" fill=\"var(--accent)\"/>\n          \u003crect class=\"lift\" x=\"428\" y=\"304\" width=\"64\" height=\"66\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003ctext class=\"lift\" x=\"460\" y=\"344\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink-2)\">G物＝400N\u003c/text>\n          \u003ctext x=\"566\" y=\"286\" font-size=\"15\" font-weight=\"700\" fill=\"var(--accent)\">F\u003c/text>\n          \u003ctext x=\"392\" y=\"470\" font-size=\"14\" fill=\"var(--ink-3)\">方案三 · 2 定 1 动\u003c/text>\n        \u003c/g>\n        \u003cg id=\"d4\" visibility=\"hidden\">\n          \u003ccircle cx=\"540\" cy=\"120\" r=\"34\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"3.5\"/>\n          \u003crect x=\"392\" y=\"240\" width=\"140\" height=\"64\" rx=\"14\" fill=\"var(--accent)\" fill-opacity=\"0.22\" stroke=\"var(--accent)\" stroke-width=\"3.5\"/>\n          \u003ctext x=\"462\" y=\"278\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--accent)\">动滑轮组\u003c/text>\n          \u003cline class=\"seg\" x1=\"398\" y1=\"54\" x2=\"398\" y2=\"240\"/>\n          \u003cline class=\"seg\" x1=\"446\" y1=\"240\" x2=\"446\" y2=\"120\"/>\n          \u003cline class=\"seg\" x1=\"478\" y1=\"120\" x2=\"478\" y2=\"240\"/>\n          \u003cline class=\"seg\" x1=\"526\" y1=\"240\" x2=\"526\" y2=\"120\"/>\n          \u003cpath d=\"M398 54 L398 240 M446 240 L446 120 L478 120 L478 240 M526 240 L526 120 L540 120 L540 168\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3.5\" opacity=\"0.55\"/>\n          \u003cpath d=\"M540 168 L540 268\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3.5\"/>\n          \u003crect class=\"lift\" x=\"428\" y=\"310\" width=\"68\" height=\"66\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003ctext class=\"lift\" x=\"462\" y=\"350\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink-2)\">G物＝400N\u003c/text>\n          \u003ctext x=\"546\" y=\"286\" font-size=\"15\" font-weight=\"700\" fill=\"var(--accent)\">F\u003c/text>\n          \u003ctext x=\"392\" y=\"470\" font-size=\"14\" fill=\"var(--ink-3)\">方案四 · 2 定 2 动（动滑轮组）\u003c/text>\n        \u003c/g>\n      \u003c/svg>\n    \u003c/figure>\n    \u003cdiv class=\"panel in\" style=\"--i:3\">\n      \u003cdiv class=\"ncard card\">\n        \u003cspan class=\"lbl\">承重绳段数\u003c/span>\n        \u003cspan class=\"big num\" id=\"nBig\">—\u003c/span>\n        \u003cspan class=\"lbl\">F ＝ (G物＋G动) ÷ n\u003cspan class=\"small\">（定滑轮方案 F＝G）\u003c/span>\u003c/span>\n      \u003c/div>\n      \u003cp class=\"note\" id=\"note\">方案一：一个定滑轮吊 400N 的货。先点「数一段」，看承重绳有几段。\u003c/p>\n      \u003cdiv class=\"optrow\" id=\"optrow\" hidden>\u003c/div>\n      \u003cdiv class=\"foot\">\n        \u003cbutton class=\"btn ghost\" id=\"countBtn\">数一段\u003c/button>\n        \u003cbutton class=\"btn ghost\" id=\"hintBtn\">提示\u003c/button>\n        \u003cbutton class=\"btn\" id=\"nextBtn\" hidden>下一方案 →\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 四种绕线：n = 承重绳段数。G物＝400N，G动＝40N（方案一没有动滑轮） */\nvar PLANS = [\n  { id: 'd1', n: 1, chip: '方案一 · 定滑轮', s0: '400N',\n    opts: ['200N', '400N', '440N'], ok: 1,\n    why: ['200N 那是动滑轮的账——这方案里根本没有动滑轮。', null, '440N 是把动滑轮硬加进来——定滑轮不背这个重量。'],\n    okText: 'F＝G＝400N：只转向，不省力。数完这一段，去换讨巧的方案。' },\n  { id: 'd2', n: 2, chip: '方案二 · 1 定 1 动', s0: '220N',\n    opts: ['110N', '220N', '440N'], ok: 1,\n    why: ['110N 太小——那是 n＝4 才有的待遇，这里只有两段绳。', null, '440N 是干脆不省力——两段绳白绕了。'],\n    okText: 'F＝(400＋40)÷2＝220N。省一半力，代价：货升 1 米要拉 2 米绳。' },\n  { id: 'd3', n: 3, chip: '方案三 · 2 定 1 动', s0: '147N',\n    opts: ['147N', '220N', '110N'], ok: 0,\n    why: ['——', '220N 是两段绳的账，这里是三段。', '110N 是四段绳的账——别把没绕的绳也数进去。'],\n    okText: 'F＝(400＋40)÷3＝146.7≈147N。三段绳，三份分担。' },\n  { id: 'd4', n: 4, chip: '方案四 · 2 定 2 动', s0: '110N',\n    opts: ['220N', '147N', '110N'], ok: 2,\n    why: ['220N——那是两段。', '147N——那是三段。', null],\n    okText: 'F＝(400＋40)÷4＝110N。四段绳，每段只扛四分之一。' }\n];\nvar stageIdx = 0, segIdx = 0, answered = false, mistakes = 0, hintIdx = 0;\nvar note = document.getElementById('note');\nvar nBig = document.getElementById('nBig');\nvar countBtn = document.getElementById('countBtn');\nvar hintBtn = document.getElementById('hintBtn');\nvar nextBtn = document.getElementById('nextBtn');\nvar optrow = document.getElementById('optrow');\nfunction showPlan(i) {\n  stageIdx = i;\n  var st = PLANS[i];\n  ['d1', 'd2', 'd3', 'd4'].forEach(function (id, k) {\n    document.getElementById(id).setAttribute('visibility', k === i ? 'visible' : 'hidden');\n  });\n  document.querySelectorAll('.seg').forEach(function (s) { s.classList.remove('lit'); });\n  segIdx = 0; answered = false; hintIdx = 0;\n  document.getElementById(st.id).querySelectorAll('.seg').forEach(function (s) { s.classList.remove('lit'); });\n  nBig.textContent = '—';\n  countBtn.hidden = false; countBtn.textContent = '数一段';\n  optrow.hidden = true; optrow.innerHTML = '';\n  nextBtn.hidden = true;\n  note.className = 'note';\n  note.textContent = i === 0 ? '方案一：一个定滑轮吊 400N 的货。先点「数一段」，看承重绳有几段。' : '换方案了。老规矩：先数段，再预测，最后起吊验证。';\n}\ncountBtn.addEventListener('click', function () {\n  var st = PLANS[stageIdx];\n  var segs = document.getElementById(st.id).querySelectorAll('.seg');\n  if (segIdx \u003c segs.length) {\n    segs[segIdx].classList.add('lit');\n    segIdx++;\n    nBig.textContent = segIdx;\n    sfx('tap');\n    if (segIdx === segs.length) {\n      countBtn.hidden = true;\n      nBig.textContent = 'n＝' + st.n;\n      note.textContent = st.chip + '：承重绳 n＝' + st.n + '。先猜拉力 F 是多少？';\n      buildOpts();\n    }\n  }\n});\nfunction buildOpts() {\n  var st = PLANS[stageIdx];\n  optrow.hidden = false;\n  optrow.innerHTML = '';\n  st.opts.forEach(function (label, i) {\n    var b = document.createElement('button');\n    b.className = 'btn ghost';\n    b.textContent = label;\n    b.addEventListener('click', function () {\n      if (answered) return;\n      if (i === st.ok) {\n        answered = true;\n        sfx('ok');\n        b.classList.remove('ghost');\n        b.classList.add('right');\n        fx(b, 'pop');\n        note.textContent = st.okText + ' 起吊验证——';\n        note.className = 'note good';\n        setTimeout(lift, 600);\n      } else {\n        mistakesPlus();\n        sfx('no');\n        b.disabled = true;\n        fx(b, 'shake');\n        note.textContent = st.why[i] || '这个数对不上，用公式再核一遍。';\n        note.className = 'note bad';\n      }\n    });\n    optrow.appendChild(b);\n  });\n}\nvar mistakesPlus = function () { mistakes++; };\nfunction lift() {\n  var st = PLANS[stageIdx];\n  var boxes = document.getElementById(st.id).querySelectorAll('.lift');\n  boxes.forEach(function (b) { b.style.transform = 'translateY(-42px)'; });\n  sfx('win');\n  setTimeout(function () {\n    note.textContent = st.okText.replace(' 起吊验证——', '') + ' 起吊成功：读数 ' + st.s0 + '。';\n    nextBtn.hidden = false;\n    nextBtn.textContent = stageIdx \u003c PLANS.length - 1 ? '下一方案 →' : '去终局 · 拖动大船 →';\n  }, 1300);\n}\nnextBtn.addEventListener('click', function () {\n  sfx('tap');\n  if (stageIdx \u003c PLANS.length - 1) showPlan(stageIdx + 1);\n  else deck('next');\n});\nhintBtn.addEventListener('click', function () {\n  var tips = [\n    '方法：数「直接拴着动滑轮（或货）」的绳段，一段就是一份分担。',\n    '线索：只数向上拉着动滑轮的那几段；绕过定滑轮去手上的尾巴不算。',\n    '公式：F ＝ (G物＋G动) ÷ n ＝ (400＋40) ÷ n。'\n  ];\n  note.className = 'note';\n  note.textContent = tips[Math.min(hintIdx, tips.length - 1)];\n  hintIdx++;\n  sfx('tap');\n});\nshowPlan(0);\nvar mistakes = 0;\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },
    { title: "拖动大船", src: "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>阿基米德的机械房 · 09 · 把战船拖上岸\u003c/title>\n\u003cstyle>\n/* ========== 一、配色：蓝图里选定的那一组，整套课件每一页完全一样 ========== */\n:root {\n  --bg: #000000;                      /* 底色 */\n  --surface: #131313;                 /* 卡片、面板 */\n  --surface-2: #222222;               /* 凹槽、轨道、未选中的底 */\n  --ink: #FFFFFF;                     /* 主文字 */\n  --ink-2: #B9B9B9;                   /* 次要文字 */\n  --ink-3: #7C7C7C;                   /* 说明文字 */\n  --line: rgba(255, 255, 255, 0.14);  /* 描边、分隔线 */\n  --accent: #FFD23F;                  /* 唯一的强调色 */\n  --accent-ink: #1A1400;              /* 强调色上面的文字 */\n}\n/* ========== 二、骨架和部件：每一页完全一样，不要改 ========== */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { font-size: clamp(16px, calc(min(1vw, 1.78vh) * 1.12), 34px); }   /* 1rem 跟着屏幕等比缩放，1080p 下约 21px。尺寸都用 rem 写 */\nhtml, body { height: 100%; margin: 0; }\nbody { background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.7; overflow: hidden;\n  font-family: \"PingFang SC\", \"HarmonyOS Sans SC\", \"Microsoft YaHei\", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\nh1, h2, h3, p, ul, ol, figure { margin: 0; }\nh1 { font-size: 3rem; line-height: 1.15; font-weight: 800; text-wrap: balance; }\nh2 { font-size: 2rem; line-height: 1.2; font-weight: 800; text-wrap: balance; }\nh3 { font-size: 1.3rem; line-height: 1.3; font-weight: 700; }\nbutton { font: inherit; color: inherit; }\nsvg { display: block; max-width: 100%; }\n/* 舞台：占满整屏。内容区 main 吃掉标题以下的全部空间 */\n.stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 1.2rem;\n  padding: clamp(20px, 4.5vh, 64px) clamp(20px, 5vw, 110px) clamp(16px, 3vh, 44px); }\n.stage > main { flex: 1; min-height: 0; }\n.kicker { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); }\n.lead { font-size: 1.25rem; color: var(--ink-2); max-width: 30em; }\n.small { font-size: max(0.8rem, 14px); color: var(--ink-3); }\n.num { font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }\n.hl { color: var(--accent); }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; min-height: 52px; padding: 0.5em 1.6em;\n  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;\n  transition: transform 0.12s, filter 0.15s, opacity 0.15s; }\n.btn:hover { filter: brightness(1.06); }\n.btn:active { transform: scale(0.97); }\n.btn[disabled] { opacity: 0.4; cursor: not-allowed; }\n.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }\n.card { background: var(--surface); border-radius: 1rem; padding: 1.4rem; }\n.chip { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.15em 0.8em; border-radius: 999px;\n  background: var(--surface-2); color: var(--ink-2); font-size: max(0.8rem, 14px); font-weight: 600; white-space: nowrap; }\n/* 反馈区：固定放在页面里的一行，不用弹窗。对 = 强调色加对勾；错 = 文字说明加抖动，不用红色 */\n.note { min-height: 3.4em; color: var(--ink-2); }\n.note.good { color: var(--accent); }\n.note.bad { color: var(--ink); }\n.shake { animation: shake 0.32s linear; }\n.pop { animation: pop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }\n@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }\n@keyframes pop { 50% { transform: scale(1.14); } }\n/* 入场：给元素加 class=\"in\"，再用 style=\"--i:1\" 排先后 */\n.in { animation: in 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }\n@keyframes in { from { opacity: 0; transform: translateY(1.2rem); } }\n/* 小屏：改成可以上下滚动的单列 */\n@media (max-width: 720px) {\n  body { overflow: auto; }\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n[hidden] { display: none !important; }\n.lab { display: flex; flex-direction: column; gap: 0.8rem; min-height: 0; flex: 1; }\n.optrow { display: flex; gap: 0.8rem; flex-wrap: wrap; }\n.optrow .btn { min-width: 8em; }\n.sea-fig { flex: 1; min-height: 0; display: flex; align-items: flex-end; justify-content: center; }\n.sea-fig svg { max-height: 100%; width: auto; max-width: 100%; }\n.ship { transition: transform 2.2s cubic-bezier(0.3, 0.9, 0.3, 1); }\n.cable-taut { transition: opacity 1.5s; }\n.foot { display: flex; gap: 0.8rem; justify-content: flex-end; align-items: center; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">挑战 · 终局\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">把战船拖上岸\u003c/h1>\n  \u003c/header>\n  \u003cmain class=\"lab\">\n    \u003cspan class=\"chip num in\" style=\"--i:2\" id=\"stageChip\">第一关 · 单级滑轮组\u003c/span>\n    \u003cp class=\"lead in\" style=\"--i:3\" id=\"qtext\">滑轮组吊 G物＝400N 的货（G动＝40N）。要把拉力控制在 150N 以内，\u003cb class=\"hl\">至少\u003c/b>要几段承重绳？\u003c/p>\n    \u003cdiv class=\"optrow in\" style=\"--i:4\" id=\"optrow\">\u003c/div>\n    \u003cp class=\"note in\" style=\"--i:5\" id=\"note\">用机房里练的手艺：先算 F＝(G物＋G动)÷n，再挑答案。\u003c/p>\n    \u003cfigure class=\"sea-fig in\" style=\"--i:6\">\n      \u003csvg viewBox=\"0 0 900 300\" role=\"img\" aria-label=\"海边：滑轮组塔与战船\">\n        \u003crect x=\"0\" y=\"236\" width=\"900\" height=\"64\" fill=\"var(--surface-2)\"/>\n        \u003cpath d=\"M0 236 q 60 -10 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"2.5\"/>\n        \u003cg id=\"ship\" class=\"ship\">\n          \u003cpath d=\"M120 196 L330 196 L300 232 L150 232 Z\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003cline x1=\"225\" y1=\"196\" x2=\"225\" y2=\"128\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003cpath d=\"M225 132 L286 150 L225 168 Z\" fill=\"var(--accent)\"/>\n          \u003ctext x=\"120\" y=\"186\" font-size=\"14\" fill=\"var(--ink-3)\">战船 · G＝4×10⁵N\u003c/text>\n        \u003c/g>\n        \u003cg id=\"tower\">\n          \u003crect x=\"700\" y=\"96\" width=\"26\" height=\"140\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003ccircle cx=\"713\" cy=\"112\" r=\"16\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003ccircle cx=\"713\" cy=\"168\" r=\"16\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n          \u003cpath id=\"cable\" d=\"M330 190 Q 520 240 688 186\" fill=\"none\" stroke=\"var(--ink-2)\" stroke-width=\"3\" stroke-dasharray=\"9 8\"/>\n          \u003cg id=\"man\">\n            \u003ccircle cx=\"640\" cy=\"212\" r=\"9\" fill=\"var(--ink)\"/>\n            \u003cline x1=\"640\" y1=\"221\" x2=\"640\" y2=\"248\" stroke=\"var(--ink)\" stroke-width=\"3.5\"/>\n            \u003cline x1=\"640\" y1=\"230\" x2=\"662\" y2=\"226\" stroke=\"var(--ink)\" stroke-width=\"3.5\"/>\n            \u003cline x1=\"640\" y1=\"248\" x2=\"630\" y2=\"268\" stroke=\"var(--ink)\" stroke-width=\"3.5\"/>\n            \u003cline x1=\"640\" y1=\"248\" x2=\"650\" y2=\"268\" stroke=\"var(--ink)\" stroke-width=\"3.5\"/>\n            \u003ctext x=\"600\" y=\"292\" font-size=\"14\" fill=\"var(--ink-3)\">学徒 · 最多 400N\u003c/text>\n          \u003c/g>\n        \u003c/g>\n        \u003ctext id=\"verdict\" x=\"450\" y=\"60\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"800\" fill=\"var(--accent)\" opacity=\"0\">船动了！\u003c/text>\n      \u003c/svg>\n    \u003c/figure>\n    \u003cdiv class=\"foot in\" style=\"--i:7\">\n      \u003cbutton class=\"btn ghost\" id=\"hintBtn\">提示\u003c/button>\n      \u003cbutton class=\"btn\" id=\"haulBtn\" hidden>起拖！\u003c/button>\n      \u003cbutton class=\"btn ghost\" id=\"againBtn\" hidden>再来一次\u003c/button>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 三关递进：单级选段数 → 两级相乘 → 三级拖真船 */\nvar STAGES = [\n  {\n    chip: '第一关 · 单级滑轮组',\n    q: '滑轮组吊 G物＝400N 的货（G动＝40N）。要把拉力控制在 150N 以内，\u003cb class=\"hl\">至少\u003c/b>要几段承重绳？',\n    opts: ['2 段', '3 段', '4 段'], ok: 1,\n    why: ['2 段：F＝(400＋40)÷2＝220N，超出 150N。', null, '4 段当然也够（110N）——但题目问的是「至少」。'],\n    okText: '3 段：F＝440÷3＝147N≤150N ✓。单级滑轮组毕业了。'\n  },\n  {\n    chip: '第二关 · 两级相乘',\n    q: '闸门 G＝5000N。手头只有每级\u003cb class=\"hl\">省 5 倍\u003c/b>的滑轮组，串联\u003cb class=\"hl\">两级\u003c/b>。末端拉力是多少？',\n    opts: ['40N', '200N', '1000N'], ok: 1,\n    why: ['40N 是除以 125 的账——那是三级。', null, '1000N 只除了 5 倍——第二级还没干活呢。'],\n    okText: '倍数相乘：5×5＝25，F＝5000÷25＝200N。两个「不怎么样」连起来，就很了不起。'\n  },\n  {\n    chip: '第三关 · 终局拖船',\n    q: '战船 G＝4×10⁵ N（约 40 吨），学徒最多拉 \u003cb class=\"hl\">400N\u003c/b>。三级滑轮组、每级省 \u003cb class=\"hl\">10 倍\u003c/b>——总倍数是多少？',\n    opts: ['100 倍', '1000 倍', '10000 倍'], ok: 1,\n    why: ['100 倍：F＝4000N，还是拖不动。', null, '10000 倍：那 F 只有 40N——账本要老实。'],\n    okText: '10×10×10＝1000 倍，F＝4×10⁵ ÷ 1000＝400N——恰好是你手臂的极限！'\n  }\n];\nvar stageIdx = 0, mistakes = 0, hintIdx = 0;\nvar note = document.getElementById('note');\nvar qtext = document.getElementById('qtext');\nvar stageChip = document.getElementById('stageChip');\nvar optrow = document.getElementById('optrow');\nvar haulBtn = document.getElementById('haulBtn');\nvar againBtn = document.getElementById('againBtn');\nvar hintBtn = document.getElementById('hintBtn');\nfunction shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }\nfunction buildOpts() {\n  var st = STAGES[stageIdx];\n  optrow.innerHTML = '';\n  var order = shuffle(st.opts.map(function (o, i) { return i; }));\n  order.forEach(function (oi) {\n    var b = document.createElement('button');\n    b.className = 'btn ghost';\n    b.textContent = st.opts[oi];\n    b.addEventListener('click', function () {\n      if (oi === st.ok) {\n        sfx('ok');\n        b.classList.remove('ghost');\n        b.classList.add('right');\n        fx(b, 'pop');\n        note.textContent = st.okText;\n        note.className = 'note good';\n        afterOk();\n      } else {\n        mistakes++;\n        sfx('no');\n        b.disabled = true;\n        fx(b, 'shake');\n        note.textContent = st.why[oi];\n        note.className = 'note bad';\n      }\n    });\n    optrow.appendChild(b);\n  });\n}\nfunction afterOk() {\n  if (stageIdx === 2) {\n    haulBtn.hidden = false;\n    haulBtn.textContent = '起拖！';\n  } else {\n    stageIdx++;\n    var st = STAGES[stageIdx];\n    stageChip.textContent = st.chip;\n    qtext.innerHTML = st.q;\n    buildOpts();\n  }\n}\nhaulBtn.addEventListener('click', function () {\n  sfx('win');\n  document.getElementById('cable').style.opacity = '1';\n  document.getElementById('cable').classList.remove('cable-taut');\n  document.getElementById('ship').style.transform = 'translate(-36px, -30px)';\n  var v = document.getElementById('verdict');\n  v.style.opacity = 1;\n  fx(v, 'pop');\n  var n = mistakes === 0 ? 3 : (mistakes \u003c= 2 ? 2 : 1);\n  stars.save('09', n);\n  note.innerHTML = '判词：传说成立。不是神力，是\u003cb class=\"hl\">一千倍的心思\u003c/b>——每一级都在替你省力。你为本案拿下 \u003cb class=\"num\">' + n + '\u003c/b> 颗星。';\n  note.className = 'note good';\n  haulBtn.hidden = true;\n  againBtn.hidden = false;\n});\nagainBtn.addEventListener('click', function () {\n  sfx('tap');\n  mistakes = 0; stageIdx = 0; hintIdx = 0;\n  document.getElementById('ship').style.transform = '';\n  var v = document.getElementById('verdict');\n  v.style.opacity = 0;\n  againBtn.hidden = true;\n  haulBtn.hidden = true;\n  var st = STAGES[0];\n  stageChip.textContent = st.chip;\n  qtext.innerHTML = st.q;\n  buildOpts();\n  note.className = 'note';\n  note.textContent = '用机房里练的手艺：先算 F＝(G物＋G动)÷n，再挑答案。';\n});\nhintBtn.addEventListener('click', function () {\n  var tips = [\n    '方法：先算 F＝(G物＋G动)÷n，跟 150N 比一比。',\n    '线索：多级滑轮组的倍数是「相乘」不是「相加」。',\n    '答案：三关的答案依次是 3 段、200N、1000 倍。'\n  ];\n  note.className = 'note';\n  note.textContent = tips[Math.min(hintIdx, tips.length - 1)];\n  hintIdx++;\n  sfx('tap');\n});\nbuildOpts();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },

"37\" y1=\"103\" x2=\"27\" y2=\"113\"/>\n            \u003c/g>\n            \u003ccircle cx=\"70\" cy=\"70\" r=\"10\" fill=\"var(--accent)\"/>\n          \u003c/g>\n          \u003ccircle class=\"gem\" id=\"g3\" cx=\"70\" cy=\"40\" r=\"9\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"2\"/>\n          \u003ccircle class=\"gem\" id=\"g4\" cx=\"43\" cy=\"90\" r=\"9\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"2\"/>\n          \u003ccircle class=\"gem\" id=\"g5\" cx=\"97\" cy=\"90\" r=\"9\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"2\"/>\n          \u003ctext x=\"70\" y=\"140\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--ink-2)\">滑轮组 · 机房\u003c/text>\n        \u003c/svg>\n      \u003c/figure>\n    \u003c/div>\n    \u003cp class=\"score num in\" style=\"--i:3\">本课星星 \u003cb id=\"totalNum\">0\u003c/b> ／ 6\u003c/p>\n    \u003cdiv class=\"recap in\" style=\"--i:4\">\n      \u003cspan class=\"chip\">杠杆五要素 · F₁L₁＝F₂L₂\u003c/span>\n      \u003cspan class=\"chip\">三类杠杆 · 省力必费距离\u003c/span>\n      \u003cspan class=\"chip\">定滑轮转向 · 动滑轮省力\u003c/span>\n      \u003cspan class=\"chip\">滑轮组 · F＝(G物＋G动)÷n\u003c/span>\n      \u003cspan class=\"chip\">多级 · 倍数相乘\u003c/span>\n    \u003c/div>\n    \u003cp class=\"note in endnote\" style=\"--i:5\" id=\"note\">齿轮上的宝石，正被你的星星一颗颗点亮……\u003c/p>\n    \u003cdiv class=\"bonus card in\" id=\"bonus\">\n      \u003csvg viewBox=\"0 0 120 120\" role=\"img\" aria-label=\"机械效率预告：秤与功\">\n        \u003cpath d=\"M14 76 L106 76\" stroke=\"var(--ink)\" stroke-width=\"4\"/>\n        \u003cpath d=\"M20 40 L100 40 L86 76 L34 76 Z\" fill=\"var(--accent)\" fill-opacity=\"0.2\" stroke=\"var(--accent)\" stroke-width=\"3\"/>\n        \u003crect x=\"88\" y=\"36\" width=\"26\" height=\"18\" rx=\"4\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n        \u003cpath d=\"M40 76 L40 92 M80 76 L80 92\" stroke=\"var(--ink)\" stroke-width=\"4\"/>\n        \u003ctext x=\"60\" y=\"112\" text-anchor=\"middle\" font-size=\"14\" fill=\"var(--ink-3)\">省力 · 费距离 · 不省功\u003c/text>\n      \u003c/svg>\n      \u003cdiv>\n        \u003ch3>下一间房 · 机械效率\u003c/h3>\n        \u003cp class=\"small\">省了力，但真的「赚」了吗？动滑轮省一半力，绳却要多拉一倍——把两头乘起来，功一分没省。下一课：机械效率，给每台机器打分。\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"in\" style=\"--i:6\">\n      \u003cbutton class=\"btn ghost\" id=\"replay\">从头再看一遍\u003c/button>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 结算：第 6 页分拣 3 颗 + 第 9 页拖船 3 颗，最多 6 颗 */\nvar TOTAL_MAX = 6;\nvar s06 = Math.min(stars.all()['06'] || 0, 3);\nvar s09 = Math.min(stars.all()['09'] || 0, 3);\nvar total = Math.min(s06 + s09, TOTAL_MAX);\ndocument.getElementById('totalNum').textContent = total;\nvar note = document.getElementById('note');\nvar gems = [];\nfor (var i = 0; i \u003c TOTAL_MAX; i++) gems.push(document.getElementById('g' + i));\nvar lit = 0;\nfunction lightNext() {\n  if (lit >= total) { finish(); return; }\n  var g = gems[lit];\n  g.setAttribute('fill', 'var(--accent)');\n  g.setAttribute('stroke', 'none');\n  fx(g, 'pop');\n  sfx('ok');\n  lit++;\n  setTimeout(lightNext, 340);\n}\nfunction finish() {\n  if (total >= TOTAL_MAX) {\n    sfx('win');\n    document.getElementById('bonus').classList.add('show');\n    note.innerHTML = '满星结案！阿基米德交了账：\u003cb class=\"hl\">省力必费距离\u003c/b>。档案馆预告下一间房——机械效率。';\n    note.className = 'note good';\n  } else {\n    var left = TOTAL_MAX - total;\n    note.innerHTML = '还有 \u003cb class=\"num hl\">' + left + '\u003c/b> 颗星，藏在「杠杆分拣场」和「拖动大船」两页——翻回去再拿几颗。';\n  }\n}\nsetTimeout(lightNext, 700);\ndocument.getElementById('replay').addEventListener('click', function () {\n  sfx('tap');\n  deck('go', 0);\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" }

  if (/^\s*</.test(page.src)) f.srcdoc = page.src; else f.src = page.src;
  clearTimeout(loadTimer); loadTimer = setTimeout(() => $('loading').classList.add('show'), 180);
  f.onload = () => {
    clearTimeout(loadTimer); $('loading').classList.remove('show');
    f.classList.add('on'); if (old) setTimeout(() => old.remove(), 300);
    tellMute();
    try { f.contentWindow.focus(); } catch (e) {}
  };
  $('screen').appendChild(f); frame = f; cur = i;
  segs.forEach((s, k) => { s.classList.toggle('on', k === i); s.classList.toggle('done', k < i); });
  [...$('tocList').children].forEach((li, k) => li.classList.toggle('on', k === i));
  $('count').innerHTML = '<b>' + pad(i + 1) + '</b> / ' + pad(N);
  $('prev').disabled = i === 0; $('next').disabled = i === N - 1;
  try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
}
const next = () => show(cur + 1), prev = () => show(cur - 1);
function toc(open) {
  open = open === undefined ? !$('toc').classList.contains('open') : open;
  $('toc').classList.toggle('open', open); $('veil').classList.toggle('open', open);
}
function fullscreen() {
  const d = document;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else (root.requestFullscreen || root.webkitRequestFullscreen || (() => {})).call(root);
}
$('prev').onclick = prev; $('next').onclick = next;
$('count').onclick = () => toc(); $('menu').onclick = () => toc(); $('veil').onclick = () => toc(false);
$('full').onclick = fullscreen;
$('mute').onclick = () => { muted = !muted; try { localStorage.setItem('deck:muted', muted ? '1' : '0'); } catch (e) {} tellMute(); };
/* 键盘：焦点在外壳上时直接处理；焦点在页面里时，由页面里的"翻页桥"转发过来 */
function key(k) {
  if (k === 'Escape') return toc(false);
  if (k === 'g' || k === 'G') return toc();
  if (k === 'f' || k === 'F') return fullscreen();
  if (k === 'm' || k === 'M') return $('mute').onclick();
  if (k === 'ArrowRight' || k === 'PageDown') next();
  else if (k === 'ArrowLeft' || k === 'PageUp') prev();
  else if (k === 'Home') show(0);
  else if (k === 'End') show(N - 1);
}
addEventListener('keydown', e => { if (!e.ctrlKey && !e.metaKey && !e.altKey) key(e.key); });
addEventListener('message', e => {
  const d = e.data || {};
  if (d.deck === 'next') next(); else if (d.deck === 'prev') prev();
  else if (d.deck === 'go') show(d.index); else if (d.deck === 'key') key(d.key);
});
addEventListener('hashchange', () => show((parseInt(location.hash.slice(1), 10) || 1) - 1));
show((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
