<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>勾股定理双证记 · 05 · 梯形的两种算法</title>
<style>
/* ========== 一、配色：蓝图里选定的那一组，整套课件每一页完全一样 ========== */
:root {
  --bg: #F2F4F6;                      /* 底色 */
  --surface: #FFFFFF;                 /* 卡片、面板 */
  --surface-2: #E4E8EC;               /* 凹槽、轨道、未选中的底 */
  --ink: #14171C;                     /* 主文字 */
  --ink-2: #4D5560;                   /* 次要文字 */
  --ink-3: #68717D;                   /* 说明文字 */
  --line: rgba(20, 23, 28, 0.12);     /* 描边、分隔线 */
  --accent: #2F5BEA;                  /* 唯一的强调色 */
  --accent-ink: #FFFFFF;              /* 强调色上面的文字 */
}
/* ========== 二、骨架和部件：每一页完全一样，不要改 ========== */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: clamp(16px, calc(min(1vw, 1.78vh) * 1.12), 34px); }   /* 1rem 跟着屏幕等比缩放，1080p 下约 21px。尺寸都用 rem 写 */
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.7; overflow: hidden;
  font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul, ol, figure { margin: 0; }
h1 { font-size: 3rem; line-height: 1.15; font-weight: 800; text-wrap: balance; }
h2 { font-size: 2rem; line-height: 1.2; font-weight: 800; text-wrap: balance; }
h3 { font-size: 1.3rem; line-height: 1.3; font-weight: 700; }
button { font: inherit; color: inherit; }
svg { display: block; max-width: 100%; }
/* 舞台：占满整屏。内容区 main 吃掉标题以下的全部空间 */
.stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 1.2rem;
  padding: clamp(20px, 4.5vh, 64px) clamp(20px, 5vw, 110px) clamp(16px, 3vh, 44px); }
.stage > main { flex: 1; min-height: 0; }
.kicker { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); }
.lead { font-size: 1.25rem; color: var(--ink-2); max-width: 30em; }
.small { font-size: max(0.8rem, 14px); color: var(--ink-3); }
.num { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
.hl { color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; min-height: 52px; padding: 0.5em 1.6em;
  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;
  transition: transform 0.12s, filter 0.15s, opacity 0.15s; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(0.97); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.card { background: var(--surface); border-radius: 1rem; padding: 1.4rem; }
.chip { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.15em 0.8em; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2); font-size: max(0.8rem, 14px); font-weight: 600; white-space: nowrap; }
/* 反馈区：固定放在页面里的一行，不用弹窗。对 = 强调色加对勾；错 = 文字说明加抖动，不用红色 */
.note { min-height: 3.4em; color: var(--ink-2); }
.note.good { color: var(--accent); }
.note.bad { color: var(--ink); }
.shake { animation: shake 0.32s linear; }
.pop { animation: pop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
@keyframes pop { 50% { transform: scale(1.14); } }
/* 入场：给元素加 class="in"，再用 style="--i:1" 排先后 */
.in { animation: in 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }
@keyframes in { from { opacity: 0; transform: translateY(1.2rem); } }
/* 小屏：改成可以上下滚动的单列 */
@media (max-width: 720px) {
  body { overflow: auto; }
  .stage { height: auto; min-height: 100dvh; }
  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
/* ========== 三、本页样式：只有这一段每页不同 ========== */
[hidden] { display: none !important; }
.duo { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 2.2rem; min-height: 0; }
.fig { min-height: 0; display: flex; align-items: center; justify-content: center; }
.fig svg { max-height: 100%; width: auto; max-width: 100%; }
.right { display: flex; flex-direction: column; gap: 0.9rem; min-height: 0; }
.steps { display: flex; flex-direction: column; gap: 0.55rem; }
.line { display: flex; gap: 0.7em; align-items: baseline; padding: 0.5em 0.6em; border-radius: 0.8rem;
  background: var(--surface); border: 1.5px solid var(--line); opacity: 0.28; transform: translateX(-6px);
  transition: opacity 0.35s, transform 0.35s, border-color 0.35s; }
.line.on { opacity: 1; transform: none; }
.line.final { border-color: var(--accent); }
.line.final .num { color: var(--accent); }
.abchip { transform-box: fill-box; transform-origin: center; transition: transform 0.7s ease, opacity 0.7s ease; }
.abchip.gone1 { transform: translate(-46px, -26px) rotate(-14deg); opacity: 0; }
.abchip.gone2 { transform: translate(46px, 26px) rotate(14deg); opacity: 0; }
.hist { margin-top: auto; }
.foot { display: flex; justify-content: flex-end; }
</style>
</head>
<body>
<div class="stage">
  <header>
    <p class="kicker in">手稿一 · 加菲尔德，1876</p>
    <h1 class="in" style="--i:1">梯形的两种算法</h1>
  </header>
  <main class="duo">
    <figure class="fig in" style="--i:2">
      <svg viewBox="0 0 470 400" role="img" aria-label="加菲尔德的直角梯形：三个三角形">
        <path d="M60 330 L285 330 L285 210 L60 240 Z" fill="none" stroke="var(--ink-3)" stroke-width="3" id="trap"/>
        <polygon id="tri1" points="60,330 180,330 60,240" fill="var(--accent)" fill-opacity="0" stroke="var(--ink)" stroke-width="2.5"/>
        <polygon id="tri2" points="180,330 285,330 285,210" fill="var(--ink)" fill-opacity="0" stroke="var(--ink)" stroke-width="2.5"/>
        <polygon id="tri3" points="60,240 180,330 285,210" fill="var(--accent)" fill-opacity="0" stroke="var(--accent)" stroke-width="3"/>
        <text x="48" y="290" text-anchor="end" font-size="18" font-weight="800" fill="var(--accent)">a</text>
        <text x="297" y="275" font-size="18" font-weight="800" fill="var(--accent)">b</text>
        <text x="172" y="356" text-anchor="middle" font-size="18" font-weight="800" fill="var(--ink)">a＋b</text>
        <text x="132" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink-2)">c</text>
        <text x="246" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink-2)">c</text>
        <text id="lb1" x="105" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink-2)" opacity="0">½ab</text>
        <text id="lb2" x="248" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink-2)" opacity="0">½ab</text>
        <text id="lb3" x="175" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="var(--accent)" opacity="0">½c²</text>
        <text x="66" y="222" font-size="15" fill="var(--ink-3)">直角梯形：a ∥ b，高 a＋b</text>
      </svg>
    </figure>
    <div class="right">
      <div class="steps num">
        <div class="line" id="L1"><span class="chip">梯形公式</span><span>S ＝ ½(a＋b)(a＋b)</span></div>
        <div class="line" id="L2"><span class="chip">三块求和</span><span>S ＝ ½ab ＋ ½ab ＋ ½c²</span></div>
        <div class="line" id="L3"><span class="chip">必须相等</span><span>½(a＋b)² ＝ ab ＋ ½c²</span></div>
        <div class="line" id="L4"><span class="chip">展开消去</span><span>½a² ＋ <s class="abchip" id="ab1">ab</s> ＋ ½b² ＝ <s class="abchip" id="ab2">ab</s> ＋ ½c²</span></div>
        <div class="line final" id="L5"><span class="chip">两边 ×2</span><span class="num">a² ＋ b² ＝ c²</span></div>
      </div>
      <p class="note in" style="--i:3" id="note">同一个梯形，两种算法——账本的两行必须相等。开始对账？</p>
      <div class="hist">
        <p class="small">这份证明 1876 年刊于《新英格兰教育杂志》。五年后的 1881 年，加菲尔德就任美国第 20 任总统——后人叫它「总统证明」。</p>
        <div class="foot" style="margin-top:0.6rem">
          <button class="btn in" style="--i:4" id="mainBtn">开始对账</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
/* ========== 公共脚本：每一页完全一样，不要改 ========== */
/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */
function deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }
addEventListener('keydown', function (e) {
  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');
});
/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */
var deckMuted = false, deckAudio = null;
try { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}
addEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });
function sfx(name) {
  if (deckMuted) return;
  try {
    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();
    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];
    notes.forEach(function (n) {
      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];
      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);
      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);
    });
  } catch (e) {}
}
/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */
var stars = {
  key: 'deck:stars:' + document.title.split('·')[0].trim(),
  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },
  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },
  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }
};
/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */
function fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }
</script>
<script>
/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */
/* 对账五步：每一行都要等前一行站稳了才出现 */
var NOTE_TEXT = [
  '第一行：把梯形整个看——上底 a，下底 b？不对，这里平行的两条边是 a 和 b，高是 a＋b。',
  '第二行：把梯形拆成三块——两个 ½ab，加中间那块 ½c²。',
  '两行说的是同一个面积，必须相等。',
  '左边展开：½a² ＋ ab ＋ ½b²。两边各有一个 ab——让它们同时飞走。',
  '剩下的，两边 ×2，定理就站在纸面上了。这份手稿，鉴定通过。'
];
var stage = 0;
var note = document.getElementById('note');
var mainBtn = document.getElementById('mainBtn');
var LINES = ['L1', 'L2', 'L3', 'L4', 'L5'].map(function (id) { return document.getElementById(id); });
function setStage(n) {
  if (n <= stage) return;
  stage = n;
  LINES[n - 1].classList.add('on');
  if (n === 1) {
    document.getElementById('trap').style.stroke = 'var(--accent)';
    document.getElementById('lb1').style.opacity = 1;
    document.getElementById('lb2').style.opacity = 1;
    document.getElementById('lb3').style.opacity = 1;
    note.textContent = NOTE_TEXT[0];
    mainBtn.textContent = '第二行：拆成三块';
  } else if (n === 2) {
    ['tri1', 'tri2', 'tri3'].forEach(function (id, i) {
      document.getElementById(id).style.fillOpacity = [0.16, 0.08, 0.3][i];
    });
    note.textContent = NOTE_TEXT[1];
    mainBtn.textContent = '两行相等';
  } else if (n === 3) {
    note.textContent = NOTE_TEXT[2];
    mainBtn.textContent = '展开，赶走 ab';
  } else if (n === 4) {
    sfx('ok');
    setTimeout(function () {
      document.getElementById('ab1').classList.add('gone1');
      document.getElementById('ab2').classList.add('gone2');
      fx(document.getElementById('L4'), 'pop');
    }, 250);
    note.textContent = NOTE_TEXT[3];
    mainBtn.textContent = '两边 ×2';
  } else if (n === 5) {
    LINES[4].querySelector('.num').style.color = 'var(--accent)';
    fx(LINES[4], 'pop');
    note.textContent = NOTE_TEXT[4];
    note.className = 'note good';
    sfx('win');
    mainBtn.textContent = '手稿一鉴定通过，去拆第二份 →';
  }
}
mainBtn.addEventListener('click', function () {
  if (stage < 5) { sfx('tap'); setStage(stage + 1); }
  else { sfx('tap'); deck('next'); }
});
</script>
</body>
</html>
