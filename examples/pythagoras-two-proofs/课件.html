 }\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n[hidden] { display: none !important; }\n.duo { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 2.2rem; min-height: 0; }\n.left { display: flex; flex-direction: column; gap: 1rem; min-height: 0; }\n.fig { min-height: 0; display: flex; align-items: center; justify-content: center; }\n.fig svg { max-height: 100%; width: auto; max-width: 100%; }\n.eq { display: flex; align-items: center; justify-content: center; gap: 0.6rem; font-size: 1.3rem; font-weight: 800; }\n.eq .chip { font-size: 1.05rem; }\n.kchip { transform-box: fill-box; transform-origin: center; transition: transform 0.7s ease, opacity 0.7s ease; }\n.kchip.rip { transform: translateY(34px) rotate(-16deg); opacity: 0; }\n.formula { font-size: 1.7rem; font-weight: 800; text-align: center; border: 1.5px solid var(--line);\n  border-radius: 1rem; padding: 0.8rem 1.2rem; transition: border-color 0.3s, color 0.3s; }\n.formula.lit { border-color: var(--accent); color: var(--accent); }\n.foot { display: flex; justify-content: flex-end; margin-top: auto; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">手稿二 · 爱因斯坦，12 岁\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">三块面积，一本账\u003c/h1>\n  \u003c/header>\n  \u003cmain class=\"duo\">\n    \u003cdiv class=\"left in\" style=\"--i:2\">\n      \u003cp class=\"lead\">三个三角形同形，就都遵守工具三：面积随「斜边平方」变大——而且是\u003cb class=\"hl\">同一个比例 k\u003c/b>：\u003c/p>\n      \u003cdiv class=\"card num\" style=\"text-align:center; font-weight:700;\">\n        S\u003csub>△CBD\u003c/sub> ＝ k·a²\u003cbr>S\u003csub>△ACD\u003c/sub> ＝ k·b²\u003cbr>S\u003csub>△ABC\u003c/sub> ＝ k·c²\n      \u003c/div>\n      \u003cp class=\"lead\">而大三角形，本来就是两小块拼成的：两行面积相加，就是一本总账。\u003c/p>\n      \u003cdiv class=\"hist card\">\n        \u003cp class=\"small\">12 岁的爱因斯坦拿到一本「神圣的几何小册子」，老师讲了定理、没讲证明。他自己找到了这一种——后来才知道书上早就有，但「用比例记账」的眼光，仍属于那个孩子。\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"left\" style=\"gap:1.1rem;\">\n      \u003cfigure class=\"fig in\" style=\"--i:3\">\n        \u003csvg viewBox=\"0 0 470 400\" role=\"img\" aria-label=\"大三角形与两小块面积\">\n          \u003cpolygon points=\"60,360 284,192 284,360\" fill=\"var(--accent)\" fill-opacity=\"0.18\"/>\n          \u003cpolygon points=\"284,192 284,360 410,360\" fill=\"var(--ink)\" fill-opacity=\"0.1\"/>\n          \u003cpath d=\"M60 360 L410 360 L284 192 Z\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n          \u003cline x1=\"284\" y1=\"192\" x2=\"284\" y2=\"360\" stroke=\"var(--accent)\" stroke-width=\"2.5\" stroke-dasharray=\"6 6\"/>\n          \u003ctext x=\"150\" y=\"290\" font-size=\"16\" font-weight=\"800\" fill=\"var(--accent)\">k·b²\u003c/text>\n          \u003ctext x=\"318\" y=\"290\" font-size=\"16\" font-weight=\"800\" fill=\"var(--ink-2)\">k·a²\u003c/text>\n          \u003ctext x=\"240\" y=\"290\" text-anchor=\"end\" font-size=\"16\" font-weight=\"800\" fill=\"var(--ink-3)\">k·c²\u003c/text>\n          \u003ctext x=\"60\" y=\"388\" font-size=\"15\" fill=\"var(--ink-3)\">A\u003c/text>\n          \u003ctext x=\"416\" y=\"388\" font-size=\"15\" fill=\"var(--ink-3)\">B\u003c/text>\n          \u003ctext x=\"278\" y=\"182\" text-anchor=\"middle\" font-size=\"15\" fill=\"var(--ink-3)\">C\u003c/text>\n        \u003c/svg>\n      \u003c/figure>\n      \u003cdiv class=\"eq num in\" style=\"--i:4\" id=\"eqRow\">\n        \u003cspan class=\"chip\" id=\"e1\">k·a²\u003c/span>\u003cspan>＋\u003c/span>\n        \u003cspan class=\"chip\" id=\"e2\">k·b²\u003c/span>\u003cspan>＝\u003c/span>\n        \u003cspan class=\"chip\" id=\"e3\">k·c²\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"formula num\" id=\"final\" hidden>a² ＋ b² ＝ c²\u003c/div>\n      \u003cp class=\"note\" id=\"note\">总账怎么记？两小块相加等于大块。开始记账？\u003c/p>\n      \u003cdiv class=\"foot\">\n        \u003cbutton class=\"btn in\" style=\"--i:5\" id=\"mainBtn\">开始记账\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\nvar NOTE_TEXT = [\n  '把两小块的账加起来：k·a² ＋ k·b²，它必须等于大块的 k·c²。',\n  '三笔账里都有同一个 k——每一笔都除以它，k 被约掉了。',\n  'k 一走，定理露出来了。这份 12 岁的手稿，鉴定通过。'\n];\nvar stage = 0;\nvar note = document.getElementById('note');\nvar mainBtn = document.getElementById('mainBtn');\nvar final = document.getElementById('final');\nmainBtn.addEventListener('click', function () {\n  if (stage === 0) {\n    sfx('ok');\n    fx(document.getElementById('eqRow'), 'pop');\n    document.getElementById('e3').style.borderColor = 'var(--accent)';\n    note.textContent = NOTE_TEXT[0];\n    mainBtn.textContent = '约去 k';\n    stage = 1;\n  } else if (stage === 1) {\n    sfx('ok');\n    ['e1', 'e2', 'e3'].forEach(function (id, i) {\n      setTimeout(function () { document.getElementById(id).classList.add('rip'); }, i * 220);\n    });\n    setTimeout(function () {\n      final.hidden = false;\n      final.classList.add('lit');\n      fx(final, 'pop');\n      note.textContent = NOTE_TEXT[2];\n      note.className = 'note good';\n      sfx('win');\n      mainBtn.textContent = '两份手稿鉴定完毕，去做终检 →';\n    }, 800);\n    note.textContent = NOTE_TEXT[1];\n    stage = 2;\n  } else {\n    sfx('tap');\n    deck('next');\n  }\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },
    { title: "鉴定挑战", src: "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>勾股定理双证记 · 08 · 鉴定报告\u003c/title>\n\u003cstyle>\n/* ========== 一、配色：蓝图里选定的那一组，整套课件每一页完全一样 ========== */\n:root {\n  --bg: #F2F4F6;                      /* 底色 */\n  --surface: #FFFFFF;                 /* 卡片、面板 */\n  --surface-2: #E4E8EC;               /* 凹槽、轨道、未选中的底 */\n  --ink: #14171C;                     /* 主文字 */\n  --ink-2: #4D5560;                   /* 次要文字 */\n  --ink-3: #68717D;                   /* 说明文字 */\n  --line: rgba(20, 23, 28, 0.12);     /* 描边、分隔线 */\n  --accent: #2F5BEA;                  /* 唯一的强调色 */\n  --accent-ink: #FFFFFF;              /* 强调色上面的文字 */\n}\n/* ========== 二、骨架和部件：每一页完全一样，不要改 ========== */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { font-size: clamp(16px, calc(min(1vw, 1.78vh) * 1.12), 34px); }   /* 1rem 跟着屏幕等比缩放，1080p 下约 21px。尺寸都用 rem 写 */\nhtml, body { height: 100%; margin: 0; }\nbody { background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.7; overflow: hidden;\n  font-family: \"PingFang SC\", \"HarmonyOS Sans SC\", \"Microsoft YaHei\", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\nh1, h2, h3, p, ul, ol, figure { margin: 0; }\nh1 { font-size: 3rem; line-height: 1.15; font-weight: 800; text-wrap: balance; }\nh2 { font-size: 2rem; line-height: 1.2; font-weight: 800; text-wrap: balance; }\nh3 { font-size: 1.3rem; line-height: 1.3; font-weight: 700; }\nbutton { font: inherit; color: inherit; }\nsvg { display: block; max-width: 100%; }\n/* 舞台：占满整屏。内容区 main 吃掉标题以下的全部空间 */\n.stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 1.2rem;\n  padding: clamp(20px, 4.5vh, 64px) clamp(20px, 5vw, 110px) clamp(16px, 3vh, 44px); }\n.stage > main { flex: 1; min-height: 0; }\n.kicker { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); }\n.lead { font-size: 1.25rem; color: var(--ink-2); max-width: 30em; }\n.small { font-size: max(0.8rem, 14px); color: var(--ink-3); }\n.num { font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }\n.hl { color: var(--accent); }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; min-height: 52px; padding: 0.5em 1.6em;\n  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;\n  transition: transform 0.12s, filter 0.15s, opacity 0.15s; }\n.btn:hover { filter: brightness(1.06); }\n.btn:active { transform: scale(0.97); }\n.btn[disabled] { opacity: 0.4; cursor: not-allowed; }\n.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }\n.card { background: var(--surface); border-radius: 1rem; padding: 1.4rem; }\n.chip { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.15em 0.8em; border-radius: 999px;\n  background: var(--surface-2); color: var(--ink-2); font-size: max(0.8rem, 14px); font-weight: 600; white-space: nowrap; }\n/* 反馈区：固定放在页面里的一行，不用弹窗。对 = 强调色加对勾；错 = 文字说明加抖动，不用红色 */\n.note { min-height: 3.4em; color: var(--ink-2); }\n.note.good { color: var(--accent); }\n.note.bad { color: var(--ink); }\n.shake { animation: shake 0.32s linear; }\n.pop { animation: pop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }\n@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }\n@keyframes pop { 50% { transform: scale(1.14); } }\n/* 入场：给元素加 class=\"in\"，再用 style=\"--i:1\" 排先后 */\n.in { animation: in 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }\n@keyframes in { from { opacity: 0; transform: translateY(1.2rem); } }\n/* 小屏：改成可以上下滚动的单列 */\n@media (max-width: 720px) {\n  body { overflow: auto; }\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n[hidden] { display: none !important; }\n.desk { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 1.8rem; min-height: 0; }\n.half { display: flex; flex-direction: column; gap: 0.8rem; min-height: 0; }\n.bins { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }\n.bin { min-height: 8.2em; border: 1.5px dashed var(--line); border-radius: 1rem; padding: 0.8rem 1rem;\n  display: flex; flex-direction: column; gap: 0.45rem; cursor: pointer; transition: border-color 0.2s; }\n.bin.hot { border-color: var(--accent); }\n.bin.filled { border-style: solid; cursor: default; }\n.bin h3 { font-size: 1.05rem; }\n.bin .who { font-size: max(0.8rem, 14px); color: var(--ink-3); }\n.clues { display: flex; flex-direction: column; gap: 0.6rem; }\n.clue { min-height: 3.2em; padding: 0.55em 1.1em; border-radius: 0.9rem; background: var(--surface);\n  border: 1.5px solid var(--line); font-weight: 700; text-align: left; cursor: grab;\n  touch-action: none; user-select: none; -webkit-user-select: none; }\n.clue.sel { border-color: var(--accent); color: var(--accent); }\n.clue.used { visibility: hidden; }\n.ledger { display: flex; flex-direction: column; gap: 0.6rem; min-height: 0; }\n.lrow { display: flex; gap: 0.7em; align-items: baseline; padding: 0.45em 0.7em; border-radius: 0.8rem;\n  background: var(--surface); border: 1.5px solid var(--line); opacity: 0.3; cursor: pointer;\n  transition: opacity 0.35s, transform 0.35s, border-color 0.35s; }\n.lrow.on { opacity: 1; transform: none; }\n.lrow.ok { border-color: var(--accent); }\n.lrow .num { flex: 1; }\n.seal-wrap { position: relative; }\n.seal { position: absolute; right: 1.2rem; top: -1.4rem; transform: rotate(-8deg); opacity: 0; pointer-events: none; }\n.seal.stamped { animation: stamp 0.55s cubic-bezier(0.34, 1.3, 0.64, 1) forwards; }\n@keyframes stamp { from { transform: scale(2.1) rotate(-20deg); opacity: 0; } 60% { transform: scale(0.94) rotate(-6deg); opacity: 1; } to { transform: scale(1) rotate(-8deg); opacity: 1; } }\n.foot { display: flex; gap: 0.8rem; justify-content: flex-end; align-items: center; margin-top: auto; flex-wrap: wrap; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">挑战 · 终检\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">鉴定报告\u003c/h1>\n  \u003c/header>\n  \u003cmain class=\"desk\">\n    \u003cdiv class=\"half in\" style=\"--i:2\">\n      \u003ch3>第一步 · 线索归档：点线索，再点它主人\u003c/h3>\n      \u003cdiv class=\"bins\">\n        \u003cdiv class=\"bin\" id=\"binG\">\n          \u003ch3>加菲尔德\u003c/h3>\n          \u003cspan class=\"who\">1876 · 众议员 → 总统\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"bin\" id=\"binE\">\n          \u003ch3>爱因斯坦\u003c/h3>\n          \u003cspan class=\"who\">1891 · 12 岁\u003c/span>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"clues\" id=\"clues\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"half in\" style=\"--i:3\">\n      \u003cdiv class=\"seal-wrap\">\n        \u003ch3>第二步 · 数值终检（3-4-5）\u003c/h3>\n        \u003csvg class=\"seal\" id=\"seal\" width=\"120\" height=\"120\" viewBox=\"0 0 120 120\" aria-hidden=\"true\">\n          \u003ccircle cx=\"60\" cy=\"60\" r=\"52\" fill=\"var(--accent)\"/>\n          \u003ccircle cx=\"60\" cy=\"60\" r=\"40\" fill=\"none\" stroke=\"var(--accent-ink)\" stroke-width=\"2.5\" stroke-dasharray=\"4 5\"/>\n          \u003ctext x=\"60\" y=\"54\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"var(--accent-ink)\">鉴定\u003c/text>\n          \u003ctext x=\"60\" y=\"80\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"var(--accent-ink)\">完毕\u003c/text>\n        \u003c/svg>\n      \u003c/div>\n      \u003cdiv class=\"ledger\">\n        \u003cdiv class=\"lrow num\" id=\"n1\">\u003cspan class=\"chip\">梯形账\u003c/span>\u003cspan class=\"num\">6 ＋ 6 ＋ ？ ＝ ½(3＋4)² ＝ 24.5 —— 中间那块 ½c² 是多少？\u003c/span>\u003c/div>\n        \u003cdiv class=\"opts\" id=\"n1opts\" style=\"display:flex; gap:0.6rem;\">\n          \u003cbutton class=\"btn ghost\" data-v=\"12\">12\u003c/button>\n          \u003cbutton class=\"btn ghost\" data-v=\"12.5\">12.5\u003c/button>\n          \u003cbutton class=\"btn ghost\" data-v=\"25\">25\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"lrow num\" id=\"n2\">\u003cspan class=\"chip\">同形账\u003c/span>\u003cspan class=\"num\">三块面积的「每平方」单价 k，分别是多少？\u003c/span>\u003c/div>\n        \u003cdiv class=\"lrow num\" id=\"n3\" hidden>\u003cspan class=\"chip\">结论\u003c/span>\u003cspan class=\"num hl\">两份手稿，同一个定理。归档！\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cp class=\"note\" id=\"note\">先归档线索；然后点「同形账」逐条验算；两检全过就盖章。\u003c/p>\n      \u003cdiv class=\"foot\">\n        \u003cbutton class=\"btn ghost\" id=\"hintBtn\">提示\u003c/button>\n        \u003cbutton class=\"btn\" id=\"stampBtn\" disabled>盖章归档\u003c/button>\n        \u003cbutton class=\"btn ghost\" id=\"againBtn\" hidden>再来一次\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 线索卡与归属（w: 0 = 加菲尔德，1 = 爱因斯坦） */\nvar CLUES = [\n  { text: '梯形面积公式撑起全篇', w: 0, why: '梯形公式是加菲尔德手稿的支柱——爱因斯坦那本账靠的是「同形放大」。' },\n  { text: '一把垂线，同形放大', w: 1, why: '加菲尔德靠两块全等三角形拼梯形——「同形」是爱因斯坦的钥匙。' },\n  { text: '1876 · 国会图书馆的草稿纸', w: 0, why: '1876 年是加菲尔德在国会图书馆的年份；爱因斯坦那页写在 1891 年的书桌前。' },\n  { text: '12 岁的书桌', w: 1, why: '12 岁的是爱因斯坦——加菲尔德那年可不小了。' }\n];\nvar HINTS = [\n  '方法：先点线索卡选中它，再点它主人的档案盒。',\n  '线索：两份手稿的支柱——一个靠「拼」，一个靠「同形」。年份各归各。',\n  '答案：梯形公式和 1876 归加菲尔德；同形放大和 12 岁归爱因斯坦。'\n];\nvar clueBox = document.getElementById('clues');\nvar note = document.getElementById('note');\nvar stampBtn = document.getElementById('stampBtn');\nvar againBtn = document.getElementById('againBtn');\nvar hintBtn = document.getElementById('hintBtn');\nvar placedClues = 0, n1ok = false, n2ok = false, mistakes = 0, hintIdx = 0, stamped = false;\nfunction shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }\nvar selected = null;\nfunction buildClues() {\n  clueBox.innerHTML = '';\n  selected = null;\n  shuffle(CLUES.map(function (c, i) { return i; })).forEach(function (ci) {\n    var b = document.createElement('button');\n    b.className = 'clue';\n    b.textContent = CLUES[ci].text;\n    b.dataset.ci = ci;\n    clueBox.appendChild(b);\n    b.addEventListener('click', function () {\n      if (b.classList.contains('used')) return;\n      if (selected === b) { b.classList.remove('sel'); selected = null; hot(null); return; }\n      if (selected) selected.classList.remove('sel');\n      selected = b;\n      b.classList.add('sel');\n      sfx('tap');\n      hot(-1);\n    });\n  });\n}\nfunction hot(w) {\n  document.getElementById('binG').classList.toggle('hot', selected !== null && w !== 1);\n  document.getElementById('binE').classList.toggle('hot', selected !== null && w !== 0);\n}\nvar binG = document.getElementById('binG');\nvar binE = document.getElementById('binE');\n[binG, binE].forEach(function (bin) {\n  bin.addEventListener('click', function () {\n    if (!selected) return;\n    var ci = Number(selected.dataset.ci);\n    var c = CLUES[ci];\n    var w = bin === binG ? 0 : 1;\n    if (c.w === w) {\n      var chip = document.createElement('span');\n      chip.className = 'chip';\n      chip.textContent = c.text;\n      bin.appendChild(chip);\n      selected.classList.add('used');\n      selected.classList.remove('sel');\n      selected = null;\n      hot(null);\n      placedClues++;\n      sfx('ok');\n      fx(bin, 'pop');\n      note.className = 'note';\n      if (placedClues \u003c 4) note.textContent = '归档 ' + placedClues + ' ／ 4。';\n      else { note.textContent = '线索归档完毕。转数值终检——'; checkReady(); }\n    } else {\n      mistakes++;\n      sfx('no');\n      fx(bin, 'shake');\n      note.textContent = c.why;\n      note.className = 'note bad';\n    }\n  });\n});\nvar N1_WRONG = {\n  '12': '那是 ½×24——c² 是 25，不是 24。',\n  '25': '25 是 c² 本身，别忘了还要乘 ½。'\n};\ndocument.querySelectorAll('#n1opts .btn').forEach(function (b) {\n  b.addEventListener('click', function () {\n    if (n1ok) return;\n    if (b.dataset.v === '12.5') {\n      n1ok = true;\n      sfx('ok');\n      b.classList.remove('ghost');\n      b.style.background = 'var(--accent)';\n      b.style.color = 'var(--accent-ink)';\n      fx(b, 'pop');\n      var row = document.getElementById('n1');\n      row.classList.add('on', 'ok');\n      row.querySelector('.num').textContent = '6 ＋ 6 ＋ 12.5 ＝ 24.5 ✓ 梯形账两行相符。';\n      checkReady();\n    } else {\n      mistakes++;\n      sfx('no');\n      fx(b, 'shake');\n      b.disabled = true;\n      note.textContent = N1_WRONG[b.dataset.v];\n      note.className = 'note bad';\n    }\n  });\n});\nvar N2_STEPS = [\n  '△CBD：2.16 ÷ 3² ＝ 2.16 ÷ 9 ＝ 0.24',\n  '△ACD：3.84 ÷ 4² ＝ 3.84 ÷ 16 ＝ 0.24',\n  '△ABC：6 ÷ 5² ＝ 6 ÷ 25 ＝ 0.24 ✓ 同一个 k，三处相等——「同形」坐实。'\n];\nvar n2step = 0;\nfunction n2next() {\n  if (n2ok) return;\n  var row = document.getElementById('n2');\n  if (n2step === 0) {\n    row.classList.add('on');\n  } else if (n2step === 3) {\n    n2ok = true;\n    row.classList.add('ok');\n    row.querySelector('.num').textContent = 'k ＝ 0.24，三处相等。';\n    sfx('ok');\n    checkReady();\n    return;\n  } else {\n    var div = document.createElement('div');\n    div.className = 'lrow num on';\n    div.innerHTML = '\u003cspan class=\"chip\">验算 ' + n2step + '\u003c/span>\u003cspan class=\"num\">' + N2_STEPS[n2step] + '\u003c/span>';\n    row.parentNode.appendChild(div);\n  }\n  if (n2step === 0) sfx('tap');\n  else sfx('ok');\n  n2step++;\n}\ndocument.getElementById('n2').addEventListener('click', n2next);\nfunction checkReady() {\n  if (placedClues === 4 && n1ok && n2ok) {\n    note.textContent = '两项终检全过——盖章归档。';\n    note.className = 'note good';\n    stampBtn.disabled = false;\n  }\n}\nstampBtn.addEventListener('click', function () {\n  stamped = true;\n  sfx('win');\n  document.getElementById('seal').classList.add('stamped');\n  var n = mistakes === 0 ? 3 : (mistakes \u003c= 2 ? 2 : 1);\n  stars.save('08', n);\n  stampBtn.hidden = true;\n  againBtn.hidden = false;\n  note.innerHTML = '判词：\u003cb class=\"hl\">一条定理，两种证法，一样成立。\u003c/b>你为本案拿下 \u003cb class=\"num\">' + n + '\u003c/b> 颗星。';\n  note.className = 'note good';\n});\nagainBtn.addEventListener('click', function () {\n  sfx('tap');\n  location.reload();\n});\nhintBtn.addEventListener('click', function () {\n  note.className = 'note';\n  note.textContent = HINTS[Math.min(hintIdx, HINTS.length - 1)];\n  hintIdx++;\n  sfx('tap');\n});\ndocument.getElementById('n1').addEventListener('click', function () { this.classList.add('on'); });\nbuildClues();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },
    { title: "无数证明", src: "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>勾股定理双证记 · 09 · 无数种证明\u003c/title>\n\u003cstyle>\n/* ========== 一、配色：蓝图里选定的那一组，整套课件每一页完全一样 ========== */\n:root {\n  --bg: #F2F4F6;                      /* 底色 */\n  --surface: #FFFFFF;                 /* 卡片、面板 */\n  --surface-2: #E4E8EC;               /* 凹槽、轨道、未选中的底 */\n  --ink: #14171C;                     /* 主文字 */\n  --ink-2: #4D5560;                   /* 次要文字 */\n  --ink-3: #68717D;                   /* 说明文字 */\n  --line: rgba(20, 23, 28, 0.12);     /* 描边、分隔线 */\n  --accent: #2F5BEA;                  /* 唯一的强调色 */\n  --accent-ink: #FFFFFF;              /* 强调色上面的文字 */\n}\n/* ========== 二、骨架和部件：每一页完全一样，不要改 ========== */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { font-size: clamp(16px, calc(min(1vw, 1.78vh) * 1.12), 34px); }   /* 1rem 跟着屏幕等比缩放，1080p 下约 21px。尺寸都用 rem 写 */\nhtml, body { height: 100%; margin: 0; }\nbody { background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.7; overflow: hidden;\n  font-family: \"PingFang SC\", \"HarmonyOS Sans SC\", \"Microsoft YaHei\", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\nh1, h2, h3, p, ul, ol, figure { margin: 0; }\nh1 { font-size: 3rem; line-height: 1.15; font-weight: 800; text-wrap: balance; }\nh2 { font-size: 2rem; line-height: 1.2; font-weight: 800; text-wrap: balance; }\nh3 { font-size: 1.3rem; line-height: 1.3; font-weight: 700; }\nbutton { font: inherit; color: inherit; }\nsvg { display: block; max-width: 100%; }\n/* 舞台：占满整屏。内容区 main 吃掉标题以下的全部空间 */\n.stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 1.2rem;\n  padding: clamp(20px, 4.5vh, 64px) clamp(20px, 5vw, 110px) clamp(16px, 3vh, 44px); }\n.stage > main { flex: 1; min-height: 0; }\n.kicker { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n[hidden] { display: none !important; }\n.stage > header { text-align: center; }\n.end { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; text-align: center; }\n.badges { display: flex; gap: 2rem; align-items: flex-end; }\n.badge { width: 11rem; }\n.badge svg { width: 100%; height: auto; }\n.score { font-size: 1.15rem; color: var(--ink-2); letter-spacing: 0.06em; }\n.score b { font-size: 2.5rem; color: var(--accent); margin: 0 0.12em; }\n.recap { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }\n.endnote { max-width: 30em; }\n.bonus { display: none; align-items: center; gap: 1.1rem; text-align: left; }\n.bonus.show { display: flex; }\n.bonus svg { width: 7rem; flex: none; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">结案 · 归档\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">无数种证明\u003c/h1>\n  \u003c/header>\n  \u003cmain class=\"end\">\n    \u003cdiv class=\"badges in\" style=\"--i:2\">\n      \u003cfigure class=\"badge\">\n        \u003csvg viewBox=\"0 0 160 190\" role=\"img\" aria-label=\"加菲尔德徽章：拼图与盾形\">\n          \u003cpath d=\"M80 6 L150 30 L150 100 Q150 156 80 184 Q10 156 10 100 L10 30 Z\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"5\" stroke-linejoin=\"round\"/>\n          \u003cpolygon points=\"52,74 96,74 52,126\" fill=\"var(--accent)\" fill-opacity=\"0.2\"/>\n          \u003cpolygon points=\"96,74 118,96 96,126\" fill=\"var(--ink)\" fill-opacity=\"0.12\"/>\n          \u003ccircle class=\"gem\" id=\"g0\" cx=\"60\" cy=\"46\" r=\"11\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"2\"/>\n          \u003ccircle class=\"gem\" id=\"g1\" cx=\"90\" cy=\"46\" r=\"11\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"2\"/>\n          \u003ccircle class=\"gem\" id=\"g2\" cx=\"75\" cy=\"72\" r=\"11\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"2\"/>\n          \u003ctext x=\"80\" y=\"178\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"var(--ink-2)\">加菲尔德 · 拼出梯形\u003c/text>\n        \u003c/svg>\n      \u003c/figure>\n      \u003cfigure class=\"badge\">\n        \u003csvg viewBox=\"0 0 160 190\" role=\"img\" aria-label=\"爱因斯坦徽章：灯泡与垂线\">\n          \u003cpath d=\"M80 10 Q140 10 140 78 Q140 108 112 128 L112 148 L48 148 L48 128 Q20 108 20 78 Q20 10 80 10 Z\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"5\" stroke-linejoin=\"round\"/>\n          \u003crect x=\"52\" y=\"150\" width=\"56\" height=\"14\" rx=\"7\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"4\"/>\n          \u003cpath d=\"M70 96 L70 44 L118 96 Z\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"2.5\"/>\n          \u003ccircle class=\"gem\" id=\"g3\" cx=\"56\" cy=\"60\" r=\"11\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"2\"/>\n          \u003ccircle class=\"gem\" id=\"g4\" cx=\"104\" cy=\"52\" r=\"11\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"2\"/>\n          \u003ccircle class=\"gem\" id=\"g5\" cx=\"80\" cy=\"118\" r=\"11\" fill=\"var(--surface-2)\" stroke=\"var(--line)\" stroke-width=\"2\"/>\n          \u003ctext x=\"80\" y=\"182\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"var(--ink-2)\">爱因斯坦 · 同形一本账\u003c/text>\n        \u003c/svg>\n      \u003c/figure>\n    \u003c/div>\n    \u003cp class=\"score num in\" style=\"--i:3\">本课星星 \u003cb id=\"totalNum\">0\u003c/b> ／ 6\u003c/p>\n    \u003cdiv class=\"recap in\" style=\"--i:4\">\n      \u003cspan class=\"chip\">加菲尔德：梯形面积，两种算法\u003c/span>\n      \u003cspan class=\"chip\">爱因斯坦：同形放大，一本账\u003c/span>\n      \u003cspan class=\"chip\">判案思路：面积会说话\u003c/span>\n      \u003cspan class=\"chip\">定理的证法已收集 400 多种\u003c/span>\n    \u003c/div>\n    \u003cp class=\"note in endnote\" style=\"--i:5\" id=\"note\">徽章上的宝石，正被你的星星一颗颗点亮……\u003c/p>\n    \u003cdiv class=\"bonus card in\" id=\"bonus\">\n      \u003csvg viewBox=\"0 0 120 120\" role=\"img\" aria-label=\"赵爽弦图\">\n        \u003crect x=\"10\" y=\"10\" width=\"100\" height=\"100\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n        \u003cpolygon points=\"50,10 110,50 70,110 10,70\" fill=\"var(--accent)\" fill-opacity=\"0.2\" stroke=\"var(--accent)\" stroke-width=\"2.5\"/>\n        \u003cpolygon points=\"10,10 50,10 10,70\" fill=\"var(--ink)\" fill-opacity=\"0.1\"/>\n        \u003cpolygon points=\"110,10 50,10 110,50\" fill=\"var(--ink)\" fill-opacity=\"0.1\"/>\n        \u003cpolygon points=\"110,110 110,50 70,110\" fill=\"var(--ink)\" fill-opacity=\"0.1\"/>\n        \u003cpolygon points=\"10,110 10,70 70,110\" fill=\"var(--ink)\" fill-opacity=\"0.1\"/>\n        \u003ctext x=\"60\" y=\"118\" text-anchor=\"middle\" font-size=\"14\" fill=\"var(--ink-3)\">弦图 · 赵爽\u003c/text>\n      \u003c/svg>\n      \u003cdiv>\n        \u003ch3>第三份手稿已到馆\u003c/h3>\n        \u003cp class=\"small\">约 1800 年前，中国的赵爽用一张「弦图」给出了无字证明——四个全同直角三角形，围出一个斜边正方形。去课本里见它。\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"in\" style=\"--i:6\">\n      \u003cbutton class=\"btn ghost\" id=\"replay\">从头再看一遍\u003c/button>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 结算：第 4 页拼图 3 颗 + 第 8 页鉴定 3 颗，最多 6 颗 */\nvar TOTAL_MAX = 6;\nvar s04 = Math.min(stars.all()['04'] || 0, 3);\nvar s08 = Math.min(stars.all()['08'] || 0, 3);\nvar total = Math.min(s04 + s08, TOTAL_MAX);\ndocument.getElementById('totalNum').textContent = total;\nvar note = document.getElementById('note');\nvar gems = [];\nfor (var i = 0; i \u003c TOTAL_MAX; i++) gems.push(document.getElementById('g' + i));\nvar lit = 0;\nfunction lightNext() {\n  if (lit >= total) { finish(); return; }\n  var g = gems[lit];\n  g.setAttribute('fill', 'var(--accent)');\n  g.setAttribute('stroke', 'none');\n  fx(g, 'pop');\n  sfx('ok');\n  lit++;\n  setTimeout(lightNext, 340);\n}\nfunction finish() {\n  if (total >= TOTAL_MAX) {\n    sfx('win');\n    document.getElementById('bonus').classList.add('show');\n    note.innerHTML = '满星归档！档案馆加开新特藏：\u003cb class=\"hl\">第三份手稿\u003c/b>——赵爽弦图，比他们早了一千多年。';\n    note.className = 'note good';\n  } else {\n    var left = TOTAL_MAX - total;\n    note.innerHTML = '还有 \u003cb class=\"num hl\">' + left + '\u003c/b> 颗星，藏在「拼出梯形」和「鉴定报告」两页——翻回去再拿几颗。';\n  }\n}\nsetTimeout(lightNext, 700);\ndocument.getElementById('replay').addEventListener('click', function () {\n  sfx('tap');\n  deck('go', 0);\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" }

function show(i) {

  if (i === cur) return;
  const old = frame, f = document.createElement('iframe'), page = DECK.pages[i];

  if (/^\s*</.test(page.src)) f.srcdoc = page.src; else f.src = page.src;

  };
  $('screen').appendChild(f); frame = f; cur = i;
  segs.forEach((s, k) => { s.classList.toggle('on', k === i); s.classList.toggle('done', k < i); });
  [...$('tocList').children].forEach((li, k) => li.classList.toggle('on', k === i));
  $('count').innerHTML = '<b>' + pad(i + 1) + '</b> / ' + pad(N);
  $('prev').disabled = i === 0; $('next').disabled = i === N - 1;
  try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
}
const next = () => show(cur + 1), prev = () => show(cur - 1);
function toc(open) {
  open = open === undefined ? !$('toc').classList.contains('open') : open;
  $('toc').classList.toggle('open', open); $('veil').classList.toggle('open', open);
}
function fullscreen() {
  const d = document;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else (root.requestFullscreen || root.webkitRequestFullscreen || (() => {})).call(root);
}
$('prev').onclick = prev; $('next').onclick = next;
$('count').onclick = () => toc(); $('menu').onclick = () => toc(); $('veil').onclick = () => toc(false);
$('full').onclick = fullscreen;
$('mute').onclick = () => { muted = !muted; try { localStorage.setItem('deck:muted', muted ? '1' : '0'); } catch (e) {} tellMute(); };
/* 键盘：焦点在外壳上时直接处理；焦点在页面里时，由页面里的"翻页桥"转发过来 */
function key(k) {
  if (k === 'Escape') return toc(false);
  if (k === 'g' || k === 'G') return toc();
  if (k === 'f' || k === 'F') return fullscreen();
  if (k === 'm' || k === 'M') return $('mute').onclick();
  if (k === 'ArrowRight' || k === 'PageDown') next();
  else if (k === 'ArrowLeft' || k === 'PageUp') prev();
  else if (k === 'Home') show(0);
  else if (k === 'End') show(N - 1);
}
addEventListener('keydown', e => { if (!e.ctrlKey && !e.metaKey && !e.altKey) key(e.key); });
addEventListener('message', e => {
  const d = e.data || {};
  if (d.deck === 'next') next(); else if (d.deck === 'prev') prev();
  else if (d.deck === 'go') show(d.index); else if (d.deck === 'key') key(d.key);
});
addEventListener('hashchange', () => show((parseInt(location.hash.slice(1), 10) || 1) - 1));
show((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
