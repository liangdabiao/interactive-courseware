<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>课件</title>
<style>
  /* ============================================================
     课件播放器外壳
     页面占满整屏，只在底部留一条细栏负责翻页。
     这份文件是固定的：只改下面脚本里的 DECK，其余不要动。
     ============================================================ */
  :root { --bg: #000; --ink: #fff; --accent: #FFD23F; --bar: clamp(44px, 5vh, 60px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .player { position: fixed; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) var(--bar); }
  /* ---------- 画面 ---------- */
  .screen { position: relative; min-height: 0; }
  .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .28s ease; }
  .screen iframe.on { opacity: 1; }
  /* ---------- 底栏：‹  进度  05/12  目录  声音  全屏  › ---------- */
  .bar { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto auto auto; align-items: center;
    gap: 2px; padding: 0 max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px, env(safe-area-inset-left)); }
  .ico { width: var(--bar); height: var(--bar); display: grid; place-items: center; border-radius: 50%;
    color: color-mix(in srgb, var(--ink) 55%, transparent); transition: color .15s, transform .12s, opacity .2s; }
  .ico svg { width: 42%; height: 42%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ico:hover { color: var(--accent); }
  .ico:active { transform: scale(.88); }
  .ico[disabled] { opacity: .18; pointer-events: none; }
  .ico.turn svg { width: 50%; height: 50%; stroke-width: 2.2; }
  .ico.turn.next { color: var(--accent); }
  .ico .off { display: none; }
  .ico.muted .on { display: none; }
  .ico.muted .off { display: inline; }
  /* 进度：一页一段，当前页是强调色 */
  .track { position: relative; display: flex; gap: 4px; height: 100%; align-items: center; padding: 0 10px; min-width: 0; }
  .seg { flex: 1 1 0; min-width: 4px; height: 100%; display: grid; align-items: center; }
  .seg i { display: block; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 16%, transparent); transition: background .25s, height .2s, box-shadow .25s; }
  .seg.done i { background: color-mix(in srgb, var(--ink) 46%, transparent); }
  .seg.on i { height: 5px; background: var(--accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 55%, transparent); }
  .seg:hover i { height: 7px; background: color-mix(in srgb, var(--ink) 80%, transparent); }
  .seg.on:hover i { background: var(--accent); }
  .tip { position: absolute; bottom: calc(100% - 4px); transform: translateX(-50%); pointer-events: none; white-space: nowrap;
    padding: 6px 12px; border-radius: 8px; font-size: 13px; line-height: 1.2; font-weight: 600;
    background: var(--ink); color: var(--bg); opacity: 0; transition: opacity .12s; }
  .tip b { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; margin-right: .6em; opacity: .55; }
  .tip.show { opacity: 1; }
  .count { height: var(--bar); padding: 0 12px; border-radius: 10px; white-space: nowrap;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: clamp(13px, 1.5vh, 17px); font-variant-numeric: tabular-nums;
    color: color-mix(in srgb, var(--ink) 45%, transparent); transition: color .15s; }
  .count b { color: var(--ink); font-weight: 700; }
  .count:hover { color: var(--accent); }
  /* 页面加载中：底栏顶边一条流动的细线 */
  .loading { position: absolute; left: 0; right: 0; top: 0; height: 2px; overflow: hidden; opacity: 0; transition: opacity .2s; }
  .loading.show { opacity: 1; }
  .loading::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent); animation: slide 1s ease-in-out infinite; }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }
  /* ---------- 目录：从底栏上方升起 ---------- */
  .toc { position: absolute; left: 0; right: 0; bottom: var(--bar); max-height: min(78%, 640px); overflow-y: auto; z-index: 5;
    padding: clamp(18px, 3vh, 36px) clamp(16px, 5vw, 80px) clamp(14px, 2vh, 24px);
    background: color-mix(in srgb, var(--bg) 90%, var(--ink)); border-top: 1px solid color-mix(in srgb, var(--ink) 14%, transparent);
    transform: translateY(12px); opacity: 0; pointer-events: none; transition: transform .22s ease, opacity .22s ease; }
  .toc.open { transform: none; opacity: 1; pointer-events: auto; }
  .toc h2 { margin: 0 0 clamp(12px, 2vh, 22px); font-size: clamp(16px, 2.2vh, 24px); font-weight: 700; letter-spacing: .02em; }
  .toc ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .toc li button { width: 100%; min-height: 52px; display: grid; grid-template-columns: 2.6em 1fr; align-items: center; gap: 4px; text-align: left;
    padding: 8px 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); transition: border-color .15s, background .15s; }
  .toc li button:hover { border-color: color-mix(in srgb, var(--ink) 45%, transparent); }
  .toc li button b { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 400; color: color-mix(in srgb, var(--ink) 40%, transparent); }
  .toc li button span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toc li.on button { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .toc li.on button b { color: var(--accent); }
  .veil { position: absolute; inset: 0 0 var(--bar) 0; z-index: 4; background: color-mix(in srgb, var(--bg) 55%, transparent); opacity: 0; pointer-events: none; transition: opacity .22s; }
  .veil.open { opacity: 1; pointer-events: auto; }
  @media (max-width: 640px) { #full, #menu { display: none; } .track { gap: 3px; padding: 0 4px; } }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 1ms !important; animation-duration: 1ms !important; } }
</style>
</head>
<body>
<div class="player">
  <main class="screen" id="screen"></main>
  <div class="veil" id="veil"></div>
  <aside class="toc" id="toc" aria-label="目录"><h2 id="tocTitle"></h2><ol id="tocList"></ol></aside>
  <footer class="bar">
    <div class="loading" id="loading"></div>
    <button class="ico turn" id="prev" aria-label="上一页"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="track" id="track"><div class="tip" id="tip"></div></div>
    <button class="count" id="count" aria-label="打开目录"></button>
    <button class="ico" id="menu" aria-label="目录"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <button class="ico" id="mute" aria-label="声音开关"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path class="on" d="M15.5 8.5a5 5 0 010 7M19 5a10 10 0 010 14"/><path class="off" d="M22 9l-6 6M16 9l6 6"/></svg></button>
    <button class="ico" id="full" aria-label="全屏"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg></button>
    <button class="ico turn next" id="next" aria-label="下一页"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M9 5l7 7-7 7"/></svg></button>
  </footer>
</div>
<script>
/* ============================================================
   只改这里：课程标题、三个颜色、页面清单。
   打包成单个文件后，src 会被替换成各页的完整 HTML。
   ============================================================ */
const DECK = {
  title: "勾股定理双证记",
  bg: "#F2F4F6",        // 页面底色（和各页的底色保持一致）
  ink: "#14171C",       // 文字色
  accent: "#2F5BEA",    // 强调色
  pages: [
    { title: "一条定理", src: "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>勾股定理双证记 · 01 · 一条定理，两颗头脑\u003c/title>\n\u003cstyle>\n/* ========== 一、配色：蓝图里选定的那一组，整套课件每一页完全一样 ========== */\n:root {\n  --bg: #F2F4F6;                      /* 底色 */\n  --surface: #FFFFFF;                 /* 卡片、面板 */\n  --surface-2: #E4E8EC;               /* 凹槽、轨道、未选中的底 */\n  --ink: #14171C;                     /* 主文字 */\n  --ink-2: #4D5560;                   /* 次要文字 */\n  --ink-3: #68717D;                   /* 说明文字 */\n  --line: rgba(20, 23, 28, 0.12);     /* 描边、分隔线 */\n  --accent: #2F5BEA;                  /* 唯一的强调色 */\n  --accent-ink: #FFFFFF;              /* 强调色上面的文字 */\n}\n/* ========== 二、骨架和部件：每一页完全一样，不要改 ========== */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { font-size: clamp(16px, calc(min(1vw, 1.78vh) * 1.12), 34px); }   /* 1rem 跟着屏幕等比缩放，1080p 下约 21px。尺寸都用 rem 写 */\nhtml, body { height: 100%; margin: 0; }\nbody { background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.7; overflow: hidden;\n  font-family: \"PingFang SC\", \"HarmonyOS Sans SC\", \"Microsoft YaHei\", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\nh1, h2, h3, p, ul, ol, figure { margin: 0; }\nh1 { font-size: 3rem; line-height: 1.15; font-weight: 800; text-wrap: balance; }\nh2 { font-size: 2rem; line-height: 1.2; font-weight: 800; text-wrap: balance; }\nh3 { font-size: 1.3rem; line-height: 1.3; font-weight: 700; }\nbutton { font: inherit; color: inherit; }\nsvg { display: block; max-width: 100%; }\n/* 舞台：占满整屏。内容区 main 吃掉标题以下的全部空间 */\n.stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 1.2rem;\n  padding: clamp(20px, 4.5vh, 64px) clamp(20px, 5vw, 110px) clamp(16px, 3vh, 44px); }\n.stage > main { flex: 1; min-height: 0; }\n.kicker { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); }\n.lead { font-size: 1.25rem; color: var(--ink-2); max-width: 30em; }\n.small { font-size: max(0.8rem, 14px); color: var(--ink-3); }\n.num { font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }\n.hl { color: var(--accent); }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; min-height: 52px; padding: 0.5em 1.6em;\n  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;\n  transition: transform 0.12s, filter 0.15s, opacity 0.15s; }\n.btn:hover { filter: brightness(1.06); }\n.btn:active { transform: scale(0.97); }\n.btn[disabled] { opacity: 0.4; cursor: not-allowed; }\n.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }\n.card { background: var(--surface); border-radius: 1rem; padding: 1.4rem; }\n.chip { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.15em 0.8em; border-radius: 999px;\n  background: var(--surface-2); color: var(--ink-2); font-size: max(0.8rem, 14px); font-weight: 600; white-space: nowrap; }\n/* 反馈区：固定放在页面里的一行，不用弹窗。对 = 强调色加对勾；错 = 文字说明加抖动，不用红色 */\n.note { min-height: 3.4em; color: var(--ink-2); }\n.note.good { color: var(--accent); }\n.note.bad { color: var(--ink); }\n.shake { animation: shake 0.32s linear; }\n.pop { animation: pop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }\n@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }\n@keyframes pop { 50% { transform: scale(1.14); } }\n/* 入场：给元素加 class=\"in\"，再用 style=\"--i:1\" 排先后 */\n.in { animation: in 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }\n@keyframes in { from { opacity: 0; transform: translateY(1.2rem); } }\n/* 小屏：改成可以上下滚动的单列 */\n@media (max-width: 720px) {\n  body { overflow: auto; }\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n[hidden] { display: none !important; }\n.stage > header { text-align: center; }\n.cover { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; text-align: center; }\n.cover .lead { margin: 0 auto; }\n.hero { width: min(42rem, 76%); }\n.hero svg { width: 100%; height: auto; }\n.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawline 0.9s ease forwards; animation-delay: calc(var(--d, 0) * 1s); }\n@keyframes drawline { to { stroke-dashoffset: 0; } }\n.formula { font-size: 1.9rem; font-weight: 800; letter-spacing: 0.05em; }\n.badges { display: flex; gap: 0.9rem; flex-wrap: wrap; justify-content: center; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">档案馆 · 数学史特藏\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">一条定理，两颗头脑\u003c/h1>\n  \u003c/header>\n  \u003cmain class=\"cover\">\n    \u003cfigure class=\"hero in\" style=\"--i:2\">\n      \u003csvg viewBox=\"0 0 560 330\" role=\"img\" aria-label=\"直角三角形与勾股定理\">\n        \u003cpath class=\"draw\" style=\"--d:0\" d=\"M160 280 L160 130\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"6\" stroke-linecap=\"round\" pathLength=\"1\"/>\n        \u003cpath class=\"draw\" style=\"--d:1\" d=\"M160 280 L360 280\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"6\" stroke-linecap=\"round\" pathLength=\"1\"/>\n        \u003cpath class=\"draw\" style=\"--d:2\" d=\"M360 280 L160 130\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"6\" stroke-linecap=\"round\" pathLength=\"1\"/>\n        \u003cpath d=\"M160 258 L182 258 L182 280\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"3\"/>\n        \u003ctext x=\"138\" y=\"212\" text-anchor=\"end\" font-size=\"30\" font-weight=\"800\" fill=\"var(--accent)\" font-family=\"ui-monospace, Menlo, monospace\">a\u003c/text>\n        \u003ctext x=\"260\" y=\"316\" text-anchor=\"middle\" font-size=\"30\" font-weight=\"800\" fill=\"var(--ink)\" font-family=\"ui-monospace, Menlo, monospace\">b\u003c/text>\n        \u003ctext x=\"278\" y=\"188\" text-anchor=\"middle\" font-size=\"30\" font-weight=\"800\" fill=\"var(--ink)\" font-family=\"ui-monospace, Menlo, monospace\">c\u003c/text>\n        \u003ctext x=\"460\" y=\"210\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"800\" fill=\"var(--ink)\" font-family=\"ui-monospace, Menlo, monospace\" opacity=\"0.25\">a²+b²\u003c/text>\n        \u003ctext x=\"460\" y=\"256\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"800\" fill=\"var(--accent)\" font-family=\"ui-monospace, Menlo, monospace\" opacity=\"0.25\">=c²\u003c/text>\n      \u003c/svg>\n    \u003c/figure>\n    \u003cp class=\"formula num in\" style=\"--i:3\">a² + b² = c²\u003c/p>\n    \u003cp class=\"lead in\" style=\"--i:4\">同一条定理，两颗完全不同的头脑：一位是五年后的美国总统，一个 12 岁的孩子。两份手稿，今天开档。\u003c/p>\n    \u003cdiv class=\"badges in\" style=\"--i:5\">\n      \u003cspan class=\"chip num\">1876 · 国会图书馆的草稿纸\u003c/span>\n      \u003cspan class=\"chip num\">1891 · 一张 12 岁的书桌\u003c/span>\n    \u003c/div>\n    \u003cbutton class=\"btn in\" style=\"--i:6\" id=\"start\">开始开档\u003c/button>\n    \u003cp class=\"small num in\" style=\"--i:7\">共 9 页 · 约 40 分钟 · ← → 翻页\u003c/p>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 封面：只负责把门打开 */\ndocument.getElementById('start').addEventListener('click', function () {\n  sfx('ok');\n  deck('next');\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },

; }\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n[hidden] { display: none !important; }\n.duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr); gap: 2.2rem; min-height: 0; }\n.left { display: flex; flex-direction: column; gap: 1.1rem; min-height: 0; }\n.theorem { font-size: 1.35rem; font-weight: 800; text-align: center; }\n.tools { display: flex; flex-direction: column; gap: 0.9rem; min-height: 0; }\n.tool { display: grid; grid-template-columns: 9.5rem 1fr; gap: 1.1rem; align-items: center; text-align: left;\n  padding: 0.9rem 1.1rem; border-radius: 1rem; background: var(--surface); border: 1.5px solid var(--line);\n  cursor: pointer; transition: border-color 0.2s, transform 0.12s; }\n.tool:hover { border-color: color-mix(in srgb, var(--ink) 30%, transparent); }\n.tool:active { transform: scale(0.985); }\n.tool.lit { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }\n.tool.lit h3 { color: var(--accent); }\n.tool svg { width: 100%; height: auto; }\n.tool .no { display: inline-block; font-size: 0.8rem; font-weight: 700; color: var(--ink-3); letter-spacing: 0.12em; margin-bottom: 0.2em; }\n.foot { display: flex; justify-content: flex-end; align-items: center; gap: 1rem; margin-top: auto; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">手稿共用 · 开档工具\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">面积证法的三件工具\u003c/h1>\n  \u003c/header>\n  \u003cmain class=\"duo\">\n    \u003cdiv class=\"left in\" style=\"--i:2\">\n      \u003cp class=\"lead\">两份手稿用的是同一套思路：不啃代数，先用\u003cb class=\"hl\">面积\u003c/b>说话——把图形摆来摆去，数出它的面积。开档前，先把三件工具擦亮。\u003c/p>\n      \u003cdiv class=\"theorem card num\">直角边 a、b，斜边 c：a² + b² = c²\u003c/div>\n      \u003cp class=\"small\">先记住记号：直角三角形两条直角边叫 a 和 b，斜边（直角对面最长那条）叫 c。定理说的就是：两直角边的平方和，等于斜边的平方。\u003c/p>\n      \u003cp class=\"note\" id=\"note\">\u003c/p>\n      \u003cdiv class=\"foot\">\n        \u003cbutton class=\"btn\" id=\"proceed\" hidden>去拆第一份手稿 →\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"tools\">\n      \u003cbutton class=\"tool in\" style=\"--i:3\" id=\"t1\">\n        \u003csvg viewBox=\"0 0 150 92\" aria-hidden=\"true\">\n          \u003crect x=\"14\" y=\"10\" width=\"122\" height=\"72\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n          \u003cline x1=\"75\" y1=\"10\" x2=\"75\" y2=\"82\" stroke=\"var(--accent)\" stroke-width=\"2.5\" stroke-dasharray=\"5 5\"/>\n          \u003ctext x=\"44\" y=\"52\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--ink-2)\">S₁\u003c/text>\n          \u003ctext x=\"106\" y=\"52\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--ink-2)\">S₂\u003c/text>\n        \u003c/svg>\n        \u003cspan>\u003cspan class=\"no\">工具一\u003c/span>\u003ch3>面积可加性\u003c/h3>\u003cp class=\"small\">整块面积 = 各块之和，不重不漏。拼起来的图，面积就能拆开算。\u003c/p>\u003c/span>\n      \u003c/button>\n      \u003cbutton class=\"tool in\" style=\"--i:4\" id=\"t2\">\n        \u003csvg viewBox=\"0 0 150 104\" aria-hidden=\"true\">\n          \u003cpath d=\"M14 80 L136 80 L108 16 Z\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n          \u003cline x1=\"108\" y1=\"16\" x2=\"108\" y2=\"80\" stroke=\"var(--accent)\" stroke-width=\"2.5\" stroke-dasharray=\"5 5\"/>\n          \u003ctext x=\"75\" y=\"99\" text-anchor=\"middle\" font-size=\"14\" fill=\"var(--ink-3)\">底\u003c/text>\n          \u003ctext x=\"114\" y=\"50\" font-size=\"14\" fill=\"var(--accent)\">高\u003c/text>\n        \u003c/svg>\n        \u003cspan>\u003cspan class=\"no\">工具二\u003c/span>\u003ch3>面积公式\u003c/h3>\u003cp class=\"small\">三角形 S = ½ × 底 × 高；梯形 S = ½ ×（上底 + 下底）× 高。\u003c/p>\u003c/span>\n      \u003c/button>\n      \u003cbutton class=\"tool in\" style=\"--i:5\" id=\"t3\">\n        \u003csvg viewBox=\"0 0 150 104\" aria-hidden=\"true\">\n          \u003cpath d=\"M18 80 L58 80 L18 40 Z\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n          \u003ctext x=\"38\" y=\"99\" text-anchor=\"middle\" font-size=\"14\" fill=\"var(--ink-3)\">1 份面积\u003c/text>\n          \u003cpath d=\"M88 80 L148 80 L88 20 Z\" fill=\"var(--surface-2)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n          \u003cline x1=\"88\" y1=\"50\" x2=\"148\" y2=\"50\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/>\n          \u003cline x1=\"118\" y1=\"80\" x2=\"118\" y2=\"20\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/>\n          \u003ctext x=\"118\" y=\"99\" text-anchor=\"middle\" font-size=\"14\" fill=\"var(--accent)\">4 份面积\u003c/text>\n        \u003c/svg>\n        \u003cspan>\u003cspan class=\"no\">工具三\u003c/span>\u003ch3>同形放大\u003c/h3>\u003cp class=\"small\">形状相同的图形，边长放大几倍，面积就放大「几倍×几倍」。\u003c/p>\u003c/span>\n      \u003c/button>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 三件工具：全部点亮后才放行 */\nvar lit = 0;\nvar note = document.getElementById('note');\nvar proceed = document.getElementById('proceed');\n['t1', 't2', 't3'].forEach(function (id) {\n  document.getElementById(id).addEventListener('click', function () {\n    var card = document.getElementById(id);\n    if (card.classList.contains('lit')) return;\n    card.classList.add('lit');\n    sfx('ok');\n    fx(card, 'pop');\n    lit++;\n    if (lit === 1) note.textContent = '第一件：可加性。两份手稿都靠它把图拆开、拼上。';\n    if (lit === 2) note.textContent = '第二件：公式。摆好的图形，面积要算得出来。';\n    if (lit === 3) {\n      note.textContent = '三件工具齐了。第三件「同形放大」是第二份手稿的关键——先记下，马上会用到。';\n      note.className = 'note good';\n      proceed.hidden = false;\n      sfx('win');\n    }\n  });\n});\nproceed.addEventListener('click', function () { sfx('tap'); deck('next'); });\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },

; }\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n[hidden] { display: none !important; }\n.board { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }\n.board svg { max-height: 100%; width: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }\n.piece { cursor: grab; }\n.piece.dragging { transition: none; cursor: grabbing; }\n.piece.g { transition: transform 0.3s cubic-bezier(0.3, 1, 0.4, 1); }\n.piece.sel polygon { stroke: var(--accent); }\n.ghost { cursor: pointer; }\n.ghost.hot { stroke: var(--accent) !important; fill: color-mix(in srgb, var(--accent) 10%, transparent) !important; }\n.panel { display: flex; align-items: center; gap: 1rem; }\n.panel .note { flex: 1; margin: 0; }\n.progress { white-space: nowrap; }\n.histbar { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.4rem; }\n/* 拼好后的标注淡入 */\n.tag { opacity: 0; transition: opacity 0.6s ease; }\n.tag.show { opacity: 1; }\n#won-outline { stroke: var(--line); }\n.won #won-outline { stroke: var(--accent); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">手稿一 · 加菲尔德，1876\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">两块斜边，咔地对上\u003c/h1>\n  \u003c/header>\n  \u003cmain style=\"display:flex; flex-direction:column; gap:0.6rem; min-height:0;\">\n    \u003cdiv class=\"histbar in\" style=\"--i:2\">\n      \u003cspan class=\"chip num\">1876 · 国会图书馆\u003c/span>\n      \u003cspan class=\"chip\">众议员 J. A. 加菲尔德\u003c/span>\n      \u003cspan class=\"chip\">任务：把三块碎片拼成一个直角梯形\u003c/span>\n    \u003c/div>\n    \u003cfigure class=\"board in\" style=\"--i:3\">\n      \u003csvg id=\"pz\" viewBox=\"0 0 900 540\" role=\"img\" aria-label=\"拼图：三块三角形碎片拼成直角梯形\">\n        \u003cpath id=\"won-outline\" d=\"M90 480 L356 480 L356 328 L90 366 Z\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"3\" stroke-dasharray=\"8 7\"/>\n        \u003cg class=\"ghost\" data-slot=\"1\">\u003cpolygon points=\"90,480 242,480 90,366\" fill=\"var(--surface)\" stroke=\"var(--ink-3)\" stroke-width=\"2.5\" stroke-dasharray=\"6 6\"/>\u003c/g>\n        \u003cg class=\"ghost\" data-slot=\"2\">\u003cpolygon points=\"242,480 356,480 356,328\" fill=\"var(--surface)\" stroke=\"var(--ink-3)\" stroke-width=\"2.5\" stroke-dasharray=\"6 6\"/>\u003c/g>\n        \u003cg class=\"ghost\" data-slot=\"3\">\u003cpolygon points=\"90,366 242,480 356,328\" fill=\"var(--surface)\" stroke=\"var(--ink-3)\" stroke-width=\"2.5\" stroke-dasharray=\"6 6\"/>\u003c/g>\n        \u003cg class=\"piece\" id=\"pc1\" data-slot=\"1\">\u003cpolygon points=\"0,0 152,0 0,-114\" fill=\"var(--accent)\" fill-opacity=\"0.16\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\u003c/g>\n        \u003cg class=\"piece\" id=\"pc2\" data-slot=\"2\">\u003cpolygon points=\"0,0 114,0 114,-152\" fill=\"var(--accent)\" fill-opacity=\"0.16\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\u003c/g>\n        \u003cg class=\"piece\" id=\"pc3\" data-slot=\"3\">\u003cpolygon points=\"0,0 152,114 266,-38\" fill=\"var(--accent)\" fill-opacity=\"0.16\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\u003c/g>\n        \u003cg class=\"tag\" id=\"labels\">\n          \u003ctext x=\"72\" y=\"428\" text-anchor=\"end\" font-size=\"17\" font-weight=\"800\" fill=\"var(--accent)\">a\u003c/text>\n          \u003ctext x=\"374\" y=\"400\" font-size=\"17\" font-weight=\"800\" fill=\"var(--accent)\">b\u003c/text>\n          \u003ctext x=\"223\" y=\"510\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"800\" fill=\"var(--ink)\">a＋b\u003c/text>\n          \u003ctext x=\"180\" y=\"410\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"800\" fill=\"var(--ink-2)\">c\u003c/text>\n          \u003ctext x=\"312\" y=\"396\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"800\" fill=\"var(--ink-2)\">c\u003c/text>\n        \u003c/g>\n        \u003cg class=\"tag\" id=\"areas\">\n          \u003ctext x=\"146\" y=\"444\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink-2)\">½ab\u003c/text>\n          \u003ctext x=\"316\" y=\"432\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink-2)\">½ab\u003c/text>\n          \u003ctext x=\"228\" y=\"392\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--accent)\">½c²\u003c/text>\n        \u003c/g>\n        \u003ctext x=\"420\" y=\"468\" font-size=\"15\" fill=\"var(--ink-3)\">拼成直角梯形：a、b 平行，高是 a＋b\u003c/text>\n      \u003c/svg>\n    \u003c/figure>\n    \u003cdiv class=\"panel in\" style=\"--i:4\">\n      \u003cspan class=\"chip progress num\" id=\"progress\">已归位 0 ／ 3\u003c/span>\n      \u003cp class=\"note\" id=\"note\">按住碎片拖到虚线位置；或先点碎片、再点虚线格。三块都要归位。\u003c/p>\n      \u003cbutton class=\"btn ghost\" id=\"hintBtn\">提示\u003c/button>\n      \u003cbutton class=\"btn\" id=\"goNext\" hidden>带着梯形去算账 →\u003c/button>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 碎片与归宿（u = 38：a = 114，b = 152，c = 190，底 = a＋b = 266） */\nvar PIECES = [\n  { id: 'pc1', slot: '1', home: [70, 190],   target: [90, 480] },\n  { id: 'pc2', slot: '2', home: [340, 200],  target: [242, 480] },\n  { id: 'pc3', slot: '3', home: [560, 125],  target: [90, 366] }\n];\nvar HINTS = [\n  '方法：直角三角形两块要贴着梯形的左下和右下，等腰直角那块立在中间、斜边朝右上。',\n  '线索：两块直角三角形的直角，一个在梯形左下角，一个在梯形右下角。',\n  '答案：把每块拖到同形状的虚线格上，虚线会变蓝提醒你。'\n];\nvar svg = document.getElementById('pz');\nvar note = document.getElementById('note');\nvar progress = document.getElementById('progress');\nvar goNext = document.getElementById('goNext');\nvar placed = 0, done = false, hintIdx = 0;\nvar selected = null;\nfunction xy(evt) {\n  var pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;\n  return pt.matrixTransform(svg.getScreenCTM().inverse());\n}\nfunction setPos(el, x, y) { el.style.transform = 'translate(' + x + 'px,' + y + 'px)'; }\nfunction centroid(el, tx, ty) {\n  var pts = el.querySelector('polygon').points;\n  var cx = 0, cy = 0;\n  for (var i = 0; i \u003c pts.numberOfItems; i++) { cx += pts.getItem(i).x; cy += pts.getItem(i).y; }\n  return [cx / pts.numberOfItems + tx, cy / pts.numberOfItems + ty];\n}\nvar drag = null;\nPIECES.forEach(function (p) {\n  var el = document.getElementById(p.id);\n  setPos(el, p.home[0], p.home[1]);\n  el.addEventListener('pointerdown', function (e) {\n    if (done) return;\n    e.preventDefault();\n    var pt = xy(e);\n    drag = { p: p, el: el, sx: pt.x, sy: pt.y, ox: p.cur[0], oy: p.cur[1], moved: false };\n    el.classList.add('dragging');\n    el.setPointerCapture(e.pointerId);\n  });\n  el.addEventListener('pointermove', function (e) {\n    if (!drag) return;\n    var pt = xy(e);\n    var dx = pt.x - drag.sx, dy = pt.y - drag.sy;\n    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;\n    if (drag.moved) {\n      p.cur = [drag.ox + dx, drag.oy + dy];\n      setPos(el, p.cur[0], p.cur[1]);\n    }\n  });\n  function finish(e) {\n    if (!drag) return;\n    var d = drag; drag = null;\n    el.classList.remove('dragging');\n    if (!d.moved) { toggleSelect(d.p, el); return; }\n    tryPlace(d.p, el);\n  }\n  el.addEventListener('pointerup', finish);\n  el.addEventListener('pointercancel', function () { if (drag) { drag = null; el.classList.remove('dragging'); } });\n});\nfunction toggleSelect(p, el) {\n  if (selected === p) { selected = null; el.classList.remove('sel'); hotGhost(null); return; }\n  if (selected) document.getElementById(selected.id).classList.remove('sel');\n  selected = p;\n  el.classList.add('sel');\n  sfx('tap');\n  hotGhost(p.slot);\n}\nfunction hotGhost(slot) {\n  document.querySelectorAll('.ghost').forEach(function (g) {\n    g.classList.toggle('hot', g.dataset.slot === slot);\n  });\n}\ndocument.querySelectorAll('.ghost').forEach(function (g) {\n  g.addEventListener('click', function () {\n    if (done || !selected) return;\n    var p = selected;\n    selected = null;\n    document.getElementById(p.id).classList.remove('sel');\n    hotGhost(null);\n    tryPlace(p, document.getElementById(p.id));\n  });\n});\nfunction tryPlace(p, el) {\n  var c = centroid(el, p.cur[0], p.cur[1]);\n  var tc = centroid(el, p.target[0], p.target[1]);\n  var dist = Math.hypot(c[0] - tc[0], c[1] - tc[1]);\n  if (dist \u003c 48) {\n    p.cur = [p.target[0], p.target[1]];\n    el.classList.add('g');\n    setPos(el, p.cur[0], p.cur[1]);\n    placed++;\n    sfx('ok');\n    progress.textContent = '已归位 ' + placed + ' ／ 3';\n    note.className = 'note';\n    if (placed === 1) note.textContent = '第一块卡进去了。虚线的直角梯形，正少这两块斜边和一块「角」。';\n    if (placed === 2) note.textContent = '还剩最后一块。';\n    if (placed === 3) win();\n  } else {\n    sfx('no');\n    fx(el, 'shake');\n    note.textContent = '这一块和这个位置对不上——直角和斜边的朝向得吻合。找它自己的虚线格。';\n    note.className = 'note bad';\n  }\n}\nfunction win() {\n  done = true;\n  note.textContent = '咔——梯形拼成了！三个三角形的面积加起来，正好是整个梯形的面积。下一页，两边各算一遍。';\n  note.className = 'note good';\n  svg.classList.add('won');\n  document.getElementById('labels').classList.add('show');\n  document.getElementById('areas').classList.add('show');\n  stars.save('04', wrongCount === 0 ? 3 : (wrongCount \u003c= 2 ? 2 : 1));\n  goNext.hidden = false;\n  sfx('win');\n}\nvar wrongCount = 0;\ndocument.getElementById('hintBtn').addEventListener('click', function () {\n  note.className = 'note';\n  note.textContent = HINTS[Math.min(hintIdx, HINTS.length - 1)];\n  hintIdx++;\n  sfx('tap');\n});\ngoNext.addEventListener('click', function () { sfx('tap'); deck('next'); });\n/* 记录放错次数（用于记星） */\nPIECES.forEach(function (p) { p.cur = [p.home[0], p.home[1]]; });\nvar _tryPlace = tryPlace;\ntryPlace = function (p, el) {\n  var before = placed;\n  var beforeWrong = wrongCount;\n  var c = centroid(el, p.cur[0], p.cur[1]);\n  var tc = centroid(el, p.target[0], p.target[1]);\n  if (Math.hypot(c[0] - tc[0], c[1] - tc[1]) >= 48) wrongCount++;\n  _tryPlace(p, el);\n};\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },

em; color: var(--accent); }\n.lead { font-size: 1.25rem; color: var(--ink-2); max-width: 30em; }\n.small { font-size: max(0.8rem, 14px); color: var(--ink-3); }\n.num { font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }\n.hl { color: var(--accent); }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; min-height: 52px; padding: 0.5em 1.6em;\n  border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;\n  transition: transform 0.12s, filter 0.15s, opacity 0.15s; }\n.btn:hover { filter: brightness(1.06); }\n.btn:active { transform: scale(0.97); }\n.btn[disabled] { opacity: 0.4; cursor: not-allowed; }\n.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }\n.card { background: var(--surface); border-radius: 1rem; padding: 1.4rem; }\n.chip { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.15em 0.8em; border-radius: 999px;\n  background: var(--surface-2); color: var(--ink-2); font-size: max(0.8rem, 14px); font-weight: 600; white-space: nowrap; }\n/* 反馈区：固定放在页面里的一行，不用弹窗。对 = 强调色加对勾；错 = 文字说明加抖动，不用红色 */\n.note { min-height: 3.4em; color: var(--ink-2); }\n.note.good { color: var(--accent); }\n.note.bad { color: var(--ink); }\n.shake { animation: shake 0.32s linear; }\n.pop { animation: pop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }\n@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }\n@keyframes pop { 50% { transform: scale(1.14); } }\n/* 入场：给元素加 class=\"in\"，再用 style=\"--i:1\" 排先后 */\n.in { animation: in 0.56s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }\n@keyframes in { from { opacity: 0; transform: translateY(1.2rem); } }\n/* 小屏：改成可以上下滚动的单列 */\n@media (max-width: 720px) {\n  body { overflow: auto; }\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n[hidden] { display: none !important; }\n.duo { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 2.2rem; min-height: 0; }\n.fig { min-height: 0; display: flex; align-items: center; justify-content: center; }\n.fig svg { max-height: 100%; width: auto; max-width: 100%; }\n.right { display: flex; flex-direction: column; gap: 0.9rem; min-height: 0; }\n.steps { display: flex; flex-direction: column; gap: 0.55rem; }\n.line { display: flex; gap: 0.7em; align-items: baseline; padding: 0.5em 0.6em; border-radius: 0.8rem;\n  background: var(--surface); border: 1.5px solid var(--line); opacity: 0.28; transform: translateX(-6px);\n  transition: opacity 0.35s, transform 0.35s, border-color 0.35s; }\n.line.on { opacity: 1; transform: none; }\n.line.final { border-color: var(--accent); }\n.line.final .num { color: var(--accent); }\n.abchip { transform-box: fill-box; transform-origin: center; transition: transform 0.7s ease, opacity 0.7s ease; }\n.abchip.gone1 { transform: translate(-46px, -26px) rotate(-14deg); opacity: 0; }\n.abchip.gone2 { transform: translate(46px, 26px) rotate(14deg); opacity: 0; }\n.hist { margin-top: auto; }\n.foot { display: flex; justify-content: flex-end; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">手稿一 · 加菲尔德，1876\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">梯形的两种算法\u003c/h1>\n  \u003c/header>\n  \u003cmain class=\"duo\">\n    \u003cfigure class=\"fig in\" style=\"--i:2\">\n      \u003csvg viewBox=\"0 0 470 400\" role=\"img\" aria-label=\"加菲尔德的直角梯形：三个三角形\">\n        \u003cpath d=\"M60 330 L285 330 L285 210 L60 240 Z\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"3\" id=\"trap\"/>\n        \u003cpolygon id=\"tri1\" points=\"60,330 180,330 60,240\" fill=\"var(--accent)\" fill-opacity=\"0\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n        \u003cpolygon id=\"tri2\" points=\"180,330 285,330 285,210\" fill=\"var(--ink)\" fill-opacity=\"0\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n        \u003cpolygon id=\"tri3\" points=\"60,240 180,330 285,210\" fill=\"var(--accent)\" fill-opacity=\"0\" stroke=\"var(--accent)\" stroke-width=\"3\"/>\n        \u003ctext x=\"48\" y=\"290\" text-anchor=\"end\" font-size=\"18\" font-weight=\"800\" fill=\"var(--accent)\">a\u003c/text>\n        \u003ctext x=\"297\" y=\"275\" font-size=\"18\" font-weight=\"800\" fill=\"var(--accent)\">b\u003c/text>\n        \u003ctext x=\"172\" y=\"356\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"800\" fill=\"var(--ink)\">a＋b\u003c/text>\n        \u003ctext x=\"132\" y=\"262\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--ink-2)\">c\u003c/text>\n        \u003ctext x=\"246\" y=\"262\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"var(--ink-2)\">c\u003c/text>\n        \u003ctext id=\"lb1\" x=\"105\" y=\"300\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink-2)\" opacity=\"0\">½ab\u003c/text>\n        \u003ctext id=\"lb2\" x=\"248\" y=\"292\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--ink-2)\" opacity=\"0\">½ab\u003c/text>\n        \u003ctext id=\"lb3\" x=\"175\" y=\"262\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"var(--accent)\" opacity=\"0\">½c²\u003c/text>\n        \u003ctext x=\"66\" y=\"222\" font-size=\"15\" fill=\"var(--ink-3)\">直角梯形：a ∥ b，高 a＋b\u003c/text>\n      \u003c/svg>\n    \u003c/figure>\n    \u003cdiv class=\"right\">\n      \u003cdiv class=\"steps num\">\n        \u003cdiv class=\"line\" id=\"L1\">\u003cspan class=\"chip\">梯形公式\u003c/span>\u003cspan>S ＝ ½(a＋b)(a＋b)\u003c/span>\u003c/div>\n        \u003cdiv class=\"line\" id=\"L2\">\u003cspan class=\"chip\">三块求和\u003c/span>\u003cspan>S ＝ ½ab ＋ ½ab ＋ ½c²\u003c/span>\u003c/div>\n        \u003cdiv class=\"line\" id=\"L3\">\u003cspan class=\"chip\">必须相等\u003c/span>\u003cspan>½(a＋b)² ＝ ab ＋ ½c²\u003c/span>\u003c/div>\n        \u003cdiv class=\"line\" id=\"L4\">\u003cspan class=\"chip\">展开消去\u003c/span>\u003cspan>½a² ＋ \u003cs class=\"abchip\" id=\"ab1\">ab\u003c/s> ＋ ½b² ＝ \u003cs class=\"abchip\" id=\"ab2\">ab\u003c/s> ＋ ½c²\u003c/span>\u003c/div>\n        \u003cdiv class=\"line final\" id=\"L5\">\u003cspan class=\"chip\">两边 ×2\u003c/span>\u003cspan class=\"num\">a² ＋ b² ＝ c²\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cp class=\"note in\" style=\"--i:3\" id=\"note\">同一个梯形，两种算法——账本的两行必须相等。开始对账？\u003c/p>\n      \u003cdiv class=\"hist\">\n        \u003cp class=\"small\">这份证明 1876 年刊于《新英格兰教育杂志》。五年后的 1881 年，加菲尔德就任美国第 20 任总统——后人叫它「总统证明」。\u003c/p>\n        \u003cdiv class=\"foot\" style=\"margin-top:0.6rem\">\n          \u003cbutton class=\"btn in\" style=\"--i:4\" id=\"mainBtn\">开始对账\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 对账五步：每一行都要等前一行站稳了才出现 */\nvar NOTE_TEXT = [\n  '第一行：把梯形整个看——上底 a，下底 b？不对，这里平行的两条边是 a 和 b，高是 a＋b。',\n  '第二行：把梯形拆成三块——两个 ½ab，加中间那块 ½c²。',\n  '两行说的是同一个面积，必须相等。',\n  '左边展开：½a² ＋ ab ＋ ½b²。两边各有一个 ab——让它们同时飞走。',\n  '剩下的，两边 ×2，定理就站在纸面上了。这份手稿，鉴定通过。'\n];\nvar stage = 0;\nvar note = document.getElementById('note');\nvar mainBtn = document.getElementById('mainBtn');\nvar LINES = ['L1', 'L2', 'L3', 'L4', 'L5'].map(function (id) { return document.getElementById(id); });\nfunction setStage(n) {\n  if (n \u003c= stage) return;\n  stage = n;\n  LINES[n - 1].classList.add('on');\n  if (n === 1) {\n    document.getElementById('trap').style.stroke = 'var(--accent)';\n    document.getElementById('lb1').style.opacity = 1;\n    document.getElementById('lb2').style.opacity = 1;\n    document.getElementById('lb3').style.opacity = 1;\n    note.textContent = NOTE_TEXT[0];\n    mainBtn.textContent = '第二行：拆成三块';\n  } else if (n === 2) {\n    ['tri1', 'tri2', 'tri3'].forEach(function (id, i) {\n      document.getElementById(id).style.fillOpacity = [0.16, 0.08, 0.3][i];\n    });\n    note.textContent = NOTE_TEXT[1];\n    mainBtn.textContent = '两行相等';\n  } else if (n === 3) {\n    note.textContent = NOTE_TEXT[2];\n    mainBtn.textContent = '展开，赶走 ab';\n  } else if (n === 4) {\n    sfx('ok');\n    setTimeout(function () {\n      document.getElementById('ab1').classList.add('gone1');\n      document.getElementById('ab2').classList.add('gone2');\n      fx(document.getElementById('L4'), 'pop');\n    }, 250);\n    note.textContent = NOTE_TEXT[3];\n    mainBtn.textContent = '两边 ×2';\n  } else if (n === 5) {\n    LINES[4].querySelector('.num').style.color = 'var(--accent)';\n    fx(LINES[4], 'pop');\n    note.textContent = NOTE_TEXT[4];\n    note.className = 'note good';\n    sfx('win');\n    mainBtn.textContent = '手稿一鉴定通过，去拆第二份 →';\n  }\n}\nmainBtn.addEventListener('click', function () {\n  if (stage \u003c 5) { sfx('tap'); setStage(stage + 1); }\n  else { sfx('tap'); deck('next'); }\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },

o; }\n  .stage { height: auto; min-height: 100dvh; }\n  h1 { font-size: 2.2rem; } h2 { font-size: 1.6rem; }\n}\n@media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }\n/* ========== 三、本页样式：只有这一段每页不同 ========== */\n[hidden] { display: none !important; }\n.lab { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0.7rem; }\n.lab .wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }\n.lab svg { max-height: 100%; width: auto; max-width: 100%; }\n.slider-row { display: flex; align-items: center; gap: 1rem; }\n.slider-row input[type=\"range\"] { flex: 1; accent-color: var(--accent); height: 44px; cursor: pointer; }\n.slider-row .sval { min-width: 6.5em; text-align: right; }\n.panel { display: flex; align-items: center; gap: 1rem; }\n.panel .note { flex: 1; margin: 0; }\n#rep1, #rep2 { transition: transform 0.9s cubic-bezier(0.3, 1, 0.4, 1); }\n#rep1.coin, #rep2.coin { stroke: var(--accent); stroke-width: 4; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"stage\">\n  \u003cheader>\n    \u003cp class=\"kicker in\">手稿二 · 爱因斯坦，12 岁\u003c/p>\n    \u003ch1 class=\"in\" style=\"--i:1\">三个三角形，一个模子\u003c/h1>\n  \u003c/header>\n  \u003cmain class=\"lab\">\n    \u003cdiv class=\"histbar in\" style=\"--i:2\" style=\"display:flex; gap:0.6rem; flex-wrap:wrap;\">\n      \u003cspan class=\"chip num\">1891 · 一张书桌\u003c/span>\n      \u003cspan class=\"chip\">垂线把大三角形切成两小块\u003c/span>\n      \u003cspan class=\"chip\">任务：把小块放大，看能不能重合\u003c/span>\n    \u003c/div>\n    \u003cfigure class=\"wrap in\" style=\"--i:3\">\n      \u003csvg id=\"geo\" viewBox=\"0 0 930 520\" role=\"img\" aria-label=\"同形沙盒：把切出来的小三角形放大，与原三角形重合\">\n        \u003cline x1=\"358\" y1=\"224\" x2=\"358\" y2=\"440\" stroke=\"var(--accent)\" stroke-width=\"2.5\" stroke-dasharray=\"6 6\"/>\n        \u003cpolygon points=\"70,440 358,224 358,440\" fill=\"var(--accent)\" fill-opacity=\"0.16\"/>\n        \u003cpolygon points=\"358,224 358,440 520,440\" fill=\"var(--ink)\" fill-opacity=\"0.1\"/>\n        \u003cpath d=\"M70 440 L520 440 L358 224 Z\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n        \u003cpath d=\"M346 428 L358 416 L370 428\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"2.5\"/>\n        \u003ctext x=\"60\" y=\"468\" font-size=\"18\" font-weight=\"800\" fill=\"var(--ink)\">A\u003c/text>\n        \u003ctext x=\"528\" y=\"468\" font-size=\"18\" font-weight=\"800\" fill=\"var(--ink)\">B\u003c/text>\n        \u003ctext x=\"352\" y=\"208\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"800\" fill=\"var(--ink)\">C\u003c/text>\n        \u003ctext x=\"366\" y=\"468\" font-size=\"16\" font-weight=\"700\" fill=\"var(--accent)\">D\u003c/text>\n        \u003ctext x=\"200\" y=\"316\" text-anchor=\"end\" font-size=\"17\" font-weight=\"800\" fill=\"var(--accent)\">b＝360\u003c/text>\n        \u003ctext x=\"446\" y=\"330\" font-size=\"17\" font-weight=\"800\" fill=\"var(--ink-2)\">a＝270\u003c/text>\n        \u003ctext x=\"295\" y=\"468\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"800\" fill=\"var(--ink-2)\">c＝450\u003c/text>\n        \u003cpolygon id=\"rep1\" points=\"\" fill=\"var(--accent)\" fill-opacity=\"0.4\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/>\n        \u003cpolygon id=\"rep2\" points=\"\" fill=\"var(--accent)\" fill-opacity=\"0.4\" stroke=\"var(--ink)\" stroke-width=\"2.5\" visibility=\"hidden\"/>\n        \u003ctext id=\"coinLabel\" x=\"0\" y=\"0\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"800\" fill=\"var(--accent)\" visibility=\"hidden\">同形！\u003c/text>\n      \u003c/svg>\n    \u003c/figure>\n    \u003cdiv class=\"slider-row in\" style=\"--i:4\">\n      \u003cspan class=\"chip\" id=\"stageChip\">第一块 · △ACD\u003c/span>\n      \u003cinput type=\"range\" id=\"scale\" min=\"0.55\" max=\"1.8\" step=\"0.005\" value=\"1\">\n      \u003cspan class=\"sval num\" id=\"sval\">缩放 1.00\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"panel in\" style=\"--i:5\">\n      \u003cspan class=\"chip num\" id=\"areaChip\">复制品面积 3.84 格\u003c/span>\n      \u003cp class=\"note\" id=\"note\">这是垂线切出来的左块 △ACD。拖动滑块把它放大——什么时候它能和整个大三角形 △ABC 重合？\u003c/p>\n      \u003cbutton class=\"btn ghost\" id=\"hintBtn\">提示\u003c/button>\n      \u003cbutton class=\"btn\" id=\"nextBtn\" hidden>换第二块试试 →\u003c/button>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n/* ========== 公共脚本：每一页完全一样，不要改 ========== */\n/* 翻页：页面在播放器里时，把翻页相关的按键交给播放器。页面里想主动翻页，调用 deck('next')。 */\nfunction deck(cmd, index) { if (parent !== window) parent.postMessage({ deck: cmd, index: index }, '*'); }\naddEventListener('keydown', function (e) {\n  if (parent === window || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;\n  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;\n  if (/^(ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Escape|g|G|f|F|m|M)$/.test(e.key)) parent.postMessage({ deck: 'key', key: e.key }, '*');\n});\n/* 音效：sfx('tap') 点击，sfx('ok') 正确，sfx('no') 错误，sfx('win') 过关。播放器静音时自动不响。 */\nvar deckMuted = false, deckAudio = null;\ntry { deckMuted = localStorage.getItem('deck:muted') === '1'; } catch (e) {}\naddEventListener('message', function (e) { if (e.data && e.data.deck === 'mute') deckMuted = !!e.data.muted; });\nfunction sfx(name) {\n  if (deckMuted) return;\n  try {\n    deckAudio = deckAudio || new (window.AudioContext || window.webkitAudioContext)();\n    var notes = { tap: [[740, 0, 0.05]], ok: [[660, 0, 0.12], [990, 0.09, 0.2]], no: [[220, 0, 0.22]], win: [[523, 0, 0.25], [659, 0.09, 0.25], [784, 0.18, 0.25], [1047, 0.27, 0.5]] }[name] || [];\n    notes.forEach(function (n) {\n      var o = deckAudio.createOscillator(), g = deckAudio.createGain(), t = deckAudio.currentTime + n[1];\n      o.type = name === 'no' ? 'sine' : 'triangle'; o.frequency.value = n[0];\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);\n      o.connect(g); g.connect(deckAudio.destination); o.start(t); o.stop(t + n[2] + 0.03);\n    });\n  } catch (e) {}\n}\n/* 星星：stars.save('07', 3) 记下第 7 页得了 3 颗；stars.total() 读全课累计。同一页重玩只留最高分。 */\nvar stars = {\n  key: 'deck:stars:' + document.title.split('·')[0].trim(),\n  all: function () { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },\n  save: function (page, n) { var a = this.all(); a[page] = Math.max(a[page] || 0, n); try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {} },\n  total: function () { var a = this.all(), t = 0; for (var k in a) t += a[k]; return t; }\n};\n/* 动一下：fx(元素, 'shake') 答错时抖一抖，fx(元素, 'pop') 答对时弹一下 */\nfunction fx(el, name) { el.classList.remove(name); void el.offsetWidth; el.classList.add(name); }\n\u003c/script>\n\u003cscript>\n/* ========== 本页脚本：内容数据写在最上面，逻辑写在下面 ========== */\n/* 沙盒参数（3-4-5，1 格 = 1 面积单位）：△ACD = 3.84 格，△CBD = 2.16 格，△ABC = 6 格 */\nvar STAGES = [\n  {\n    which: 'rep1', s0: 3.84, target: 1.25, chip: '第一块 · △ACD',\n    range: [0.55, 1.45],\n    coincideTx: 'matrix(-0.8, 0.6, -0.6, -0.8, 1038, 264)',\n    coinText: { x: 250, y: 180, text: '同形！放大 1.25 倍' },\n    notes: ['这是垂线切出来的左块 △ACD。拖动滑块把它放大——什么时候它能和整个大三角形 △ABC 重合？',\n            '重合需要三条边都对上。复制品的最长边（斜边）是 360，大三角形的最长边是 450。',\n            '答案：450 ÷ 360 ＝ 1.25。就是它！'],\n    done: '重合了！△ACD 放大 1.25 倍就是 △ABC——所以 △ACD 和 △ABC 形状相同。换右块 △CBD 再试一次。'\n  },\n  {\n    which: 'rep2', s0: 2.16, target: 5 / 3, chip: '第二块 · △CBD',\n    range: [0.9, 1.85],\n    coincideTx: 'matrix(0.6, 0.8, 0.8, -0.6, -192, 224)',\n    coinText: { x: 640, y: 150, text: '同形！放大 5/3 倍' },\n    notes: ['右块 △CBD 来了。老规矩：拖滑块，找到能重合的那个缩放。提示：纸片可以翻面。',\n            '这回复制品的斜边是 CB＝270，大三角形的斜边 AB＝450。',\n            '答案：450 ÷ 270 ＝ 5/3 ≈ 1.67。翻个面，严丝合缝。'],\n    done: '两块都能放大成 △ABC——三个三角形同形！同一副模子，面积就有了统一的算法。'\n  }\n];\nvar stageIdx = 0, s = 1, missCount = 0, solved = [false, false];\nvar slider = document.getElementById('scale');\nvar sval = document.getElementById('sval');\nvar areaChip = document.getElementById('areaChip');\nvar stageChip = document.getElementById('stageChip');\nvar note = document.getElementById('note');\nvar nextBtn = document.getElementById('nextBtn');\nvar coinLabel = document.getElementById('coinLabel');\nvar rep = [document.getElementById('rep1'), document.getElementById('rep2')];\nvar hintIdx = 0;\nfunction draw() {\n  var st = STAGES[stageIdx], el = rep[stageIdx];\n  if (stageIdx === 0) {\n    el.setAttribute('points', (880 - 288 * s) + ',440 ' + (880 - 288 * s) + ',' + (440 - 216 * s) + ' 880,440');\n  } else {\n    el.setAttribute('points', (600 - 162 * s) + ',440 ' + (600 - 162 * s) + ',' + (440 - 216 * s) + ' 600,440');\n  }\n  sval.textContent = '缩放 ' + s.toFixed(2);\n  areaChip.textContent = '复制品面积 ' + (st.s0 * s * s).toFixed(2) + ' 格';\n}\nfunction setStage(i) {\n  stageIdx = i;\n  var st = STAGES[i];\n  stageChip.textContent = st.chip;\n  hintIdx = 0;\n  note.className = 'note';\n  note.textContent = st.notes[0];\n  rep.forEach(function (el, k) { el.setAttribute('visibility', k === i ? 'visible' : 'hidden'); el.classList.remove('coin'); el.style.transform = ''; });\n  coinLabel.setAttribute('visibility', 'hidden');\n  slider.disabled = false;\n  s = 1; slider.value = 1;\n  slider.min = st.range[0]; slider.max = st.range[1];\n  nextBtn.hidden = true;\n  nextBtn.textContent = i === 0 ? '换第二块试试 →' : '去看那本账 →';\n  draw();\n}\nslider.addEventListener('input', function () {\n  if (slider.disabled) return;\n  var st = STAGES[stageIdx];\n  s = parseFloat(slider.value);\n  draw();\n  if (Math.abs(s - st.target) \u003c 0.04) succeed();\n});\nslider.addEventListener('change', function () {\n  if (slider.disabled) return;\n  var st = STAGES[stageIdx];\n  if (Math.abs(s - st.target) >= 0.04) {\n    missCount++;\n    sfx('no');\n    note.textContent = s \u003c st.target ? '还差一点——复制品比大三角形小，再放大些。' : '过了——复制品已经比大三角形还大，往回收。';\n  }\n});\nfunction succeed() {\n  var st = STAGES[stageIdx];\n  s = st.target;\n  slider.value = s;\n  slider.disabled = true;\n  draw();\n  sfx('ok');\n  var el = rep[stageIdx];\n  setTimeout(function () {\n    el.classList.add('coin');\n    el.style.transform = st.coincideTx;\n    note.textContent = st.done;\n    note.className = 'note good';\n    solved[stageIdx] = true;\n    setTimeout(function () {\n      coinLabel.setAttribute('x', st.coinText.x);\n      coinLabel.setAttribute('y', st.coinText.y);\n      coinLabel.textContent = st.coinText.text;\n      coinLabel.setAttribute('visibility', 'visible');\n      fx(coinLabel, 'pop');\n      sfx(stageIdx === 0 ? 'ok' : 'win');\n      nextBtn.hidden = false;\n    }, 950);\n  }, 250);\n}\nnextBtn.addEventListener('click', function () {\n  sfx('tap');\n  if (stageIdx === 0) setStage(1);\n  else {\n    nextBtn.hidden = true;\n    note.innerHTML = '两个小三角形都成了 △ABC 的「放大版」——这就是爱因斯坦的全部秘密。去看那本面积账。';\n    setTimeout(function () { deck('next'); }, 1600);\n  }\n});\ndocument.getElementById('hintBtn').addEventListener('click', function () {\n  var st = STAGES[stageIdx];\n  note.className = 'note';\n  note.textContent = st.notes[Math.min(hintIdx, st.notes.length - 1)];\n  hintIdx++;\n  sfx('tap');\n});\nsetStage(0);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },
    { title: "少年证法", src: "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>勾股定理双证记 · 07 · 三块面积，一本账\u003c/title>\n\u003cstyle>\n/* ========== 一、配色：蓝图里选定的那一组，整套课件每一页完全一样 ========== */\n:root {\n  --bg: #F2F4F6;                      /* 底色 */\n  --surface: #FFFFFF;                 /* 卡片、面板 */\n  --surface-2: #E4E8EC;               /* 凹槽、轨道、未选中的底 */\n  --ink: #14171C;                     /* 主文字 */\n  --ink-2: #4D5560;                   /* 次要文字 */\n  --ink-3: #68717D;                   /* 说明文字 */\n  --line: rgba(20, 23, 28, 0.12);     /* 描边、分隔线 */\n  --accent: #2F5BEA;                  /* 唯一的强调色 */\n  --accent-ink: #FFFFFF;              /* 强调色上面的文字 */\n}\n/* ========== 二、骨架和部件：每一页完全一样，不要改 ========== */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { font-size: clamp(16px, calc(min(1vw, 1.78vh) * 1.12), 34px); }   /* 1rem 跟着屏幕等比缩放，1080p 下约 21px。尺寸都用 rem 写 */\nhtml, body { height: 100%; margin: 0; }\nbody { background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.7; overflow: hidden;\n  font-family: \"PingFang SC\", \"HarmonyOS Sans SC\", \"Microsoft YaHei\", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\nh1, h2, h3, p, ul, ol, figure { margin: 0; }\nh1 { font-size: 3rem; line-height: 1.15; font-weight: 800; text-wrap: balance; }\nh2 { font-size: 2rem; line-height: 1.2; font-weight: 800; text-wrap: balance; }\nh3 { font-size: 1.3rem; line-height: 1.3; font-weight: 700; }\nbutton { font: inherit; color: inherit; }\nsvg { display: block; max-width: 100%; }\n/* 舞台：占满整屏。内容区 main 吃掉标题以下的全部空间 */\n.stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 1.2rem;\n  padding: clamp(20px, 4.5vh, 64px) clamp(20px, 5vw, 110px) clamp(16px, 3vh, 44px); }\n.stage > main { flex: 1; min-height: 0; }\n.kicker { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.1
